<!--
  Template: Glassmorphism Card
  Usage: StudioPro.html(glassHTML, glassCSS, '', { start: 0, duration: 5 })
  Customization: Replace text content and background gradient
-->

<!-- HTML -->
<div class="glass-container">
    <div class="glass-card">
        <h1>Glassmorphism</h1>
        <p>Modern UI with blur effect</p>
    </div>
</div>

<!-- CSS -->
<style>
.glass-container {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Inter', sans-serif;
}
.glass-card {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 24px;
    padding: 80px;
    text-align: center;
    max-width: 800px;
}
.glass-card h1 {
    color: white;
    font-size: 72px;
    font-weight: 700;
    margin: 0 0 20px 0;
}
.glass-card p {
    color: rgba(255, 255, 255, 0.8);
    font-size: 28px;
}
</style>
