<!--
  Template: Premium Mesh Gradient (Wisteria Haze)
  Usage: StudioPro.html(meshHTML, meshCSS, '', { start: 0, duration: 5 })
  Colors: Moon White #EAF4FC, Wisteria #B28FCE, Ibis Pink #F4B3C2, Sky #A0D8EF
-->

<!-- HTML -->
<div class="mesh-gradient">
    <div class="content">
        <h1>Premium Design</h1>
        <p>Mesh gradient with soft blur</p>
    </div>
</div>

<!-- CSS -->
<style>
.mesh-gradient {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #EAF4FC;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
}
.mesh-gradient::before {
    content: '';
    position: absolute;
    inset: -14px;
    background:
        radial-gradient(72% 58% at 16.0% 82.0%, #EAF4FC 0%, #EAF4FC 22%, #EAF4FC00 72%),
        radial-gradient(56% 72% at 78.0% 26.0%, #B28FCE 0%, #B28FCE 22%, #B28FCE00 72%),
        radial-gradient(78% 62% at 88.0% 84.0%, #F4B3C2 0%, #F4B3C2 22%, #F4B3C200 72%),
        radial-gradient(50% 44% at 24.0% 16.0%, #A0D8EF 0%, #A0D8EF 22%, #A0D8EF00 72%),
        radial-gradient(130% 120% at 30% 20%, #EAF4FC, #EAF4FC);
    filter: blur(7px);
}
.content {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 80px;
}
.content h1 {
    color: #1a1a2e;
    font-size: 84px;
    font-weight: 700;
    margin: 0 0 20px 0;
}
.content p {
    color: rgba(26, 26, 46, 0.7);
    font-size: 32px;
}
</style>
