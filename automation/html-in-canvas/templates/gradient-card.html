<!--
  Template: Gradient Card
  Usage: StudioPro.html(gradientCardHTML, gradientCardCSS, '', { start: 0, duration: 5 })
  Customization: Replace text content and colors
-->

<!-- HTML -->
<div class="gradient-card">
    <div class="badge">NEW</div>
    <h1>Your Title Here</h1>
    <p class="subtitle">Your subtitle text</p>
</div>

<!-- CSS -->
<style>
.gradient-card {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 80px;
    border-radius: 24px;
    text-align: center;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
}
.badge {
    background: rgba(255,255,255,0.2);
    color: white;
    padding: 8px 24px;
    border-radius: 100px;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 2px;
    margin-bottom: 40px;
}
.gradient-card h1 {
    color: white;
    font-size: 96px;
    font-weight: 700;
    margin: 0 0 20px 0;
}
.subtitle {
    color: rgba(255, 255, 255, 0.85);
    font-size: 36px;
    font-weight: 400;
}
</style>
