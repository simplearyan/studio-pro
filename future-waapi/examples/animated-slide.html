<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 1920px; height: 1080px; overflow: hidden; background: #0f172a; font-family: 'Inter', system-ui, sans-serif; }
        
        .slide { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 80px; }
        
        /* CSS Keyframes — these are seekable via WAAPI */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes growBar {
            from { width: 0%; }
            to { width: var(--bar-width); }
        }
        
        @keyframes countUp {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .title {
            font-size: 72px;
            font-weight: 800;
            color: white;
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
        }
        
        .subtitle {
            font-size: 28px;
            color: #94a3b8;
            margin-top: 20px;
            animation: fadeInUp 0.8s ease-out 0.3s forwards;
            opacity: 0;
        }
        
        .stats {
            display: flex;
            gap: 60px;
            margin-top: 80px;
        }
        
        .stat {
            text-align: center;
            animation: fadeInUp 0.8s ease-out 0.6s forwards;
            opacity: 0;
        }
        
        .stat-number {
            font-size: 64px;
            font-weight: 800;
            color: #6366f1;
            animation: countUp 0.5s ease-out 1s forwards;
            opacity: 0;
        }
        
        .stat-label {
            font-size: 18px;
            color: #94a3b8;
            margin-top: 8px;
        }
        
        .bar-chart {
            width: 80%;
            margin-top: 60px;
        }
        
        .bar-row {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .bar-label {
            width: 120px;
            color: #cbd5e1;
            font-size: 16px;
        }
        
        .bar-track {
            flex: 1;
            height: 32px;
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .bar-fill {
            height: 100%;
            border-radius: 8px;
            animation: growBar 1s ease-out forwards;
            animation-delay: var(--bar-delay, 1.2s);
            width: 0%;
        }
    </style>
</head>
<body>
    <div class="slide">
        <div class="title">India Pollution Report 2024</div>
        <div class="subtitle">Environmental Data Analysis</div>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-number">7M</div>
                <div class="stat-label">Deaths Annually</div>
            </div>
            <div class="stat">
                <div class="stat-number">30%</div>
                <div class="stat-label">Air Pollution</div>
            </div>
            <div class="stat">
                <div class="stat-number">$150B</div>
                <div class="stat-label">Economic Cost</div>
            </div>
        </div>
        
        <div class="bar-chart">
            <div class="bar-row">
                <div class="bar-label">Vehicles</div>
                <div class="bar-track">
                    <div class="bar-fill" style="--bar-width: 80%; --bar-delay: 1.2s; background: #6366f1;"></div>
                </div>
            </div>
            <div class="bar-row">
                <div class="bar-label">Industry</div>
                <div class="bar-track">
                    <div class="bar-fill" style="--bar-width: 65%; --bar-delay: 1.4s; background: #8b5cf6;"></div>
                </div>
            </div>
            <div class="bar-row">
                <div class="bar-label">Agriculture</div>
                <div class="bar-track">
                    <div class="bar-fill" style="--bar-width: 45%; --bar-delay: 1.6s; background: #a78bfa;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="../lib/waapi-seek.js"></script>
    <script>
        // This script makes the slide seekable via seekToFrame()
        // Try in console: seekToFrame(0, 30) → seekToFrame(30, 30) → seekToFrame(60, 30)
    </script>
</body>
</html>
