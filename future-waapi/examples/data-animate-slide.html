<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 1920px; height: 1080px; overflow: hidden; background: #0f172a; font-family: 'Inter', system-ui, sans-serif; }
        
        .slide { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 80px; }
        
        .title { font-size: 72px; font-weight: 800; color: white; }
        .subtitle { font-size: 28px; color: #94a3b8; margin-top: 20px; }
        
        .stats { display: flex; gap: 60px; margin-top: 80px; }
        .stat { text-align: center; }
        .stat-number { font-size: 64px; font-weight: 800; color: #6366f1; }
        .stat-label { font-size: 18px; color: #94a3b8; margin-top: 8px; }
        
        .bar-chart { width: 80%; margin-top: 60px; }
        .bar-row { display: flex; align-items: center; margin-bottom: 16px; }
        .bar-label { width: 120px; color: #cbd5e1; font-size: 16px; }
        .bar-track { flex: 1; height: 32px; background: #1e293b; border-radius: 8px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 8px; }
    </style>
</head>
<body>
    <!--
        DATA-ANIMATE ATTRIBUTES
        
        Instead of writing animate(t) functions, agents write simple attributes:
        - data-animate: animation type (fade-in, slide-up, grow-right, etc.)
        - data-delay: delay before animation starts
        - data-duration: how long the animation takes
        
        The adapter converts these to CSS keyframes automatically.
    -->
    <div class="slide">
        <div class="title" data-animate="slide-up" data-delay="0.2s">
            India Pollution Report 2024
        </div>
        <div class="subtitle" data-animate="fade-in" data-delay="0.5s">
            Environmental Data Analysis
        </div>
        
        <div class="stats">
            <div class="stat" data-animate="scale-up" data-delay="0.8s">
                <div class="stat-number">7M</div>
                <div class="stat-label">Deaths Annually</div>
            </div>
            <div class="stat" data-animate="scale-up" data-delay="1.0s">
                <div class="stat-number">30%</div>
                <div class="stat-label">Air Pollution</div>
            </div>
            <div class="stat" data-animate="scale-up" data-delay="1.2s">
                <div class="stat-number">$150B</div>
                <div class="stat-label">Economic Cost</div>
            </div>
        </div>
        
        <div class="bar-chart">
            <div class="bar-row" data-animate="slide-right" data-delay="1.4s">
                <div class="bar-label">Vehicles</div>
                <div class="bar-track">
                    <div class="bar-fill" data-animate="grow-right" data-delay="1.6s" data-duration="0.8s" style="width: 80%; background: #6366f1;"></div>
                </div>
            </div>
            <div class="bar-row" data-animate="slide-right" data-delay="1.6s">
                <div class="bar-label">Industry</div>
                <div class="bar-track">
                    <div class="bar-fill" data-animate="grow-right" data-delay="1.8s" data-duration="0.8s" style="width: 65%; background: #8b5cf6;"></div>
                </div>
            </div>
            <div class="bar-row" data-animate="slide-right" data-delay="1.8s">
                <div class="bar-label">Agriculture</div>
                <div class="bar-track">
                    <div class="bar-fill" data-animate="grow-right" data-delay="2.0s" data-duration="0.8s" style="width: 45%; background: #a78bfa;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="../lib/waapi-seek.js"></script>
    <script src="../lib/data-animate-adapter.js"></script>
    <script>
        // The adapter auto-initializes and converts data-animate → WAAPI
        // Then seekToFrame() seeks all of them deterministically
        // Try in console: seekToFrame(0, 30) → seekToFrame(45, 30) → seekToFrame(90, 30)
    </script>
</body>
</html>
