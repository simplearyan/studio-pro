<!DOCTYPE html>
<html lang="en">
<head>

<title>Clip Lite – Video Editor</title>
<style>
:root{--bg:#fff;--sf:#f2f2f2;--sf2:#e5e5e5;--on:#0f0f0f;--on2:#606060;--pri:#0f0f0f;--onpri:#fff;--pc:#e0e0e0;--onpc:#0f0f0f;--ol:#cfcfcf;--clip:#dcdcdc;--onclip:#0f0f0f;--tx:#a8c7fa;--ontx:#041e49;--ph:#0f0f0f;

@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121212;--sf:#1e1e1e;--sf2:#2c2c2c;--on:#fff;--on2:#aaa;--pri:#fff;--onpri:#0f0f0f;--pc:#3a3a3a;--onpc:#fff;--ol:#3f3f3f;--clip:#2a2a2a;--onclip:#fff;--tx:#3b6fd4;--ontx:#fff;--ph:#fff}}
:root[data-theme=dark]{--bg:#121212;--sf:#1e1e1e;--sf2:#2c2c2c;--on:#fff;--on2:#aaa;--pri:#fff;--onpri:#0f0f0f;--pc:#3a3a3a;--onpc:#fff;--ol:#3f3f3f;--clip:#2a2a2a;--onclip:#fff;--tx:#3b6fd4;--ontx:#fff;--ph:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--on);font:400 14px/1.43 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.01em;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:24px;height:24px;fill:currentColor;flex:none}
.bar{display:flex;align-items:center;gap:4px;height:64px;padding:0 12px 0 20px}
.bar h1{font-size:22px;font-weight:400;letter-spacing:0;margin:0;flex:1}
.ib{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--on2)}
.ib:hover{background:color-mix(in srgb,var(--on) 8%,transparent)}

.view{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 16px 16px}

#empty{position:absolute;display:flex;align-items:center;gap:12px;background:var(--pc);color:var(--onpc);height:56px;padding:0 24px 0 20px;border-radius:16px;font-size:16px;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.3),0 4px 8px 3px rgba(0,0,0,.15)}
#empty[hidden],#panel[hidden],#ov[hidden]{display:none}
.dock{background:var(--sf);border-radius:28px 28px 0 0;padding-top:4px}

#panel label{min-width:84px;color:var(--on2)}

#panel input[type=range]{flex:1;min-width:140px;accent-color:var(--pri);height:32px}
#panel input[type=text]{flex:1;min-width:160px;height:44px;border-radius:12px;border:1px solid var(--ol);background:var(--sf);color:var(--on);padding:0 16px;font:inherit;user-select:text;-webkit-user-select:text}
#panel input[type=text]:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:transparent}
.chip{height:32px;padding:0 16px;border-radius:8px;border:1px solid var(--ol);color:var(--on2);font-weight:500}
.chip.on{background:var(--pc);color:var(--onpc);border-color:transparent}
.tp{display:flex;align-items:center;justify-content:space-between;padding:4px 12px 0 20px}

.play{width:56px;height:56px;border-radius:50%;background:var(--pri);color:var(--onpri);display:grid;place-items:center}
.play svg{width:28px;height:28px}
.tlw{position:relative;padding-bottom:4px}
.tl{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;min-height:132px;touch-action:pan-x;overscroll-behavior-x:contain;-webkit-touch-callout:none}
.tl::-webkit-scrollbar{display:none}
.inn{width:max-content;min-width:100%}
#ruler{position:relative;height:22px}
#ruler b{position:absolute;top:4px;font-size:11px;font-weight:400;color:var(--on2);transform:translateX(-50%)}
#track,#ttrack{position:relative;display:flex}
#track{height:64px;min-width:1px}
#ttrack{height:34px;margin-top:6px}
.clip{position:relative;height:100%;background:var(--clip);color:var(--onclip);border:2px solid transparent;border-radius:12px;padding:8px 12px;overflow:hidden;white-space:nowrap;font-size:12px;font-weight:500;cursor:pointer;flex:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--on) 6%,transparent)}
.clip span{pointer-events:none}
.clip.sel{border-color:var(--pri)}
.h{display:none;position:absolute;top:0;bottom:0;width:22px;background:var(--pri);touch-action:none;cursor:ew-resize}
.h::after{content:"";position:absolute;top:50%;left:50%;width:3px;height:20px;margin:-10px 0 0 -1.5px;border-radius:2px;background:var(--onpri)}
.clip.sel .h,.tx.sel .h{display:block}
.h[data-h=l]{left:0}.h[data-h=r]{right:0}
.tx{position:absolute;top:0;height:100%;background:var(--tx);color:var(--ontx);border:2px solid transparent;border-radius:10px;padding:5px 10px;font-size:12px;font-weight:500;overflow:hidden;white-space:nowrap;cursor:pointer}
.tx.sel{border-color:var(--pri)}
.ph{position:absolute;left:50%;top:2px;bottom:4px;width:2px;margin-left:-1px;background:var(--ph);pointer-events:none;border-radius:2px}
.ph::before{content:"";position:absolute;top:0;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--ph)}
.tools{display:flex;justify-content:space-around;padding:6px 4px 10px}
.tools button{flex:1;max-width:96px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--on2);padding:4px 0}
.pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .15s}
.tools button:hover .pill{background:color-mix(in srgb,var(--on) 8%,transparent)}
.tools button.on{color:var(--on)}
.tools button.on .pill{background:var(--pc);color:var(--onpc)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:9}
#ov div{background:var(--sf);border-radius:28px;padding:24px;width:min(320px,86vw);text-align:center}
#pb{height:4px;border-radius:2px;background:var(--sf2);margin:20px 0;overflow:hidden}
#pb i{display:block;height:100%;width:0;background:var(--pri)}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--on);color:var(--bg);padding:12px 16px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
#toast.on{opacity:1}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
@media(min-width:900px){.bar{padding-left:32px}.view{padding:8px 32px 20px}.dock{width:min(960px,100%);margin:0 auto 20px;border-radius:28px}.tl{min-height:150px}#track{height:76px}.tools{gap:8px;justify-content:center}}
.tx{height:32px;padding:5px 16px}.tx .h{width:14px;border-radius:8px}.tx .h::after{height:14px;margin-top:-7px}
.tx.sel{touch-action:none;cursor:grab}.tx span{pointer-events:none}
.clip.lift{z-index:3;opacity:.92;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:grabbing}
.ins{position:absolute;top:-2px;bottom:-2px;width:3px;margin-left:-1.5px;background:var(--pri);border-radius:2px;z-index:4}
.addc{flex:none;width:56px;height:100%;margin-left:8px;border-radius:12px;border:2px dashed var(--ol);color:var(--pri);display:grid;place-items:center}
.addc svg{width:28px;height:28px}
#snap{position:absolute;top:22px;bottom:4px;width:2px;margin-left:-1px;background:var(--pri);pointer-events:none;z-index:2}
#tip{position:absolute;top:-4px;transform:translate(-50%,-100%);background:var(--on);color:var(--bg);font-size:12px;font-weight:500;padding:4px 8px;border-radius:6px;pointer-events:none;z-index:5;white-space:nowrap}
#snap[hidden],#tip[hidden]{display:none}
.tl{cursor:grab}.clip,.tx{cursor:pointer}.clip.sel,.tx.sel{cursor:grab}.h:hover{filter:brightness(1.12)}body.scrub,body.scrub *{cursor:grabbing!important}
.tl.multi .clip.sel{touch-action:none}
.mid{display:flex;align-items:center}.mid .ib{width:40px}
.acts{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 8px;scrollbar-width:none}.acts::-webkit-scrollbar{display:none}.acts .chip{flex:none}
.film{position:absolute;inset:0;overflow:hidden;border-radius:10px;pointer-events:none}
.film img{position:absolute;top:0;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.clip{padding:6px 8px}.clip span{position:relative;background:rgba(0,0,0,.55);color:#fff;padding:2px 8px;border-radius:8px}
@media(min-width:900px){.acts{justify-content:center}}
.bar{height:56px;padding:0 8px}
.ib:disabled{opacity:.35;cursor:default}.ib:disabled:hover{background:none}.ib.on{color:var(--on);background:var(--sf2)}
.ar{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 0}
.play{background:none;color:var(--on);width:56px;height:56px}.play svg{width:40px;height:40px}
.tc{display:flex;align-items:center;justify-content:space-between;padding:0 8px}.tc .ib{width:36px;height:36px}.tc .ib svg{width:20px;height:20px}
#time{font-size:18px;color:var(--on2);min-width:0;font-variant-numeric:tabular-nums}#time b{color:var(--on);font-weight:700}
#ruler i{position:absolute;top:9px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--on2);opacity:.7}
#panel{flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:16px;padding:20px 20px 16px;margin:0;min-height:300px;background:var(--sf);border-radius:28px 28px 0 0}
.eh{text-align:center;font-size:18px;font-weight:700}
.eb{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.eb label{flex:1 1 100%;text-align:center;font-size:24px;min-width:0}
.eb input[type=range]{flex:1 1 100%;width:100%}.eb input[type=text]{font-size:16px}
.ef{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pillb{height:44px;padding:0 24px;border-radius:22px;background:var(--sf2);font-weight:500}.pillb.ghost{background:none}.pillb.pri{background:var(--on);color:var(--bg)}
body.es .dock{display:none}
.tools{justify-content:flex-start;overflow-x:auto;gap:2px;padding:6px 8px 10px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 90%,transparent);mask-image:linear-gradient(90deg,#000 90%,transparent)}
.tools::-webkit-scrollbar{display:none}
.tools button{flex:none;width:76px;max-width:none;color:var(--on);border-radius:12px}
.tools button span{font-size:12px;font-weight:500;color:var(--on2)}
.tools button:hover{background:color-mix(in srgb,var(--on) 8%,transparent)}
@media(min-width:900px){.tools{justify-content:center;-webkit-mask-image:none;mask-image:none}#panel{width:min(960px,100%);margin:0 auto 20px;border-radius:28px}}
svg{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.wv{display:block}
#atrack{position:relative;display:flex;height:36px;margin-top:4px}
.aclip{flex:none;height:100%;background:#1f9d83;border:2px solid transparent;border-radius:10px;overflow:hidden;display:flex;align-items:center}
.jn{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--sf);color:var(--on);display:grid;place-items:center;z-index:3;box-shadow:0 0 0 1px var(--ol)}
.jn svg{width:14px;height:14px}.jn.has{background:var(--on);color:var(--bg)}
.clip.sel .h{z-index:4}
#fs{position:absolute;right:24px;bottom:24px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;z-index:9}
.view.fs{position:fixed;inset:0;z-index:8;background:#000;padding:0}.view.fs canvas{border-radius:0}
.sub{flex:1 1 100%;text-align:center;font-size:13px;color:var(--on2)}
</style>
</head>
<body>
<header class="bar">
  <button class="ib" id="theme" title="Light / dark" aria-label="Toggle theme"><svg data-i="sun"></svg></button>
  <span style="flex:1"></span>
  <button class="ib" id="export" disabled title="Export" aria-label="Export video"><svg data-i="up"></svg></button>
</header>
<div class="view">
  <canvas id="cv" width="1280" height="720"></canvas>
  <button id="empty"><svg data-i="plus"></svg>Add video</button>
  <button id="fs" aria-label="Fullscreen preview" title="Fullscreen preview"><svg data-i="fs"></svg></button>
</div>
<div id="panel" hidden></div>
<div class="dock">
  <div class="ar">
    <button class="ib" id="bdel" aria-label="Delete" title="Delete"><svg data-i="trash"></svg></button><button class="ib" id="bsplit" aria-label="Split" title="Split"><svg data-i="cut"></svg></button>
    <span class="mid"><button class="ib" id="fb" aria-label="Previous frame" title="Previous frame"><svg data-i="prev"></svg></button><button class="play" id="play" aria-label="Play"></button><button class="ib" id="ff" aria-label="Next frame" title="Next frame"><svg data-i="next"></svg></button></span>
    <button class="ib" id="undo" aria-label="Undo" title="Undo"><svg data-i="undo"></svg></button><button class="ib" id="redo" aria-label="Redo" title="Redo"><svg data-i="redo"></svg></button>
  </div>
  <div class="tc" id="acts">
    <button class="ib on" data-a="snap" aria-label="Snapping" title="Snapping on/off"><svg data-i="snap"></svg></button>
    <span id="time"><b id="tc">00:00</b> / <span id="tt">00:00</span></span>
    <span><button class="ib" id="zo" aria-label="Zoom out" title="Zoom out"><svg data-i="zo"></svg></button><button class="ib" id="zi" aria-label="Zoom in" title="Zoom in"><svg data-i="zi"></svg></button><button class="ib" data-a="fit" aria-label="Fit all" title="Fit all"><svg data-i="fit"></svg></button></span>
  </div>
  <div class="tlw">
    <div class="tl" id="tl"><div class="inn" id="inn"><div id="ruler"></div><div id="track"></div><div id="atrack"></div><div id="ttrack"></div></div></div>
    <div id="snap" hidden></div><div id="tip" hidden></div><div class="ph"></div>
  </div>
  <nav class="tools" id="tools"></nav>
</div>
<input type="file" id="file" accept="video/*" multiple hidden>
<div id="ov" hidden><div><b>Exporting video…</b><p style="margin:8px 0 0;color:var(--on2)">Keep this tab open until it finishes.</p><div id="pb"><i></i></div><button class="chip" id="cx">Cancel</button></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),ctx=cv.getContext('2d'),tl=$('#tl');
const ICON={
plus:'<path d="M12 5v14M5 12h14"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>',
cut:'<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8 7.5 20 18M8 16.5 20 6"/>',
undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',redo:'<path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/>',
prev:'<path d="m15 6-6 6 6 6"/>',next:'<path d="m9 6 6 6-6 6"/>',up:'<path d="M12 16V4M7 9l5-5 5 5M5 20h14"/>',

snap:'<path d="M5 3v8a7 7 0 0 0 14 0V3h-4v8a3 3 0 0 1-6 0V3z"/>',
zo:'<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2M8 11h6"/>',zi:'<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2M8 11h6M11 8v6"/>',

text:'<path d="M5 6V4h14v2M12 4v16M9 20h6"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/>',
speed:'<path d="M4 18a8 8 0 1 1 16 0M12 18l4-6"/>',volume:'<path d="M4 9v6h4l5 4V5L8 9zM16.5 9a4 4 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/>',

const ic=n=>`<svg viewBox="0 0 24 24">${ICON[n]}</svg>`;
document.querySelectorAll('svg[data-i]').forEach(e=>{e.setAttribute('viewBox','0 0 24 24');e.innerHTML=ICON[e.dataset.i]});
const PLAY='<svg viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M8 5v14l11-7z"/></svg>',PAUSE='<svg viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>';
const AR={'16:9':[1280,720],'9:16':[720,1280],'1:1':[1080,1080],'4:5':[864,1080]},BG=[['Black','#000000'],['Charcoal','#1e1e1e'],['Grey','#808080'],['White','#ffffff']];
let proj={ar:'16:9',bg:'#000000'};
const applyProj=()=>{const d=AR[proj.ar];W=d[0];H=d[1];cv.width=W;cv.height=H},restoreProj=o=>{if(o.proj){proj=o.proj;applyProj()}};
const F={none:'none',vivid:'saturate(1.6) contrast(1.1)',mono:'grayscale(1)',warm:'sepia(.35) saturate(1.3)',cool:'hue-rotate(15deg) saturate(1.1) brightness(1.05)',fade:'contrast(.85) brightness(1.1) saturate(.8)'};
let clips=[],texts=[],srcs={},t=0,total=0,playing=false,sel=null,pps=60,uid=0,active=null,ac,dest,hist=[],rec=null,W=1280,H=720,tool=null,cancelled=false,mime='';
const dur=c=>(c.out-c.in)/c.sp,esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=s=>{s=Math.max(0,s);return Math.floor(s/60)+':'+(s%60).toFixed(1).padStart(4,'0')},fmtS=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const fmtT=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
function syncBtns(){const h=!clips.length;$('#bdel').disabled=$('#bsplit').disabled=$('#fb').disabled=$('#ff').disabled=h;$('#undo').disabled=!hist.length||!!rec;$('#redo').disabled=!redoS.length||!!rec}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),1800)}
function layout(){let s=0;clips.forEach(c=>{c.s=s;s+=dur(c)});total=s;if(clips.length){texts.forEach(x=>{if(x.s+x.d>total)x.d=total-x.s});texts=texts.filter(x=>x.d>=.2)}}
const at=x=>clips.find(c=>x>=c.s&&x<c.s+dur(c))||clips[clips.length-1];
const redoS=[],snap=()=>{redoS.length=0;hist.push(JSON.stringify({clips,texts,proj}));if(hist.length>40)hist.shift()};
function redo(){if(!redoS.length||rec)return;pause();hist.push(JSON.stringify({clips,texts,proj}));const o=JSON.parse(redoS.pop());clips=o.clips;texts=o.texts;restoreProj(o);sel=null;refresh()}

  else if(tool=='trans'){const k=c.tr?c.tr.k:'none';h=`<span class="sub">Between the previous clip and this one</span>`+[['none','None'],['black','Fade black'],['white','Fade white']].map(([v,l])=>`<button class="chip${k==v?' on':''}" data-tk="${v}">${l}</button>`).join('')+(k!='none'?`<label><b id="rv">${c.tr.d.toFixed(1)} s</b></label><input type="range" id="r1" min=".2" max="2" step=".1" value="${c.tr.d}">`:'')}
  else if(tool=='aspect')h=`<span class="sub">Aspect ratio</span>`+Object.keys(AR).map(k=>`<button class="chip${proj.ar==k?' on':''}" data-ar="${k}">${k}</button>`).join('')+`<span class="sub">Background</span>`+BG.map(([n,v])=>`<button class="chip${proj.bg==v?' on':''}" data-bg="${v}">${n}</button>`).join('');
  p.innerHTML=`<div class="eh">${TTL[tool]}</div><div class="eb">${h}</div><div class="ef"><button class="pillb" id="ec">Cancel</button>${tool!='text'?'<button class="pillb ghost" id="er">Reset</button>':''}<button class="pillb pri" id="ed">Done</button></div>`;
  p.hidden=false;document.body.classList.add('es');
}
const P=$('#panel');
P.addEventListener('input',e=>{
  const c=sel&&sel.k=='c'&&clips.find(x=>x.id==sel.id),x=sel&&sel.k=='t'&&texts.find(y=>y.id==sel.id),el=e.target,v=c&&srcs[c.src].v;
  if(el.id=='r1'&&c){
    if(tool=='speed'){c.sp=+el.value;$('#rv').textContent=c.sp+'×';if(v&&active===c)v.playbackRate=c.sp;renderTL()}
    else if(tool=='volume'){c.vol=+el.value;$('#rv').textContent=Math.round(c.vol*100)+'%';if(v)v.volume=c.vol}
    else if(tool=='rotate'){c.rot=+el.value;$('#rv').textContent=c.rot+'°'}
    else if(tool=='trans'){c.tr.d=+el.value;$('#rv').textContent=c.tr.d.toFixed(1)+' s'}
  }
  if(el.id=='ti'&&x){x.t=el.value||' ';renderTL()}
});
P.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.f){curSel().f=d.f;panel()}
  if(d.ar){proj.ar=d.ar;applyProj();panel()}
  if(d.bg){proj.bg=d.bg;panel()}
  if(d.tk){const c=curSel();c.tr={k:d.tk,d:c.tr?c.tr.d:1};panel()}
  if(b.id=='r90'){const c=curSel();let r=(c.rot||0)+90;if(r>180)r-=360;c.rot=r;panel()}
  if(b.id=='ec')closeEdit(false);
  if(b.id=='ed')closeEdit(true);
  if(b.id=='er'){
    if(tool=='aspect'){proj={ar:autoAr(),bg:'#000000'};applyProj()}
    else{const c=curSel();if(tool=='speed')c.sp=1;if(tool=='volume'){c.vol=1;srcs[c.src].v.volume=1}if(tool=='filter')c.f='none';if(tool=='rotate')c.rot=0;if(tool=='trans')c.tr=null}
    refresh();
  }
});
$('#tools').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const k=b.dataset.t;
  if(k=='add')$('#file').click();else if(k=='text')addText();
  else if(k=='dup')dup();else if(k=='ts')trimTo(0);else if(k=='te')trimTo(1);
  else{tool=k=='edit'?'text':k;panel();const i=$('#ti');if(i)i.focus()}
});
$('#bdel').onclick=del;$('#bsplit').onclick=split;
$('#fs').onclick=()=>$('.view').classList.toggle('fs');
cv.onclick=()=>{playing?pause():play()};
addEventListener('keydown',e=>{if(e.key=='Escape')$('.view').classList.remove('fs')});
$('#play').onclick=()=>playing?pause():play();
$('#empty').onclick=()=>$('#file').click();
$('#file').onchange=e=>{[...e.target.files].forEach(addFile);e.target.value=''};
$('#undo').onclick=undo;$('#redo').onclick=redo;
function dup(){
  if(sel&&sel.k=='t'){const x=texts.find(y=>y.id==sel.id);snap();const n={...x,id:++uid,s:Math.min(x.s+x.d,Math.max(0,total-x.d))};texts.push(n);sel={k:'t',id:n.id};return refresh()}
  if(!clips.length)return;const c=curSel();snap();const n={...c,id:++uid};clips.splice(clips.indexOf(c)+1,0,n);sel={k:'c',id:n.id};refresh();
}
function trimTo(end){
  if(!clips.length)return;
  if(sel&&sel.k=='t'){const x=texts.find(y=>y.id==sel.id),o=t-x.s;if(o<.25||o>x.d-.25)return toast('Move the playhead inside the caption');snap();if(end)x.d=o;else{x.s=t;x.d-=o}return refresh()}
  const c=sel&&sel.k=='c'?clips.find(k=>k.id==sel.id):at(t),o=t-c.s;
  if(o<.15||o>dur(c)-.15)return toast('Move the playhead inside the clip');
  snap();pause();if(end)c.out=c.in+o*c.sp;else{c.in+=o*c.sp;t=c.s}refresh();
}
function nudge(dt){if(!clips.length)return;pause();t=clamp(t+dt,0,total);tl.scrollLeft=t*pps;seekVid()}
function hold(b,dt){let iv,to;const st=()=>{clearTimeout(to);clearInterval(iv)};b.onpointerdown=e=>{e.preventDefault();nudge(dt);to=setTimeout(()=>iv=setInterval(()=>nudge(dt),70),350)};b.onpointerup=b.onpointerleave=b.onpointercancel=st}
hold($('#fb'),-1/30);hold($('#ff'),1/30);
$('#acts').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
  if(a=='dup')dup();else if(a=='ts')trimTo(0);else if(a=='te')trimTo(1);
  else if(a=='snap'){snapOn=!snapOn;b.classList.toggle('on',snapOn)}
  else if(a=='fit'){pps=clamp(tl.clientWidth*.8/Math.max(total,1),2,240);renderTL()}
});
$('#zi').onclick=()=>{pps=Math.min(240,pps*1.5);renderTL()};
$('#zo').onclick=()=>{pps=Math.max(2,pps/1.5);renderTL()};
$('#theme').onclick=()=>{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dark?'light':'dark'};
addEventListener('resize',()=>clips.length&&renderTL());
addEventListener('keydown',e=>{
  if(e.target.tagName=='INPUT'&&e.target.type=='text')return;
  if(e.code=='Space'){e.preventDefault();playing?pause():play()}
  else if(e.key=='s')split();else if(e.key=='Delete'||e.key=='Backspace')del();
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='z'){e.preventDefault();e.shiftKey?redo():undo()}else if((e.ctrlKey||e.metaKey)&&e.key=='y'){e.preventDefault();redo()}else if(e.key=='ArrowLeft'){e.preventDefault();nudge(e.shiftKey?-1:-1/30)}else if(e.key=='ArrowRight'){e.preventDefault();nudge(e.shiftKey?1:1/30)}else if(e.key=='d')dup();else if(e.key=='[')trimTo(0);else if(e.key==']')trimTo(1)
});
$('#export').onclick=()=>{
  if(!clips.length||typeof MediaRecorder=='undefined')return toast('Export is not supported in this browser');
  pause();t=0;seekVid();cancelled=false;
  const cs=cv.captureStream(30);dest&&dest.stream.getAudioTracks().forEach(a=>cs.addTrack(a));
  mime=['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  const chunks=[];rec=new MediaRecorder(cs,mime?{mimeType:mime,videoBitsPerSecond:8e6}:{});
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{pause();rec=null;$('#ov').hidden=true;if(cancelled)return;
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:mime||'video/webm'}));a.download='clip-lite.'+(mime.includes('mp4')?'mp4':'webm');a.click();toast('Exported')};
  $('#ov').hidden=false;rec.start();setTimeout(play,150);
};
$('#cx').onclick=()=>{cancelled=true;if(rec&&rec.state!='inactive')rec.stop()};
$('#play').innerHTML=PLAY;refresh();loop();
</script>
</body>
