<!-- The play mark, drawn as a path rather than the sibling page's ▶ text glyph so it can carry a
     colour at all. An SVG favicon can read prefers-color-scheme, so the mark flips with the
     browser's own tab bar: red on light chrome, white on dark, where red goes muddy. No raster
     asset and no extra request — the icon is the file. # is %23 because this is a data URI. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32'><style>path{fill:%23ff0000}@media(prefers-color-scheme:dark){path{fill:%23ffffff}}</style><path d='M9 4v24l19-12z'/></svg>">

<!-- Its own app manifest, so this installs as a separate app from Studio Pro:
     two manifests on one origin means two home-screen icons and two start
     urls. start_url opens the mock rather than the folder's doc hub. The icon
     paths are relative and climb to the app root, which is where public/icons
     lands in both dev ("/") and Pages ("/studio-pro/"). -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">

/* The same service worker the main app registers, resolved relative to this
   page rather than hardcoded: it is generated at the app root with scope "/",
   which already covers this folder, so one worker serves both apps. In dev the
   plugin emits no sw.js, so the failure is expected and swallowed. */
if('serviceWorker' in navigator)addEventListener('load',function(){
  navigator.serviceWorker.register(new URL('../../sw.js',location.href).pathname).catch(function(){});
});
</script>

<!-- The theme is a stored choice, not a guess, and it has to be resolved before the first paint:
     reading it in the main script would show the OS theme for a frame and then flip, which is exactly
     the flash a dark-mode toggle must not have. Until the user says otherwise this still follows
     prefers-color-scheme — that part is the media query in the CSS, not JS — and once they have said
     otherwise the stored value wins on every visit, in both directions. A function declaration rather
     than a var: this is a classic script, and a bare `t` here would collide with the timeline's. -->
<script>
function setTheme(t){
  document.documentElement.dataset.theme=t;
  try{localStorage.setItem('lite:theme',t)}catch(_){}          // private mode throws; the theme still applies
  var m=document.querySelectorAll('meta[name="theme-color"]'),c=t=='dark'?'#0f0f0f':'#ffffff';
  for(var i=0;i<m.length;i++)m[i].removeAttribute('media'),m[i].content=c   // pin the browser chrome to the choice
}
(function(){var t;try{t=localStorage.getItem('lite:theme')}catch(_){}
if(t=='light'||t=='dark')setTheme(t)})();
</script>

   preview pinned (P1) that slot is an exact number — whatever the dock was —
   so `flex:1 1 auto` makes the two the same height in every state instead of
   the sheet floating at whatever its content happened to measure, which is how
   it ended up 37px short of the dock. `min-height:0` is what lets it shrink
   below that content and scroll instead, and the corner radius is gone: with
   the sheet and the dock now one continuous region of the same surface, a
   rounded top edge only announced a boundary that is not there. The >=900px
   layout is untouched — there the dock is a centred card with a bottom margin

/* ── The value + slider block ──────────────────────────────────────────────
   The readout used to be a 20px centred <b> on a line of its own, with the
   slider on the next line down — two separate objects the eye had to pair up.
   The reference ties them together by putting the number on the track's own
   line, right-aligned, so it reads as "this slider, set to this" and costs the
   sheet no width. `.sl` is that pairing: a column of value-over-track, full
   width, so every sheet with a slider gets the same shape. */
.sl{flex:1 1 100%;min-width:0;display:flex;flex-direction:column;gap:6px}
.sv{display:flex;justify-content:flex-end;padding:0 2px;line-height:1;min-height:16px}

/* While the thumb is held, the number is the value you are *setting* rather than
   a label that happens to have moved, so it wears the accent for as long as the
   pointer is down and drops back to the ink colour on release. The value and the
   changed-dot already repaint on every `input`; this is the grab itself. */

   track's vertical middle and at the slider's horizontal middle — the two
   positions a native pseudo-element will not give you. */

.slx .dot{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--on2);opacity:.7;pointer-events:none;display:none}

/* The readout owns the centre, and it does it by covering the guides rather than
   by fading them. This strip used to carry a mask that ramped the guides out over
   50px either side of the playhead — a fixed pixel width doing a job whose scale
   changes with zoom, so at one label interval it swallowed a whole label and at
   the next it swallowed none of it. That inconsistency is what a mask on a
   scrolling strip always costs: its geometry is in screen pixels while the
   content's geometry is in seconds per pixel.

   The timecode has neither problem. It is a fixed-size object in a fixed place,
   so the honest way to stop the two colliding is to let the timecode be opaque
   and sit on top. `.dock` and `.ro` are both transparent, so what is behind the
   strip is `--bg` and the patch is invisible — nothing to see and nothing to
   tune per theme.

   The patch's own 11px ramp is not the old mask in miniature, and the
   difference is the whole argument. That ramp was painted over the strip, so it
   scaled with nothing and described whatever happened to be under it; this one
   is painted on the timecode, so it is measured against an object whose size
   never changes, and it fades the thing being *covered* rather than deciding
   the ruler should switch itself off. At 2s labels and pps 60 — 120px between
   labels against a 116px patch — nothing is ever cut either way; at 1s labels a
   label lands half under the patch, and a hard edge leaves a sliced fragment
   beside the readout while this lets it emerge. The 13px of padding is what
   keeps the ramp inside the padding box and off the digits. */
#rl{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;pointer-events:none}
#rd{position:absolute;left:0;top:0;height:100%}
/* R4: the label tier, revived. This rule used to be written for #ruler b and
   has been dead since the D1 declutter, when #ruler was collapsed to height:0
   and never populated again. The ruler that is actually live is .ro → #rl →
   #rd, so the label lives there now and keeps the same `top:4px` it always had.
   A labelled mark gets a 1px stem so it reads differently from a plain dot —
   the dot sits at the label's own height, the way the reference interleaves
   `·  00:05  ·  00:10  ·` on one line. */
#rd b{position:absolute;top:4px;font-size:11px;font-weight:400;color:var(--on2);transform:translateX(-50%);white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
#rd b::after{content:"";position:absolute;left:50%;top:15px;width:1px;height:4px;background:var(--on2);opacity:.55}
#rd i{position:absolute;top:11px;width:2px;height:2px;margin:-1px 0 0 -1px;border-radius:50%;background:var(--on2);opacity:.55}
#time{position:relative;z-index:1}
.tlw{padding-bottom:8px}.ph{top:0;bottom:0}.ph::before{display:none}
/* D3: the band was sized generously and nothing inside it was allowed to grow —
   .tl is a block-sized scroll container at a fixed min-height, so every pixel the
   dock handed it piled up as dead air under the audio lane (81px of it at
   378x770). .tl now fills .tlw, .inn is a flex column, and the film lane is the
   one row with flex:1 — it takes the slack and nothing else does. That is the
   "video lane never collapses" rule from the reference, and it is why the band
   is allowed to be big in the first place. min-height is what keeps the floor
   honest, and fitView() subtracts the growth back out to recover it.

   max-height is the correction, and it is not optional. Left unbounded the lane
   took all 81px and reached 145px, and because a 9:16 thumbnail is cover-cropped
   into a full-height strip, every frame became a 34px-wide vertical slice through
   the middle of a face — taller lane, *less* readable frame, which is the opposite
   of the point. The lane is capped just under the reference's 80px so a frame
   still reads as a frame; the slack it no longer takes goes back to the preview
   via VIEW_CEIL rather than piling up as air under the waveform. */
.tl{height:100%}
.inn{min-height:100%;display:flex;flex-direction:column}
#track{flex:1 1 auto;min-height:64px;max-height:88px}
.tl{min-height:140px}#ttrack{margin-top:0}
.tx{top:auto;height:14px;padding:0 14px;border:0;border-radius:8px 8px 3px 3px;display:flex;align-items:center;overflow:visible;font-size:11px;font-weight:500;color:#111;transition:height .12s}
.tx span{display:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx.sel{height:34px;border-radius:10px;box-shadow:inset 0 0 0 2px var(--pri);z-index:2}.tx.sel span{display:block}
.tx:not(.sel)::before{content:"";position:absolute;left:0;right:0;top:-16px;height:16px}
.tx .h{border-radius:10px}
#atrack{height:44px}.aclip{background:var(--audio);border-radius:8px}
.jn{width:36px;height:36px;margin:-18px 0 0 -18px;background:#2b2b2b;color:#fff;box-shadow:none}.jn svg{width:16px;height:16px}.jn.has{background:#fff;color:#111;box-shadow:0 0 0 1px #8a8a8a}
.addf{position:absolute;right:10px;width:44px;height:44px;border-radius:50%;background:var(--on);color:var(--bg);display:grid;place-items:center;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.35)}.addf[hidden]{display:none}.addf svg{width:26px;height:26px;stroke-width:1.5}
.tools{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent)}.tools button{width:auto;min-width:68px;padding:2px 12px}.tools button span{font-size:11px;color:var(--on2)}
.vd{flex:none;width:1px;height:34px;align-self:center;background:var(--ol);margin:0 6px}
.tpl{display:flex;gap:8px;flex:1 1 100%;justify-content:center;flex-wrap:wrap}
.tpl .chip{height:40px;padding:0 14px}.tpl .chip span{font-family:Anton,Roboto,sans-serif;font-size:16px;letter-spacing:.02em}
.tp-rainbow{background-image:linear-gradient(90deg,#ff3b30,#ff9500,#34c759,#2f6cff,#af52de);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tp-neon{color:#00e5ff;text-shadow:0 0 8px #00e5ff}.tp-comic{color:#ffd400;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.tp-plain{background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:2px 10px}
/* ── Adjust and Filters: the two shelves the reference puts under the player ──
   Both are a horizontal row of round targets with a label under each and one
   slider underneath, and both are useless without the row: a slider with no
   choice of what it is adjusting is one control pretending to be eight. The row
   scrolls rather than wraps, so adding a knob never costs the sheet a row of
   height, and the dock below has no slack to give. */
.car{display:flex;gap:14px;flex:1 1 100%;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:4px 2px 2px;scroll-snap-type:x proximity}
.car::-webkit-scrollbar{display:none}
.car button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;width:64px;padding:0;background:none;scroll-snap-align:center}
.car .kn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--ol);color:var(--on2);background-color:var(--sf2);background-size:cover;background-position:center;overflow:hidden;position:relative}
/* A card's effect layer rides in a child so the card's own `filter` grades only
   the thumbnail. Putting both on one element would run the chain over the
   vignette and the noise too, and a saturate over a noise tile retints the grain
   — the card would stop being the picture. */
.car .kn>i{position:absolute;inset:0;display:block;background-size:cover;background-position:center}
.car .kn svg{width:22px;height:22px}
.car button.on .kn{border:2px solid var(--on);color:var(--on)}
.car .lb{font-size:11px;line-height:1.25;color:var(--on2);text-align:center}
.car button.on .lb{color:var(--on);font-weight:500}
/* A knob that is off its default carries a small accent dot, so "I changed
   this" outlives the moment you tap a different knob and the ring moves away.
   The ring answers "which knob is the slider on"; the dot answers "which knobs
   hold a value". Two questions, two marks — which is how the reference shows a
   setting was made without stealing the selection cue. */
.car button.chg .kn::after{content:"";position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:var(--acc);border:1.5px solid var(--sf2)}
/* A filter card is a real frame from the clip, carrying that filter's own CSS —
   so the eleven cards are eleven genuinely different pictures of the same
   moment, which is the only way to choose a look. "None" is the crossed disc
   the reference uses, because an unfiltered thumbnail next to ten filtered ones
   reads as "there is no filter", not as the filter you are currently on. */
.car.fcards .kn{width:64px;height:82px;border-radius:10px}
.car.fcards button{width:66px}
.car.fcards .kn svg{width:26px;height:26px}
/* The stacked-effects line. Three lit cards and one slider look much like one
   lit card until you read them, so when more than one effect is on the sheet
   says so in words and offers one tap out. display:flex would beat the [hidden]
   UA rule, hence the explicit rule under it. */
.stack{flex:1 1 100%;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--on) 6%,transparent)}
.stack[hidden]{display:none}
.stack .stx{font-size:12px;line-height:1.35;color:var(--on2);text-align:center}
.stack .stx b{color:var(--on);font-weight:500}
.stack .chip{flex:none;height:30px;padding:0 12px;font-size:13px}
/* ── Rearrange: the clips themselves, as a row you drag ────────────────────
   A different subject from the Filters row — clips in order rather than looks —
   so it is square, carries each clip's length, and draws the selected clip as a
   circle. `touch-action:none` is load-bearing: the whole point of this row is
   that a press-and-move on it must move a clip, not scroll the sheet. */
.rcar{display:flex;gap:14px;flex:1 1 100%;min-width:0;overflow-x:auto;scrollbar-width:none;padding:6px 2px}
.rcar::-webkit-scrollbar{display:none}
.rc{flex:0 0 auto;position:relative;width:72px;height:72px;border-radius:14px;padding:0;background:var(--sf2);overflow:hidden;border:2px solid transparent;touch-action:none}
.rc img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.rc.sel{border-radius:50%;border-color:var(--on)}
.rc.drag{opacity:.5;border-color:var(--acc)}
.rc .td{position:absolute;left:5px;bottom:3px;font-size:10px;font-weight:500;color:#fff;background:rgba(0,0,0,.55);border-radius:4px;padding:0 4px;font-variant-numeric:tabular-nums}
/* The duration badge on a text clip. A caption's length is the one number you
   cannot see by looking at it — the block's width is the length, and width is
   exactly what you are dragging — so it is written on the block. */
.tx .td{position:absolute;left:6px;bottom:1px;font-size:9px;line-height:1.6;font-weight:500;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.62);color:#fff;border-radius:3px;padding:0 4px;pointer-events:none}
.tools button:active{background:color-mix(in srgb,var(--on) 10%,transparent)}
@media(max-width:360px){.tools button{min-width:60px}.ar{padding:0 2px}#time{font-size:12px}.addf{width:40px;height:40px}}
@supports not (color:color-mix(in srgb,red 50%,blue)){.sr{border-bottom:1px solid rgba(127,127,127,.18)}}
/* no sticky hover wash on touch devices — it reads as a broken pressed state */
@media(hover:none){.ib:hover,.tools button:hover,.ib:hover{background:none}}

/* ── header: three columns, the timecode now lives in the middle ────────── */
.bar{display:flex;align-items:center;justify-content:space-between}
.bar .br{display:flex;align-items:center}
/* the readout sits with the ruler, directly above the timeline — not in the header */
.ro{position:relative;height:30px;display:grid;place-items:center}
#time{background:linear-gradient(90deg,transparent 0,var(--bg) 11px,var(--bg) calc(100% - 11px),transparent 100%);padding:1px 13px}
#time{position:relative;z-index:1}

/* ── the ⋮ sheet: rare actions + settings, one home, nothing gesture-only ──
   S1-S7: the Settings sheet stops being a special case. `.set` is now only a
   state flag — the class is still toggled so panel() can tell the two sheets
   apart, but it carries no styling of its own. Everything that made this sheet
   look borrowed is gone: its private padding, its `max-height:64vh` (a magic
   number that never knew how much room the pinned preview left, and redundant
   now that #panel sizes itself and scrolls), and its 13px/--on2 labels, which
   made the quietest text on screen belong to the settings you are least likely
   to check.

   `.sr`/`.sg` stay — a list of four unrelated settings genuinely needs rows, and
   the property sheets have none because each of them edits a single value. The
   inconsistency was never the rows; it was the padding, the type, the missing
   values and the private footer. Rows now speak the shared vocabulary: a 15px
   label in --on like the readout, a tabular value in --on2, and 44px controls
   matching the tap floor everywhere else. Four 48px rows plus the old title
   padding came to 329px against 322px of room at 320x700, which is why Done used
   to sit 1px below the fold; 44px rows and the standard title padding fit with
   room to spare. */
.eb.st{flex-direction:column;align-items:stretch;justify-content:center;flex-wrap:nowrap;gap:0}
.sr{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;border-bottom:1px solid color-mix(in srgb,var(--on) 7%,transparent)}
.sr:last-child{border-bottom:0}
.sr>span:first-child{font-size:15px;font-weight:500;color:var(--on)}   /* the readout's size, not grey caption text */
.sr .val{font-size:13px;font-weight:400;color:var(--on2);font-variant-numeric:tabular-nums;white-space:nowrap}
.sr .chip{height:36px;padding:0 16px;border-radius:18px}
.sg{display:flex;align-items:center;gap:8px;flex:1 1 auto;justify-content:flex-end;min-width:0}
#panel.set .sg input[type=range]{flex:0 1 96px;width:96px;min-width:0;height:32px;accent-color:var(--pri)}
.sg .ib{width:44px;height:44px}
.sw{width:46px;height:28px;border-radius:14px;background:var(--sf2);position:relative;flex:none;transition:background .15s}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--on2);transition:transform .15s,background .15s}
.sw.on{background:var(--acc)}
.sw.on i{transform:translateX(18px);background:#fff}

/* ── B1: the preview owns the top of the screen ──────────────────────────
   The header stops consuming a row. It becomes an overlay across the top of
   the stage, so .view measures from y=0 and a portrait canvas gets the whole
   band — 288x512 instead of 257x456 at 366x836, +26% of the one element the
   user is actually looking at, for no new controls. Fullscreen already sits
   above this (z-index 8 vs 7), so the header disappears with the rest. */
body{position:relative}
.bar{position:absolute;inset:0 0 auto;z-index:7;height:56px;padding:0 6px}
.view{padding-top:0;padding-bottom:0}

/* ── B2r: no scrim at all, and the header gets out of the picture ─────────
   B2 argued a scrim was not optional — with the canvas running under the icons,
   a bright frame would swallow them. The reference settles it the other way and
   it is right: the wash was costing the top 84px of every portrait frame, which
   is the one thing the user opened the app to look at. So .bar paints nothing
   at all now — no background, no ::before, no gradient of any kind — and the
   9:16 frame runs clean to the top edge under the icons.

   Readability is solved with geometry instead of paint.

   When the canvas leaves a margin wide enough to stand in, the icons move into
   that margin, which is exactly what the reference does: ⌂ alone at the far
   left, ⋮ at the far right on the top line, ⤴ sharing underneath it down the
   same margin, ⛶ bottom-right. Dark-on-white in light theme, white-on-black in
   dark — the icon sits on the app's own background, never on the frame. A 9:16
   canvas at this ceiling leaves ~57–75px either side, so the icons clear the
   picture by ~9–27px at every size measured.

   **The icons are bare in every state.** There were two: the margin arrangement
   above, and a 36px chip in --bg for the ratios that run canvas to the edge
   (16:9, 1:1, 4:5). The chip is gone — it was a workaround for the arrangement
   not having been tried first, and once the icons move out of the picture the
   ratio only decides *where* they sit, never what they look like. A chip also
   made the header look like it had cards in it, which is the clutter this whole
   pass is removing. One icon, one appearance, both themes.

   body.gut is decided by the ratio's own shape, not by the pixels the canvas
   happens to leave over. The old test measured the leftover margin and asked
   whether it cleared 52px, and that was a bug dressed as robustness: at
   9:16 the leftover is 72px at 378x770 but 51.6px at 357x836, so the same
   ratio put the icons in the margin at one size and on top of the picture at
   the next. Anything derived from the leftover inherits that drift.

   So the ratio decides — 9:16 is the only format at or past 16/9 — and the
   gutter it needs is then *reserved* as stage padding, so the margin is a
   property of the layout rather than a coincidence of the viewport. That is
   what the old comment meant to buy and did not: the 44px button can no
   longer land on a face, because the canvas is capped short of it.

   The reserved gutter is stage padding, and it is read by fitView() as
   ordinary padding — so the width the canvas may use is already narrower by
   the time it is measured. 52px is the 44px button, the bar's own 4px and 4px
   of air. Fullscreen drops it: there the picture is the whole screen. */

/* the header is an overlay, so it must not eat taps aimed at the stage —
   pointer-events:none on the bar with auto back on the buttons. */
.bar{background:none;pointer-events:none}
.bar .ib{pointer-events:auto}
body.gut .view{padding-left:52px;padding-right:52px}
body.gut .view.fs{padding:0}

/* The arrangement change. The bar grows to hold the stack, which costs
   nothing: it is absolutely positioned over the stage and out of flow. The
   44px button is the same in both states — the arrangement moves where the
   icons sit, never how big they are. */
body.gut .bar{height:auto;padding:0 4px 8px;align-items:flex-start}
body.gut .bar .ib{width:44px;height:44px}
body.gut #theme,body.gut #more{margin-top:6px}
body.gut .br{flex-direction:column;align-items:center;gap:14px}

/* ── B3: one optical scale — a smaller glyph, the identical painted stroke ─
   stroke-width is in viewBox units, so shrinking the render thins the ink:
   24 -> 22px would silently drop 1.6px to 1.47px, which at 11px labels reads
   as washed out. Each value below is 1.6 x 24 / <its px size>, so every group
   paints exactly the 1.6px the mock carried at 24px. Daintier, not fainter. */
svg{width:22px;height:22px;stroke-width:1.75}
.bar svg{width:20px;height:20px;stroke-width:1.92}
.ar .ib svg{width:21px;height:21px;stroke-width:1.83}
.play svg{width:26px;height:26px}
.addf svg{width:24px;height:24px}
.jn svg{width:18px;height:18px;stroke-width:1.9}
#fs svg{width:20px;height:20px;stroke-width:1.92}

/* ── B5: the fullscreen mark is the crop marks and nothing else ─────────
   Three things came off this glyph in a row, and all three were mine: the chip,
   then the drop-shadow, then the ring. The ring went last and was the least
   load-bearing — a 28%-alpha outline around four corner marks that are already
   a shape. What is left is the mark itself, at 20px on the shared optical
   scale, in the icon's own colour: dark on white chrome in light theme, white
   on black in dark.

   `.view.fs` is the one exception and stays white. Fullscreen paints the stage
   black regardless of theme, so a --on icon would vanish on it in light theme.
   It is the one place this glyph sits on the picture rather than the chrome.

   Known: at 1:1 and 4:5 the canvas fills the stage, so this glyph lands on the
   video (40x21px and 29x44px of overlap at 378x770) and a dark --on mark is
   only readable on a bright frame. Unlike the header icons this one has no
   arrangement to move it aside — it is pinned to the preview corner — so the
   two cases cannot be solved the same way. */
.view.fs #fs{color:#fff}

/* ── B4: the readout is the loudest text in the dock, not the quietest ───
   13px made the one number the user checks constantly the smallest thing on
   screen; the reference sets it at ~19px. 15px is the compromise, and the
   hierarchy is already free — <b> is --on, the total is --on2. */
#time{font-size:15px;font-weight:500;letter-spacing:.005em}
.tools button span{font-size:11.5px}
.eh{font-weight:600}
@media(max-width:360px){#time{font-size:14px}}

/* ── C1–C3: the preview gets a ceiling, and the band takes the slack ───────
   With the header out of the flow the preview was the only row with flex:1 and
   no ceiling, so it took every spare pixel on every device — 61% of a 378x770
   screen against 19% for the timeline band. fitView() now sizes it from what the
   canvas can actually use at full width, clamped to 46–54% of the viewport, and
   hands the remainder to the dock, the only thing in the column that can absorb
   it. The max-height here is the pre-first-fit default; the inline flex fitView()
   writes takes over from there. Nothing below the lanes is centring: the band
   grows *downward*, so #track never moves and renderTL()'s measurements hold. */
.view{max-height:54%}
.dock{display:flex;flex-direction:column;flex:1 1 auto}
.ar,.ro{flex:0 0 auto}
.tlw{flex:1 1 auto}
#tools{flex:0 0 auto}

/* ── D1: the chrome is flush, and the 20px it gives back goes to the lanes ─
   Four rows of padding were standing between the preview and the timeline:
   .view 12 bottom, .dock 4 top, .ar 4 top, .tools 6 top + 10 bottom. None of
   it separates anything — the rows have their own backgrounds, borders and
   heights, so the padding was only ever air the timeline was paying rent on.
   All four are gone and the canvas is flush top and bottom.

   The win is 20px of real timeline lane, and it is 20px rather than 32 because
   fitView() decides the split from `want`, which is the height the canvas needs
   *plus the stage padding*. Shrink the padding and `want` shrinks with it, so
   the freed height flows down the ladder to the band instead of staying as
   letterbox under the video. That is why `want` now reads pt/pb off the
   computed style instead of carrying the old 12 as a literal: the two have to
   move together or the preview quietly grows 12px of dead space.

   .ar was already padding-bottom:0, so what it loses is the 4px top — its row is
   now exactly the 48px of its buttons, and the play button touches the video the
   way the reference has it. `.tlw`'s 8px bottom padding is deliberately left:
   it is *inside* the flexible area rather than above it, so it costs the lanes
   nothing, and fitView()'s `lanes=tl.scrollHeight+8` is counting it.

   These two are longhands on purpose. `.view{padding:0 12px}` reads better and is
   wrong: it is a shorthand, so at >=900px it would also beat the desktop
   `padding:8px 32px 20px` that came earlier in the sheet and flatten the wide
   layout's 32px gutters back to 12. Only the top and bottom are the business of
   this pass; the sides belong to whoever set them. */
</style>
</head>
<body>
<header class="bar">
  <button class="ib" id="theme" title="Light / dark" aria-label="Toggle theme"><svg data-i="sun"></svg></button>
  <span class="br"><button class="ib" id="more" aria-label="More" title="Settings and rare actions"><svg data-i="more"></svg></button><button class="ib" id="export" disabled title="Export" aria-label="Export video"><svg data-i="up"></svg></button></span>
</header>
<div class="view">
  <canvas id="cv" width="1280" height="720"></canvas>
  <button id="empty"><svg data-i="plus"></svg>Add video</button>
  <button id="fs" aria-label="Fullscreen preview" title="Fullscreen preview"><svg data-i="fs"></svg></button>
</div>
<div id="panel" hidden></div>
<div class="dock">
  <div class="ar">
    <button class="ib" id="bdel" aria-label="Delete" title="Delete"><svg data-i="trash"></svg></button><button class="ib" id="bsplit" aria-label="Split" title="Split"><svg data-i="cut"></svg></button>
    <span class="mid"><button class="play" id="play" aria-label="Play"></button></span>
    <button class="ib" id="undo" aria-label="Undo" title="Undo"><svg data-i="undo"></svg></button><button class="ib" id="redo" aria-label="Redo" title="Redo"><svg data-i="redo"></svg></button>
  </div>
  <div class="ro">
    <div id="rl"><div id="rd"></div></div>
    <span id="time"><b id="tc">00:00</b> / <span id="tt">00:00</span></span>
  </div>
  <div class="tlw">
    <div class="tl" id="tl"><div class="inn" id="inn"><div id="ttrack"></div><div id="track"></div><div id="atrack"></div></div></div>
    <button class="addf" id="addf" aria-label="Add clip" title="Add clip" hidden><svg data-i="plus"></svg></button><div id="snap" hidden></div><div id="tip" hidden></div><div class="ph"></div>
  </div>
  <nav class="tools" id="tools"></nav>
</div>
<input type="file" id="file" accept="video/*" multiple hidden>
<div id="ov" hidden><div><b>Exporting video…</b><p style="margin:8px 0 0;color:var(--on2)">Keep this tab open until it finishes.</p><div id="pb"><i></i></div><button class="chip" id="cx">Cancel</button></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),ctx=cv.getContext('2d'),tl=$('#tl');

/* The preview ceiling, in one place. The band wants the height its lanes need; the
   preview wants the height the canvas can actually use at full width. Deriving that
   from proj.ar is the whole point of C2: a 16:9 project cannot use the vertical room
   a 9:16 one can, so it stops claiming it and the timeline gets it instead. Clamped
   at both ends so no ratio can either waste the frame or squeeze it past usability.

   GUT_RATIO is the aspect at which the header switches to the margin arrangement:
   9:16 is the tallest format offered and the only one at or past it, so it is the
   only one that reserves a gutter. VIEW_FLOOR/CEIL and BAND_AIR are the ladder. */
const VIEW_FLOOR=.46,VIEW_CEIL=.54,BAND_AIR=24,GUT_RATIO=9/16;

     width the canvas may use is narrower in this state, and every measurement
     below has to see that. Class order does not matter — toggling a class
     invalidates style, and the first clientWidth read forces the recalc. */

  /* The ceiling lives in the inline flex-basis below, so the CSS max-height that
     guards the first paint is cleared here — leaving it at '' would let it clamp
     the computed height back to a flat 54% and eat C2 entirely. */
  v.style.maxHeight='none';

     A sheet hides the dock, and every row this ladder subtracts lives inside it,
     so measuring them with the dock hidden reads zero and hands the entire
     screen to the preview — that is the old `flex:1 1 auto` branch, and it made
     the preview resize to whatever the sheet happened to leave over (+88px and
     +47% of canvas area behind the Settings sheet at 378x770). chrome is
     therefore only measured while the dock is laid out, and reused afterwards:
     opening a sheet changes what is on screen, never how much room the preview
     asked for. There is no early return, so P4 holds by construction — the gutter
     measurement and the filmstrip re-layout below now run in every state,
     including this one, instead of silently skipping behind a `return`. */

    chrome=$('.ar').offsetHeight+$('.ro').offsetHeight+$('#tools').offsetHeight+4;
    /* The band's floor: what the lanes need when the film lane is at its cap.
       Derived from the rows themselves rather than from tl.scrollHeight, because
       the film lane flexes — so scrollHeight *is* the band we just produced, and
       measuring the floor from it makes the ladder feed back into itself: switch
       16:9 -> 9:16 and the floor would still carry the taller band's number, and
       the layout would creep 4px a switch instead of returning. Every term here
       is read from CSS, so retuning a lane height needs no edit to this line.

       Measured inside the same guard as chrome, and for the same reason: the
       lanes live in the dock, so with a sheet open every row below reads 0 and
       the floor collapses to about 108px. The ceiling happens to mask that at
       9:16, but at 16:9 it moved the preview by 3px — a sheet was still moving
       the picture, just by less. Cached here, refreshed the moment the dock is
       laid out again. */

    the range the knob actually pushes. Contrast scales distance from mid-grey,

    bottom fall away) and Shadows is contrast down (open the bottom, let the top

    direction their names promise, on all four pairs. The knob is still a
    two-stop approximation and not a real tone curve — it cannot recover a
    blown highlight, only push it further — and selfcheck.html is what keeps

  const s=tlWidth()/Math.max(pps,.001);
  zv.textContent=(s<10?s.toFixed(1):Math.round(s))+' s across';
  const a=$('#zo'),b=$('#zi');if(a)a.disabled=pps<=ZOOM_MIN;if(b)b.disabled=pps>=ZOOM_MAX;
}

    <div class="sr"><span>Ruler interval</span><button class="chip" id="rulercyc" aria-label="Ruler interval">${rulerLabel()}</button></div>

  </div><div class="ef"><div class="l"></div><div class="m"></div><div class="r"><button class="pillb pri" id="ed">Done</button></div></div>`;

/* Centre the selected target, but only when the row is not already showing it.
   This runs for the sheet's own opening, never for a tap — see panel()'s
   fromRowTap. Called after a scroll offset has been restored, it is the one
   thing that moves a scrolled row on its own, so it must not fire when the user
   chose the card themselves. block:'nearest' keeps it from scrolling the sheet,
   since the knob is vertically on screen. */
function centerOn(car){
  const on=car.querySelector('.on');if(!on)return;
  const a=on.getBoundingClientRect(),b=car.getBoundingClientRect();
  if(a.left>=b.left+2&&a.right<=b.right-2)return;
  on.scrollIntoView({inline:'center',block:'nearest'});
}
/* Selecting a knob updates the sheet in place rather than rebuilding it. The
   slider underneath belongs to whichever knob is lit, which is why this used to
   call panel() — and a rebuild throws the row away with it, so the knob you had
   scrolled to and just tapped jumped back to the left edge while remaining the
   selected one. No new markup is needed: the row is a fixed set of buttons and
   the slider is a fixed control, so the ring, the label weight, the value and
   the readout are all written onto nodes that are already there and the row is
   never touched. Rebuild only if the sheet is not in the shape we expect. */
function adjSync(){
  const c=curSel(),car=$('#panel .car'),r=$('#panel #r1');
  if(!c||!car||!r){panel();return}
  car.querySelectorAll('[data-adj]').forEach(q=>q.classList.toggle('on',q.dataset.adj==adjKey));
  const v=adjVal(c,adjKey),rng=knobRng(adjKey);
  /* Switching knobs can move the floor — grain starts at the left edge, the
     vignette and the tonal knobs at the centre — so the widget is re-ranged with
     the value rather than assumed to match the last knob looked at. */
  r.min=rng[0];r.max=rng[1];
  /* The centre dot belongs to the range, not to the knob list, so switching
     from Grain (floor 0) to a bipolar knob has to add it back — the row is not
     rebuilt here, which is the whole reason adjSync exists. */
  const box=r.closest('.sl');
  if(box){
    box.classList.toggle('bi',rng[0]<0);
    /* The gradient track moves with the knob too. It is the one thing about the
       slider that is a property of *which* knob is selected rather than of its
       value, and adjSync does not rebuild the sheet — so Blue tone's ramp has to
       be written on here or it appears only when the sheet is built with Blue
       tone already picked, which is never. */
    const g=ADJ[adjKey].grad||'';
    box.classList.toggle('gr',!!g);
    if(g)box.style.setProperty('--gr',g);else box.style.removeProperty('--gr');
  }
  r.value=v;paintRange(r);adjMarks();$('#rv').textContent=adjTxt(adjKey,v);
}

    h=`<input type="text" id="ti" maxlength="60" placeholder="Type your title" value="${esc(x.t).replace(/"/g,'&quot;')}"><div class="tpl">`+[['rainbow','Rainbow'],['plain','Plain'],['neon','Neon'],['comic','Comic']].map(([k,l])=>`<button class="chip${(x.tp||'plain')==k?' on':''}" data-tp="${k}"><span class="tp-${k}">${l}</span></button>`).join('')+`</div><div class="sub" id="txinfo">${txInfo(x)}</div>`;
  }else if(tool=='speed')h=sl(c.sp+'×','.25','4',c.sp,'.25');

  else if(tool=='filter'){
    /* One row of thirteen cards, but three different kinds of selection behind
       it, and conflating them is what used to make Grain delete Vivid. A chain
       card picks the look. A layer card toggles that layer on or off and leaves
       the look alone. The slider below belongs to whichever of the three is
       currently relevant — the look if one is picked, otherwise the last layer
       touched — so there is one slider and one readout, not three.

       That is the compromise: three strengths on one slider means the control
       under your thumb has to change meaning when you tap a different card, and
       the alternative (a slider per layer) is three stacked controls on a phone
       where the sheet already has to share its height with the frame. The card

       layer you last tapped, if that layer is on; then any layer that is on; then

  p.hidden=false;document.body.classList.add('es');
  /* Put the row back where the user left it. panel() throws the sheet's markup
     away and rebuilds it, and a new .car is scrolled to 0 — which is how the
     knob you had scrolled out to (Warmth, Sharpen) used to slide back off the

const P=$('#panel');
P.addEventListener('input',e=>{
  const c=sel&&sel.k=='c'&&clips.find(x=>x.id==sel.id),x=sel&&sel.k=='t'&&texts.find(y=>y.id==sel.id),el=e.target,v=c&&srcs[c.src].v;

         otherwise it would offer "Mute" on a clip that is already silent. */

P.addEventListener('click',e=>{

       level you wanted. Fit covers the coarse end, so fine is all this needs. */

     never disagree with it: muting sets `c.vol` to 0, which is what the slider

/* The slider is live under the thumb: every value change already repaints the
   readout and the Adjust knob's changed-dot through the input handler below, and
   this marks the *grab* itself — the readout wears the accent for as long as the
   pointer is down, so the number reads as the value you are setting rather than a
   label that moved. The class is cleared on pointerup anywhere, because a range
   keeps receiving the drag after the pointer has left its own bounds, and on
   pointercancel so an interrupted gesture does not leave the sheet stuck lit. */

  const r=e.target.closest('input[type=range]');if(!r)return;
  P.classList.add('held');
  const off=()=>{P.classList.remove('held');removeEventListener('pointerup',off);removeEventListener('pointercancel',off)};
  addEventListener('pointerup',off);addEventListener('pointercancel',off);
});

$('#empty').onclick=()=>pickFile();
$('#file').onchange=e=>{
  const fs=[...e.target.files];e.target.value='';
  if(replacing){const id=replacing;replacing=null;if(fs[0])replaceWith(id,fs[0]);return}
  fs.forEach(addFile);
};
$('#undo').onclick=undo;$('#redo').onclick=redo;
function dup(){
  if(sel&&sel.k=='t'){const x=texts.find(y=>y.id==sel.id);snap();const n={...x,id:++uid,s:Math.min(x.s+x.d,Math.max(0,total-x.d))};texts.push(n);sel={k:'t',id:n.id};return refresh()}
  if(!clips.length)return;const c=curSel();snap();const n={...c,id:++uid};clips.splice(clips.indexOf(c)+1,0,n);sel={k:'c',id:n.id};refresh();
}
function trimTo(end){
  if(!clips.length)return;
  if(sel&&sel.k=='t'){const x=texts.find(y=>y.id==sel.id),o=t-x.s;if(o<.25||o>x.d-.25)return toast('Move the playhead inside the caption');snap();if(end)x.d=o;else{x.s=t;x.d-=o}return refresh()}
  const c=sel&&sel.k=='c'?clips.find(k=>k.id==sel.id):at(t),o=t-c.s;
  if(o<.15||o>dur(c)-.15)return toast('Move the playhead inside the clip');
  snap();pause();if(end)c.out=c.in+o*c.sp;else{c.in+=o*c.sp;t=c.s}refresh();
}
/* The timeline is display:none while a panel is open, so scrollLeft reads 0 there — writing it
   would clobber the playhead via the scroll handler below. Only touch it when it is on screen. */
function nudge(dt){if(!clips.length)return;pause();t=clamp(t+dt,0,total);if(tl.offsetParent)tl.scrollLeft=t*pps;seekVid()}
/* Zoom bounds, once. pps is pixels-per-second: 2 shows ~170s of timeline on a
   phone (a 20s clip 40px wide) and 240 shows ~1.4s, so both ends are useless —
   which is why the range is not presented as a linear slider any more. */
const ZOOM_MIN=2,ZOOM_MAX=240;
function fitZoom(){const w=tlWidth();pps=clamp(w*.8/Math.max(total,1),ZOOM_MIN,ZOOM_MAX);renderTL();syncZoom()}
/* R5: what automatic mode cannot do is disagree. Somebody trimming to a 30s
   music bed wants `00:30` labelled at every zoom, not `00:02` because they
   pinched. View state, not document state — not in snap(), not undoable, the
   same as snapOn. */
const RULER_MODES=['auto',1,5,10,30,60];
const rulerLabel=()=>rulerMode==='auto'?'Auto':'≥'+(rulerMode>=60?rulerMode/60+'m':rulerMode+'s');
try{if(localStorage.getItem('lite:snap')==='0')snapOn=false}catch(_){}
try{const rm=localStorage.getItem('lite:ruler'),i=RULER_MODES.map(String).indexOf(rm);if(i>-1)rulerMode=RULER_MODES[i]}catch(_){}
$('#more').onclick=()=>{tool=tool=='settings'?null:'settings';panel()};
/* Falls back to the OS only while the user has never chosen; after that the stored value is the
   source of truth and the media query in CSS no longer applies. */
$('#theme').onclick=()=>{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;setTheme(dark?'light':'dark')};
addEventListener('resize',()=>{fitView();paintRange($('#r1'));clips.length&&renderTL()});
addEventListener('keydown',e=>{
  /* Any focused field owns its keys — a range slider included, so an arrow key
     moves the thumb it is on and not the playhead. Restricting this to text
     inputs left arrow keys hijacked on every focused slider. */
  if(e.target.tagName=='INPUT')return;
  if(e.code=='Space'){e.preventDefault();playing?pause():play()}
  else if(e.key=='s')split();else if(e.key=='Delete'||e.key=='Backspace')del();
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='z'){e.preventDefault();e.shiftKey?redo():undo()}else if((e.ctrlKey||e.metaKey)&&e.key=='y'){e.preventDefault();redo()}else if(e.key=='ArrowLeft'){e.preventDefault();nudge(e.shiftKey?-1:-1/30)}else if(e.key=='ArrowRight'){e.preventDefault();nudge(e.shiftKey?1:1/30)}else if(e.key=='d')dup();else if(e.key=='[')trimTo(0);else if(e.key==']')trimTo(1)
});
$('#export').onclick=()=>{
  if(!clips.length||typeof MediaRecorder=='undefined')return toast('Export is not supported in this browser');
  pause();t=0;seekVid();cancelled=false;
  const cs=cv.captureStream(30);dest&&dest.stream.getAudioTracks().forEach(a=>cs.addTrack(a));
  mime=['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  const chunks=[];rec=new MediaRecorder(cs,mime?{mimeType:mime,videoBitsPerSecond:8e6}:{});
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{pause();rec=null;$('#ov').hidden=true;if(cancelled)return;
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:mime||'video/webm'}));a.download='clip-lite.'+(mime.includes('mp4')?'mp4':'webm');a.click();toast('Exported')};
  $('#ov').hidden=false;rec.start();setTimeout(play,150);
};
$('#cx').onclick=()=>{cancelled=true;if(rec&&rec.state!='inactive')rec.stop()};
$('#play').innerHTML=PLAY;refresh();loop();
</script>
</body>
</html>
