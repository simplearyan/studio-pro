<!-- The play mark, drawn as a path rather than the sibling page's ▶ text glyph so it can carry a
     colour at all. An SVG favicon can read prefers-color-scheme, so the mark flips with the
     browser's own tab bar: red on light chrome, white on dark, where red goes muddy. No raster
     asset and no extra request — the icon is the file. # is %23 because this is a data URI. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32'><style>path{fill:%23ff0000}@media(prefers-color-scheme:dark){path{fill:%23ffffff}}</style><path d='M9 4v24l19-12z'/></svg>">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)">
<!-- Its own app manifest, so this installs as a separate app from Studio Pro:
     two manifests on one origin means two home-screen icons and two start
     urls. start_url opens the mock rather than the folder's doc hub. The icon
     paths are relative and climb to the app root, which is where public/icons
     lands in both dev ("/") and Pages ("/studio-pro/"). -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<script>
/* The same service worker the main app registers, resolved relative to this
   page rather than hardcoded: it is generated at the app root with scope "/",
   which already covers this folder, so one worker serves both apps. In dev the
   plugin emits no sw.js, so the failure is expected and swallowed. */
if('serviceWorker' in navigator)addEventListener('load',function(){
  navigator.serviceWorker.register(new URL('../../sw.js',location.href).pathname).catch(function(){});
});
</script>

<!-- The theme is a stored choice, not a guess, and it has to be resolved before the first paint:
     reading it in the main script would show the OS theme for a frame and then flip, which is exactly
     the flash a dark-mode toggle must not have. Until the user says otherwise this still follows
     prefers-color-scheme — that part is the media query in the CSS, not JS — and once they have said
     otherwise the stored value wins on every visit, in both directions. A function declaration rather
     than a var: this is a classic script, and a bare `t` here would collide with the timeline's. -->
<script>
function setTheme(t){
  document.documentElement.dataset.theme=t;
  try{localStorage.setItem('lite:theme',t)}catch(_){}          // private mode throws; the theme still applies
  var m=document.querySelectorAll('meta[name="theme-color"]'),c=t=='dark'?'#0f0f0f':'#ffffff';
  for(var i=0;i<m.length;i++)m[i].removeAttribute('media'),m[i].content=c   // pin the browser chrome to the choice
}
(function(){var t;try{t=localStorage.getItem('lite:theme')}catch(_){}
if(t=='light'||t=='dark')setTheme(t)})();
</script>

/* P3, revised: the sheet occupies the dock's slot, not its own height. With the
   preview pinned (P1) that slot is an exact number — whatever the dock was —
   so `flex:1 1 auto` makes the two the same height in every state instead of
   the sheet floating at whatever its content happened to measure, which is how
   it ended up 37px short of the dock. `min-height:0` is what lets it shrink
   below that content and scroll instead, and the corner radius is gone: with
   the sheet and the dock now one continuous region of the same surface, a
   rounded top edge only announced a boundary that is not there. The >=900px
   layout is untouched — there the dock is a centred card with a bottom margin
   and the sheet is its matching card, which is a different arrangement. */
#panel{flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:16px;padding:20px 20px 16px;margin:0;flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-gutter:stable;overscroll-behavior:contain;background:var(--sf);border-radius:0}
.eh{text-align:center;font-size:16px;font-weight:500;letter-spacing:.01em}
.eb{flex:1;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.eb input[type=text]{font-size:16px}
/* ── The value + slider block ──────────────────────────────────────────────
   The readout used to be a 20px centred <b> on a line of its own, with the
   slider on the next line down — two separate objects the eye had to pair up.
   The reference ties them together by putting the number on the track's own
   line, right-aligned, so it reads as "this slider, set to this" and costs the
   sheet no width. `.sl` is that pairing: a column of value-over-track, full
   width, so every sheet with a slider gets the same shape. */
.sl{flex:1 1 100%;min-width:0;display:flex;flex-direction:column;gap:6px;position:relative;transform-origin:50% 50%}
.sl .sv{position:relative}
/* Off its default and worth a gesture to put back: a bar under the readout.
   Deliberately not the accent on the number itself — that colour already means
   "your thumb is down", and a control that means two things at once means
   neither. */
.sl.nd .sv::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:2px;border-radius:2px;background:var(--acc)}
/* The bump: one 220ms pulse when a value crosses into or out of changed. The
   class is removed on animationend in slState(), because leaving it on makes
   every second bump a silent no-op. */
.sl.bump{animation:slbump .22s ease-out}
@keyframes slbump{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}
.sl.bump .slx input[type=range]::-webkit-slider-thumb{box-shadow:0 1px 3px rgba(0,0,0,.45),0 0 0 6px color-mix(in srgb,var(--acc) 28%,transparent)}
.sl.bump .slx input[type=range]::-moz-range-thumb{box-shadow:0 1px 3px rgba(0,0,0,.45),0 0 0 6px color-mix(in srgb,var(--acc) 28%,transparent)}
@media (prefers-reduced-motion:reduce){.sl.bump{animation:none}}
/* Selected-as-extra: the anchor wears the existing ring, and a clip that joined
   the set is drawn with a second, dashed one so "which one am I editing" is
   answerable without counting. */
.clip.selx{outline:2px dashed var(--acc);outline-offset:-2px}
.sv{display:flex;justify-content:flex-end;padding:0 2px;line-height:1;min-height:16px}
.sv b{font-size:15px;font-weight:500;color:var(--on);font-variant-numeric:tabular-nums;transition:color .12s ease}
/* While the thumb is held, the number is the value you are *setting* rather than
   a label that happens to have moved, so it wears the accent for as long as the
   pointer is down and drops back to the ink colour on release. The value and the
   changed-dot already repaint on every `input`; this is the grab itself. */
#panel.held .sv b{color:var(--acc)}
/* The track wrapper exists only to hold the centre dot, which has to sit in the
   track's vertical middle and at the slider's horizontal middle — the two
   positions a native pseudo-element will not give you. */
.slx{position:relative}
.slx .dot{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--on2);opacity:.7;pointer-events:none;display:none}
.sl.bi .slx .dot{display:block}
.sl input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:26px;margin:0;padding:0;background:none;flex:none;touch-action:none}
.sl input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--on) 0,var(--on) var(--p,0%),var(--sf2) var(--p,0%),var(--sf2) 100%)}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.45)}
.sl input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--sf2)}
.sl input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--on)}
.sl input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.45)}
/* A gradient knob paints its whole track, because the colour *is* the scale — a
   white→blue ramp says "right is bluer" without a word. It has no filled half:
   there is nothing to fill when the track is already the answer. */
.sl.gr input[type=range]::-webkit-slider-runnable-track{background:var(--gr)}
/* ── The footer ────────────────────────────────────────────────────────────
   Three actions on three anchored slots, so the middle one is centred on the
   sheet rather than on whatever gap is left between two buttons of different
   widths. Cancel is the quiet fill on the left, Done the loud fill on the
   right, and the middle action wears an outline instead of a fill — it is a
   secondary move, and at reference distance an outline reads that way where a
   third solid pill would compete with Done. */
.ef{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.ef>.l{justify-self:start}.ef>.m{justify-self:center}.ef>.r{justify-self:end}
.pillb{height:44px;padding:0 24px;border-radius:22px;background:var(--sf2);font-weight:500}

.pillb.pri{background:var(--on);color:var(--bg)}

.tools::-webkit-scrollbar{display:none}
.tools button{flex:none;width:76px;max-width:none;color:var(--on);border-radius:12px}
.tools button span{font-size:12px;font-weight:500;color:var(--on2)}
/* A rail button that is a *state* rather than an action — Reverse is the only
   one — lit in the accent, the same mark the armed snap toggle and the header's
   active icons use. It matters because Reverse is invisible on the picture
   itself when paused: the lit button is the only place it shows. */
.tools button.on,.tools button.on span{color:var(--acc)}
.tools button:hover{background:color-mix(in srgb,var(--on) 8%,transparent)}

.view.fs{position:fixed;inset:0;z-index:8;background:#000;padding:0}
.sub{flex:1 1 100%;text-align:center;font-size:13px;color:var(--on2)}
.dock{background:none;border-radius:0}
/* The readout owns the centre, and it does it by covering the guides rather than
   by fading them. This strip used to carry a mask that ramped the guides out over
   50px either side of the playhead — a fixed pixel width doing a job whose scale
   changes with zoom, so at one label interval it swallowed a whole label and at
   the next it swallowed none of it. That inconsistency is what a mask on a
   scrolling strip always costs: its geometry is in screen pixels while the
   content's geometry is in seconds per pixel.

   The timecode has neither problem. It is a fixed-size object in a fixed place,
   so the honest way to stop the two colliding is to let the timecode be opaque
   and sit on top. `.dock` and `.ro` are both transparent, so what is behind the
   strip is `--bg` and the patch is invisible — nothing to see and nothing to
   tune per theme.

   The patch's own 11px ramp is not the old mask in miniature, and the
   difference is the whole argument. That ramp was painted over the strip, so it
   scaled with nothing and described whatever happened to be under it; this one
   is painted on the timecode, so it is measured against an object whose size
   never changes, and it fades the thing being *covered* rather than deciding
   the ruler should switch itself off. At 2s labels and pps 60 — 120px between
   labels against a 116px patch — nothing is ever cut either way; at 1s labels a
   label lands half under the patch, and a hard edge leaves a sliced fragment
   beside the readout while this lets it emerge. The 13px of padding is what
   keeps the ramp inside the padding box and off the digits. */
#rl{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;pointer-events:none}
#rd{position:absolute;left:0;top:0;height:100%}
/* R4: the label tier, revived. This rule used to be written for #ruler b and
   has been dead since the D1 declutter, when #ruler was collapsed to height:0
   and never populated again. The ruler that is actually live is .ro → #rl →
   #rd, so the label lives there now and keeps the same `top:4px` it always had.
   A labelled mark gets a 1px stem so it reads differently from a plain dot —
   the dot sits at the label's own height, the way the reference interleaves
   `·  00:05  ·  00:10  ·` on one line. */
#rd b{position:absolute;top:4px;font-size:11px;font-weight:400;color:var(--on2);transform:translateX(-50%);white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
#rd b::after{content:"";position:absolute;left:50%;top:15px;width:1px;height:4px;background:var(--on2);opacity:.55}
#rd i{position:absolute;top:11px;width:2px;height:2px;margin:-1px 0 0 -1px;border-radius:50%;background:var(--on2);opacity:.55}
#time{position:relative;z-index:1}
.tlw{padding-bottom:8px}.ph{top:0;bottom:0}.ph::before{display:none}
/* D3: the band was sized generously and nothing inside it was allowed to grow —
   .tl is a block-sized scroll container at a fixed min-height, so every pixel the
   dock handed it piled up as dead air under the audio lane (81px of it at
   378x770). .tl now fills .tlw, .inn is a flex column, and the film lane is the
   one row with flex:1 — it takes the slack and nothing else does. That is the
   "video lane never collapses" rule from the reference, and it is why the band
   is allowed to be big in the first place. min-height is what keeps the floor
   honest, and fitView() subtracts the growth back out to recover it.

   max-height is the correction, and it is not optional. Left unbounded the lane
   took all 81px and reached 145px, and because a 9:16 thumbnail is cover-cropped
   into a full-height strip, every frame became a 34px-wide vertical slice through
   the middle of a face — taller lane, *less* readable frame, which is the opposite
   of the point. The lane is capped just under the reference's 80px so a frame
   still reads as a frame; the slack it no longer takes goes back to the preview
   via VIEW_CEIL rather than piling up as air under the waveform. */
.tl{height:100%}
.inn{min-height:100%;display:flex;flex-direction:column}
#track{flex:1 1 auto;min-height:64px;max-height:88px}
.tl{min-height:140px}#ttrack{margin-top:0}
.tx{top:auto;height:14px;padding:0 14px;border:0;border-radius:8px 8px 3px 3px;display:flex;align-items:center;overflow:visible;font-size:11px;font-weight:500;color:#111;transition:height .12s}
.tx span{display:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx.sel{height:34px;border-radius:10px;box-shadow:inset 0 0 0 2px var(--pri);z-index:2}.tx.sel span{display:block}
.tx:not(.sel)::before{content:"";position:absolute;left:0;right:0;top:-16px;height:16px}
.tx .h{border-radius:10px}
#atrack{height:44px}.aclip{background:var(--audio);border-radius:8px}
.jn{width:36px;height:36px;margin:-18px 0 0 -18px;background:#2b2b2b;color:#fff;box-shadow:none}.jn svg{width:16px;height:16px}.jn.has{background:#fff;color:#111;box-shadow:0 0 0 1px #8a8a8a}
.addf{position:absolute;right:10px;width:44px;height:44px;border-radius:50%;background:var(--on);color:var(--bg);display:grid;place-items:center;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.35)}.addf[hidden]{display:none}.addf svg{width:26px;height:26px;stroke-width:1.5}
.tools{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent)}.tools button{width:auto;min-width:68px;padding:2px 12px}.tools button span{font-size:11px;color:var(--on2)}
.vd{flex:none;width:1px;height:34px;align-self:center;background:var(--ol);margin:0 6px}
.tpl{display:flex;gap:8px;flex:1 1 100%;justify-content:center;flex-wrap:wrap}
.tpl .chip{height:40px;padding:0 14px}.tpl .chip span{font-family:Anton,Roboto,sans-serif;font-size:16px;letter-spacing:.02em}
.tp-rainbow{background-image:linear-gradient(90deg,#ff3b30,#ff9500,#34c759,#2f6cff,#af52de);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tp-neon{color:#00e5ff;text-shadow:0 0 8px #00e5ff}.tp-comic{color:#ffd400;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.tp-plain{background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:2px 10px}
/* ── Adjust and Filters: the two shelves the reference puts under the player ──
   Both are a horizontal row of round targets with a label under each and one
   slider underneath, and both are useless without the row: a slider with no
   choice of what it is adjusting is one control pretending to be eight. The row
   scrolls rather than wraps, so adding a knob never costs the sheet a row of
   height, and the dock below has no slack to give. */
.car{display:flex;gap:14px;flex:1 1 100%;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:4px 2px 2px;scroll-snap-type:x proximity}
.car::-webkit-scrollbar{display:none}
.car button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;width:64px;padding:0;background:none;scroll-snap-align:center}
.car .kn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--ol);color:var(--on2);background-color:var(--sf2);background-size:cover;background-position:center;overflow:hidden;position:relative}
/* A card's effect layer rides in a child so the card's own `filter` grades only
   the thumbnail. Putting both on one element would run the chain over the
   vignette and the noise too, and a saturate over a noise tile retints the grain
   — the card would stop being the picture. */
.car .kn>i{position:absolute;inset:0;display:block;background-size:cover;background-position:center}
.car .kn svg{width:22px;height:22px}
.car button.on .kn{border:2px solid var(--on);color:var(--on)}
.car .lb{font-size:11px;line-height:1.25;color:var(--on2);text-align:center}
.car button.on .lb{color:var(--on);font-weight:500}
/* A knob that is off its default carries a small accent dot, so "I changed
   this" outlives the moment you tap a different knob and the ring moves away.
   The ring answers "which knob is the slider on"; the dot answers "which knobs
   hold a value". Two questions, two marks — which is how the reference shows a
   setting was made without stealing the selection cue. */
.car button.chg .kn::after{content:"";position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:var(--acc);border:1.5px solid var(--sf2)}
/* A filter card is a real frame from the clip, carrying that filter's own CSS —
   so the eleven cards are eleven genuinely different pictures of the same
   moment, which is the only way to choose a look. "None" is the crossed disc
   the reference uses, because an unfiltered thumbnail next to ten filtered ones
   reads as "there is no filter", not as the filter you are currently on. */
.car.fcards .kn{width:64px;height:82px;border-radius:10px}
.car.fcards button{width:66px}
.car.fcards .kn svg{width:26px;height:26px}
/* The stacked-effects line. Three lit cards and one slider look much like one
   lit card until you read them, so when more than one effect is on the sheet
   says so in words and offers one tap out. display:flex would beat the [hidden]
   UA rule, hence the explicit rule under it. */
.stack{flex:1 1 100%;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--on) 6%,transparent)}
.stack[hidden]{display:none}
.stack .stx{font-size:12px;line-height:1.35;color:var(--on2);text-align:center}
.stack .stx b{color:var(--on);font-weight:500}
.stack .chip{flex:none;height:30px;padding:0 12px;font-size:13px}
/* ── Rearrange: the clips themselves, as a row you drag ────────────────────
   A different subject from the Filters row — clips in order rather than looks —
   so it is square, carries each clip's length, and draws the selected clip as a
   circle. `touch-action:none` is load-bearing: the whole point of this row is
   that a press-and-move on it must move a clip, not scroll the sheet. */
.rcar{display:flex;gap:14px;flex:1 1 100%;min-width:0;overflow-x:auto;scrollbar-width:none;padding:6px 2px}
.rcar::-webkit-scrollbar{display:none}
.rc{flex:0 0 auto;position:relative;width:72px;height:72px;border-radius:14px;padding:0;background:var(--sf2);overflow:hidden;border:2px solid transparent;touch-action:none}
.rc img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.rc.sel{border-radius:50%;border-color:var(--on)}
.rc.drag{opacity:.5;border-color:var(--acc)}
.rc .td{position:absolute;left:5px;bottom:3px;font-size:10px;font-weight:500;color:#fff;background:rgba(0,0,0,.55);border-radius:4px;padding:0 4px;font-variant-numeric:tabular-nums}
/* ── Aspect ratio: four tiles, one choice ─────────────────────────────────
   The ratio is a shape, so the control is the shape: each tile draws the format
   at its own proportions inside a square, which says "9:16 is the tall one"
   without reading a word. This replaced a row of text chips, where four buttons
   differed only in the numbers printed on them and the glyph had to be imagined
   from the label. */
/* The tiles divide the row rather than each claiming a fixed width: four of them
   have to share the sheet's 336px at 393 and its 320px at 360, and a fixed 88px
   tile wrapped 3 + 1 at both, which reads as a layout that ran out of room.
   `flex:1 1 0` with a cap lets them meet the row at any width, and the glyph is
   sized in percentages so it scales with the tile it is standing in. */
.rts{display:flex;gap:10px;flex:1 1 100%;justify-content:center}
.rt{flex:1 1 0;min-width:0;max-width:96px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;background:none;color:var(--on2)}
.rt>i{width:100%;aspect-ratio:1/1;border-radius:16px;background:var(--sf2);border:2px solid transparent;display:grid;place-items:center}
.rt>i>b{display:block;background:var(--on2);border-radius:2px}
.rt.on>i{border-color:var(--on)}
.rt.on>i>b{background:var(--on)}
.rt>span{font-size:12px;line-height:1.2;text-align:center}
.rt.on>span{color:var(--on);font-weight:500}
/* Layout tiles are the aspect-ratio tiles entire — same row, same ring, same
   label weight — and differ only in what sits inside the square: a wireframe of
   the layout instead of a ratio block. Inheriting the tile is the point; a second
   tile style would be a second thing to keep in step, and the two sheets are
   meant to read as the same kind of choice. The glyph is drawn at 44% so the
   four pictures are the same size as an aspect ratio's block, not larger. */
.rt>i svg{width:44%;height:44%;stroke-width:1.4}
.rt.on>i svg{color:var(--on)}
/* ── Canvas: the backdrop as swatches ─────────────────────────────────────
   A background is a colour, so it is chosen from colours rather than named in
   words. The custom chip is the one control here that is not a preset: a
   rainbow disc standing in for the whole wheel, with a real color input behind
   it, because four named greys cannot express every backdrop a clip might want. */
.sws{display:flex;gap:14px;flex:1 1 100%;align-items:center;justify-content:center;flex-wrap:wrap}
.swt{width:40px;height:40px;border-radius:50%;padding:0;border:2px solid transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--on) 22%,transparent)}
.swt.on{border-color:var(--on)}
.swt.custom{position:relative;overflow:hidden;background:conic-gradient(#ff3b30,#ff9500,#ffe000,#34c759,#00c7be,#2f6cff,#af52de,#ff3b30)}
.swt.custom input{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);border:0;padding:0;opacity:0;cursor:pointer}
/* `#panel label` carries min-width:84px for the old slider rows. The custom
   swatch is a label too, so without this it becomes the widest chip in the row
   and pushes the presets out of line. */
#panel label.swt{min-width:0}
.vd2{flex:none;width:1px;height:32px;background:var(--ol)}
/* ── Export: settings rows and one commit ─────────────────────────────────
   A settings row is a label and its current value, and the options appear under
   it only while it is the row you are changing, so three settings never draw
   nine buttons at once. The chevron is the reference's own mark, turned to point
   down while the options are open. */
.xlist{flex:1 1 100%;display:flex;flex-direction:column}
.xr{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:15px 6px;background:none;border-radius:12px;color:var(--on);text-align:left}
.xr:hover,.xr.open{background:color-mix(in srgb,var(--on) 6%,transparent)}
.xr .xl{font-size:15px}
.xr .xv{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--on2)}
.xr.open .xv{color:var(--on)}
.xr svg{width:16px;height:16px;transition:transform .14s ease}
.xr.open svg{transform:rotate(180deg)}
.xo{display:flex;gap:8px;flex-wrap:wrap;padding:2px 6px 14px}
.xo .chip{height:36px;padding:0 14px;font-size:14px}
/* The duration badge on a text clip. A caption's length is the one number you
   cannot see by looking at it — the block's width is the length, and width is
   exactly what you are dragging — so it is written on the block. */
.tx .td{position:absolute;left:6px;bottom:1px;font-size:9px;line-height:1.6;font-weight:500;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.62);color:#fff;border-radius:3px;padding:0 4px;pointer-events:none}
.tools button:active{background:color-mix(in srgb,var(--on) 10%,transparent)}
@media(max-width:360px){.tools button{min-width:60px}.ar{padding:0 2px}#time{font-size:12px}.addf{width:40px;height:40px}}
@supports not (color:color-mix(in srgb,red 50%,blue)){.xr:hover,.xr.open{background:rgba(127,127,127,.12)}}
/* no sticky hover wash on touch devices — it reads as a broken pressed state */
@media(hover:none){.ib:hover,.tools button:hover,.ib:hover{background:none}}

/* ── header: three columns, the timecode now lives in the middle ────────── */
.bar{display:flex;align-items:center;justify-content:space-between}
.bar .br{display:flex;align-items:center}
/* the readout sits with the ruler, directly above the timeline — not in the header */
.ro{position:relative;height:30px;display:grid;place-items:center}
#time{background:linear-gradient(90deg,transparent 0,var(--bg) 11px,var(--bg) calc(100% - 11px),transparent 100%);padding:1px 13px}
#time{position:relative;z-index:1}

/* ── the ⋮ sheet: rare actions + settings, one home, nothing gesture-only ──
   The Settings sheet was five unrelated rows in one list, and two things were
   wrong with that at once: it is 220px of content in a body the split layout
   bounds to 187px, so it opened already scrolling with "Timeline zoom" clipped
   off the top edge — and a zoom readout, two frame steppers, a ruler chip, a
   switch and a destructive button stacked together have no rhythm to learn,
   because they are five different idioms at four different heights.

   So the sheet is a shelf of three subject tiles over the rows of the one you
   picked — `.rt`, the tile Aspect ratio and Layout already use, over `.xr`,
   Export's own label-and-value row. One category on screen is a third of the
   content (66 + 10 + 2x52 = 180 against 220), which is what actually removes the
   overflow; the rest is that the rows now share one grammar instead of five.

   Nothing about `.eb` changes: the shelf and the row list are both `flex:1 1
   100%`, so they wrap onto their own full-width lines in the existing centre.
   `.sr`/`.sg`/`.eb.st` are gone with the list they were shaped for. */
.seth{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:left}
.seth .t{grid-column:2;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
.seth .t svg{width:18px;height:18px;flex:none;color:var(--on2)}
.seth #sclose{grid-column:3;justify-self:end}
/* The shelf's own size, and it is not the property sheets' 96px square. Three or
   four full-size tiles put a 118px band above a 104px row list, which is taller
   than the five rows this whole redesign exists to shorten. 44px is the tap
   floor, so the tile is as small as it can legally be: 44 + 8 + ~14 = 66. */
.rts.cat .rt>i{width:44px;height:44px;aspect-ratio:auto}
.rts.cat{gap:14px}
.rts.cat .rt{max-width:none}
.rts.cat .rt>i svg{width:52%;height:52%}
/* The Zoom category: a slider with its own toolbar on the value row. `.sv` is the
   app's slider readout line and it is 16px tall by default; here it carries two
   44px steppers and Reset, so it is sized to the touch floor and the whole widget
   is 44 + 6 + 26 = 76 — one band, not a slider over a second row of buttons,
   which would have been 100 and would not have fit the bound. */
.zsl .sv{justify-content:space-between;align-items:center;gap:8px;min-height:44px}
.zsl .zctl{display:flex;align-items:center;gap:6px;flex:none}
/* The Ruler category: six chips, all the options on screen at once, the lit one
   answering the question. 36px, like the export sheet's own option row. A grid
   and not a wrapping flex row, because a wrap is a decision made by the widest
   label: "1m" landed alone on a second line at 393px, which reads as a mistake
   rather than as a set. Three columns is 3x2 at every width this sheet takes. */
.rchips{flex:1 1 100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rchips .chip{height:36px;padding:0 14px;font-size:14px;min-width:0}
/* Two things are scoped to `.set` here, and both are about the height rather
   than the look. The rows' own padding is 15px in Export, which is right for a row
   whose content is a line of text and wrong for one whose content is a 44px
   button: 15+15+44 is a 74px row, and two of those plus a 66px shelf do not fit
   the 323px the split layout bounds this sheet to. `min-height:44px` keeps the
   rows that hold a small control (the switch, the storage readout) on the same
   44px band as the rest, so every row is 44 or 52 and the list is 96. */
#panel.set .xr{padding:4px 6px;min-height:44px;gap:8px}
/* The label must not shrink. `.xr` is `space-between`, so a row whose controls
   are wide squeezes the label instead of the controls, and "Timeline zoom" broke
   across two lines on a 393px phone with three pixels to spare — a two-line label
   in a 52px row is a clipped row. `nowrap` and `flex:none` make the label take
   the width its text needs, which is what the 8px row gap and the 6px control gap
   here pay for. */
#panel.set .xr .xl{flex:none;white-space:nowrap}
#panel.set .xv{gap:6px}
.xr .val{font-size:13px;font-weight:400;color:var(--on2);font-variant-numeric:tabular-nums;white-space:nowrap}
.xr .ib{width:44px;height:44px}
/* The panel's own 16px row gap costs 32px across three children; Settings needs
   the title, the shelf and the footer with 8px between them instead, which buys
   the shelf its 66px without the body having to shrink to pay for it. */
#panel.set{gap:10px}
/* And the gap *inside* the body, between the shelf and the rows it chooses. At
   the sheet's default 14px the two bands came to 176px of content in a 175px
   box at 1194x834 — three separate gaps of 10, 8 or 6 all fit and the difference
   is only cushion, so this one is 10 for the same reason the panel's is. */
#panel.set .eb{gap:10px}
/* The one destructive control in the app gets its own full-width row and a
   permanent orange. It used to be a 66x36 chip a hand's width from `Fit`,
   wearing the same border and the same weight, with only the word to separate
   "zoom to fit" from "delete my project". */
.xr.dz{padding:2px 6px}
.xr.dz .chip{flex:1 1 auto;height:44px;border-radius:12px;font-size:15px}
.chip.warn.arm{background:var(--acc);border-color:transparent;color:var(--bg)}
.sw{width:46px;height:28px;border-radius:14px;background:var(--sf2);position:relative;flex:none;transition:background .15s}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--on2);transition:transform .15s,background .15s}
.sw.on{background:var(--acc)}
.sw.on i{transform:translateX(18px);background:#fff}

/* ── B1: the preview owns the top of the screen ──────────────────────────
   The header stops consuming a row. It becomes an overlay across the top of
   the stage, so .view measures from y=0 and a portrait canvas gets the whole
   band — 288x512 instead of 257x456 at 366x836, +26% of the one element the
   user is actually looking at, for no new controls. Fullscreen already sits
   above this (z-index 8 vs 7), so the header disappears with the rest. */
body{position:relative}
.bar{position:absolute;inset:0 0 auto;z-index:7;height:56px;padding:0 6px}
.view{padding-top:0;padding-bottom:0}

/* ── B2r: no scrim at all, and the header gets out of the picture ─────────
   B2 argued a scrim was not optional — with the canvas running under the icons,
   a bright frame would swallow them. The reference settles it the other way and
   it is right: the wash was costing the top 84px of every portrait frame, which
   is the one thing the user opened the app to look at. So .bar paints nothing
   at all now — no background, no ::before, no gradient of any kind — and the
   9:16 frame runs clean to the top edge under the icons.

   Readability is solved with geometry instead of paint.

   When the canvas leaves a margin wide enough to stand in, the icons move into
   that margin, which is exactly what the reference does: ⌂ alone at the far
   left, ⋮ at the far right on the top line, ⤴ sharing underneath it down the
   same margin, ⛶ bottom-right. Dark-on-white in light theme, white-on-black in
   dark — the icon sits on the app's own background, never on the frame. A 9:16
   canvas at this ceiling leaves ~57–75px either side, so the icons clear the
   picture by ~9–27px at every size measured.

   **The icons are bare in every state.** There were two: the margin arrangement
   above, and a 36px chip in --bg for the ratios that run canvas to the edge
   (16:9, 1:1, 4:5). The chip is gone — it was a workaround for the arrangement
   not having been tried first, and once the icons move out of the picture the
   ratio only decides *where* they sit, never what they look like. A chip also
   made the header look like it had cards in it, which is the clutter this whole
   pass is removing. One icon, one appearance, both themes.

   body.gut is decided by the ratio's own shape, not by the pixels the canvas
   happens to leave over. The old test measured the leftover margin and asked
   whether it cleared 52px, and that was a bug dressed as robustness: at
   9:16 the leftover is 72px at 378x770 but 51.6px at 357x836, so the same
   ratio put the icons in the margin at one size and on top of the picture at
   the next. Anything derived from the leftover inherits that drift.

   So the ratio decides — 9:16 is the only format at or past 16/9 — and the
   gutter it needs is then *reserved* as stage padding, so the margin is a
   property of the layout rather than a coincidence of the viewport. That is
   what the old comment meant to buy and did not: the 44px button can no
   longer land on a face, because the canvas is capped short of it.

   The reserved gutter is stage padding, and it is read by fitView() as
   ordinary padding — so the width the canvas may use is already narrower by
   the time it is measured. 52px is the 44px button, the bar's own 4px and 4px
   of air. Fullscreen drops it: there the picture is the whole screen. */

/* the header is an overlay, so it must not eat taps aimed at the stage —
   pointer-events:none on the bar with auto back on the buttons. */
.bar{background:none;pointer-events:none}
.bar .ib{pointer-events:auto}
body.gut .view{padding-left:52px;padding-right:52px}
body.gut .view.fs{padding:0}

/* The arrangement change. The bar grows to hold the stack, which costs
   nothing: it is absolutely positioned over the stage and out of flow. The
   44px button is the same in both states — the arrangement moves where the
   icons sit, never how big they are. */
body.gut .bar{height:auto;padding:0 4px 8px;align-items:flex-start}
body.gut .bar .ib{width:44px;height:44px}
body.gut #theme,body.gut #more{margin-top:6px}
body.gut .br{flex-direction:column;align-items:center;gap:14px}

/* ── B3: one optical scale — a smaller glyph, the identical painted stroke ─
   stroke-width is in viewBox units, so shrinking the render thins the ink:
   24 -> 22px would silently drop 1.6px to 1.47px, which at 11px labels reads
   as washed out. Each value below is 1.6 x 24 / <its px size>, so every group
   paints exactly the 1.6px the mock carried at 24px. Daintier, not fainter. */
svg{width:22px;height:22px;stroke-width:1.75}
.bar svg{width:20px;height:20px;stroke-width:1.92}
.ar .ib svg{width:21px;height:21px;stroke-width:1.83}
.play svg{width:26px;height:26px}
.addf svg{width:24px;height:24px}
.jn svg{width:18px;height:18px;stroke-width:1.9}
#fs svg{width:20px;height:20px;stroke-width:1.92}

/* ── B5: the fullscreen mark is the crop marks and nothing else ─────────
   Three things came off this glyph in a row, and all three were mine: the chip,
   then the drop-shadow, then the ring. The ring went last and was the least
   load-bearing — a 28%-alpha outline around four corner marks that are already
   a shape. What is left is the mark itself, at 20px on the shared optical
   scale, in the icon's own colour: dark on white chrome in light theme, white
   on black in dark.

   `.view.fs` is the one exception and stays white. Fullscreen paints the stage
   black regardless of theme, so a --on icon would vanish on it in light theme.
   It is the one place this glyph sits on the picture rather than the chrome.

   Known: at 1:1 and 4:5 the canvas fills the stage, so this glyph lands on the
   video (40x21px and 29x44px of overlap at 378x770) and a dark --on mark is
   only readable on a bright frame. Unlike the header icons this one has no
   arrangement to move it aside — it is pinned to the preview corner — so the
   two cases cannot be solved the same way. */
.view.fs #fs{color:#fff}

/* ── B4: the readout is the loudest text in the dock, not the quietest ───
   13px made the one number the user checks constantly the smallest thing on
   screen; the reference sets it at ~19px. 15px is the compromise, and the
   hierarchy is already free — <b> is --on, the total is --on2. */
#time{font-size:15px;font-weight:500;letter-spacing:.005em}
.tools button span{font-size:11.5px}
.eh{font-weight:600}
@media(max-width:360px){#time{font-size:14px}}

/* ── C1–C3: the preview gets a ceiling, and the band takes the slack ───────
   With the header out of the flow the preview was the only row with flex:1 and
   no ceiling, so it took every spare pixel on every device — 61% of a 378x770
   screen against 19% for the timeline band. fitView() now sizes it from what the
   canvas can actually use at full width, clamped to 46–54% of the viewport, and
   hands the remainder to the dock, the only thing in the column that can absorb
   it. The max-height here is the pre-first-fit default; the inline flex fitView()
   writes takes over from there. Nothing below the lanes is centring: the band
   grows *downward*, so #track never moves and renderTL()'s measurements hold. */
.view{max-height:54%}
.dock{display:flex;flex-direction:column;flex:1 1 auto}
.ar,.ro{flex:0 0 auto}
.tlw{flex:1 1 auto}
#tools{flex:0 0 auto}

/* ── D1: the chrome is flush, and the 20px it gives back goes to the lanes ─
   Four rows of padding were standing between the preview and the timeline:
   .view 12 bottom, .dock 4 top, .ar 4 top, .tools 6 top + 10 bottom. None of
   it separates anything — the rows have their own backgrounds, borders and
   heights, so the padding was only ever air the timeline was paying rent on.
   All four are gone and the canvas is flush top and bottom.

   The win is 20px of real timeline lane, and it is 20px rather than 32 because
   fitView() decides the split from `want`, which is the height the canvas needs
   *plus the stage padding*. Shrink the padding and `want` shrinks with it, so
   the freed height flows down the ladder to the band instead of staying as
   letterbox under the video. That is why `want` now reads pt/pb off the
   computed style instead of carrying the old 12 as a literal: the two have to
   move together or the preview quietly grows 12px of dead space.

   .ar was already padding-bottom:0, so what it loses is the 4px top — its row is
   now exactly the 48px of its buttons, and the play button touches the video the
   way the reference has it. `.tlw`'s 8px bottom padding is deliberately left:
   it is *inside* the flexible area rather than above it, so it costs the lanes
   nothing, and fitView()'s `lanes=tl.scrollHeight+8` is counting it.

   These two are longhands on purpose. `.view{padding:0 12px}` reads better and is
   wrong: it is a shorthand, so at >=900px it would also beat the desktop
   `padding:8px 32px 20px` that came earlier in the sheet and flatten the wide
   layout's 32px gutters back to 12. Only the top and bottom are the business of
   this pass; the sides belong to whoever set them. */
/* ── R1/R2: the side-by-side layout, on one attribute ──────────────────────
   `body[data-layout]` is the whole mechanism. Unset (`top`) is what ships: the
   body keeps its flex column and every rule below is scoped to a side state, so
   the phone layout cannot drift — that is R1's "no behaviour change", guaranteed
   by construction rather than by comparing screenshots. The grid only turns on
   for `left`/`right`/`full`, where the phone's own box model is the wrong one.

   `.dock{display:contents}` is what makes it work: the dock stops being a box and
   its children (`.ar`, `.ro`, `.tlw`, `.tools`) become direct grid items, free to
   be placed in different columns. That is also why the dock's own background is
   dropped in side mode — a box with `display:contents` has no surface, and the
   side layout does not want one.

   The phone's gutter (a 9:16 project reserving side padding at 116px of stacked
   header) is a *phone* treatment. In a side layout there is slack, so the gutter
   is neutralised here — scoped to side states, so R4's global change is not made
   and phones keep the exact behaviour they have today. */
:root{--pw:40%}
#split{display:none;background:linear-gradient(90deg,transparent 5px,var(--ol) 5px,var(--ol) 7px,transparent 7px)}
/* `#lay` is a direct child of `.bar`, not of `.br`, and that placement is load-bearing.
   `body.gut` — which a 9:16 project turns on at every width — stacks `.br` into a
   *column* with a 14px gap, and `.bar` is absolutely positioned there so the stack
   grows *over* the canvas. Put the toggle in that group and the gut header went from
   102px to 174px, pushing the icon column 58px further down a face that was verified
   to clear it. Beside the group it adds no vertical row, and on a phone (hidden below
   600px) it adds nothing at all. */
#lay{display:none}
@media(min-width:600px){#lay{display:grid}}
/* The rail's Layout entry is offered exactly where the header's cycle icon is —
   `#lay`'s own breakpoint, not a second one. Two gates for one decision is how a
   control and the thing it controls end up disagreeing, and `applyLayout()`
   refuses a side layout below 600px, so a phone must not be offered the chooser
   either. */
.tools button[data-t="layout"]{display:none}
@media(min-width:600px){.tools button[data-t="layout"]{display:flex}}
.bl{display:flex;align-items:center}
body[data-layout=left],body[data-layout=right],body[data-layout=full]{display:grid;grid-template-columns:minmax(0,1fr);min-height:0;overflow:hidden}
body[data-layout=left]{grid-template-columns:var(--pw) 12px minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto;
  grid-template-areas:"bar bar bar" "view split ro" "view split tlw" "view split ar" "view split tools"}
body[data-layout=right]{grid-template-columns:minmax(0,1fr) 12px var(--pw);grid-template-rows:auto auto minmax(0,1fr) auto auto;
  grid-template-areas:"bar bar bar" "ro split view" "tlw split view" "ar split view" "tools split view"}
/* `full` keeps the transport: the plan's `pb` area is our `.ar` row, and dropping it
   would leave a preview you cannot play or scrub. Transport left, tools beside it. */
body[data-layout=full]{grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"bar bar" "view view" "ar tools"}
body[data-layout]:not([data-layout=top]) .dock{display:contents}
body[data-layout]:not([data-layout=top]) .bar{position:static;grid-area:bar;height:56px;padding:0 6px;background:none}
body[data-layout]:not([data-layout=top]) .view{grid-area:view;min-height:0;padding:8px 12px}
body[data-layout]:not([data-layout=top]) .ro{grid-area:ro}
body[data-layout]:not([data-layout=top]) .tlw{grid-area:tlw;min-height:0}
body[data-layout]:not([data-layout=top]) .ar{grid-area:ar}
body[data-layout]:not([data-layout=top]) .tools{grid-area:tools;justify-content:flex-start}
/* The sheet takes the column's tall row instead of hiding the whole dock, so the
   ruler, transport and tools stay put and the timeline is still one column away.
   This is the minimum of R6 the grid needs to not be broken by a sheet; the
   full popover form is still to come. */
/* Scoped to the two split states by name, not by `:not([data-layout=top])`:
   `full` has no `tlw` row to put a sheet in, and it needs a different rule for
   the panel rather than this one plus an override. */
/* R6b: the sheet is *bounded*. `grid-area:tlw` alone put it in the column's
   `minmax(0,1fr)` row, where the row's default `align-self:stretch` made it fill
   whatever the column had left — measured 629px of a 834-tall screen, against
   the 388 the same sheet gets on a phone. An explicit `align-self` is what makes
   the `height` mean anything at all: a stretched grid item ignores its own height,
   so the alignment and the height are one change, not two.

   `min(46dvh, 50%)`: 50% is the row the timeline lives in, 46% is the phone's own
   sheet (there `#panel` shares the body with a `.view` capped at 54%, so the sheet
   is always the 46% left over — the same 388px for every tool and every project
   ratio). The smaller of the two is the honest bound: never taller than half the
   timeline, never taller than the sheet a phone would get. Measured 323 / 322 /
   502 at 768x836, 1194x834 and 834x1194.

   `align-self:end`, not `start`: the sheet docks to the **bottom of the column**,
   which is where a sheet belongs under a thumb and where the phone already puts
   it. `start` had it hanging from the ruler with the whole freed half underneath,
   so the gap sat between the sheet and the transport — the one edge the sheet has
   to feel attached to, since Done and Cancel live on it. Anchored at the end, the
   slack collects *above* the sheet instead, between it and the timeline, which is
   the same space the bound gave back. `end` and not `stretch`: both of the
   properties matter and only the pair together is the fix.

   The doubled declaration is the file's own `100dvh` fallback pattern: a browser
   without `dvh` drops the second line and falls back to `vh`, and one without
   either drops the whole declaration back to stretching — today's behaviour,
   which is a safe place to land. */
body[data-layout=left] #panel,body[data-layout=right] #panel{grid-area:tlw;margin:8px 10px;min-height:0;
  align-self:end;
  height:min(46vh,50%);height:min(46dvh,50%)}
/* R6c: with a sheet open, the timeline stays on screen. `body.es .tlw{display:none}`
   was right on a phone, where the sheet *is* the bottom half of the screen and
   there is nowhere else for the timeline to go — and wrong in a split layout,
   where it left the whole right column to a sheet that only ever wanted half of
   it. So the column's one tall row becomes two, and the two regions take one each.

   The sheet keeps its bound expressed exactly as it was. `grid-row:3/5` makes it
   span *both* tall rows, so `height:50%` still resolves against the whole free
   space (322px at 1194x834) rather than against half of it, and `align-self:end`
   then places that half in the lower row — which is why the sheet lands precisely
   in row 4, above the transport and below the timeline, without a second height
   rule and without the two overlapping. If the bound ever binds smaller than half
   (`46dvh` above ~2400px tall) the sheet simply sits shorter than its row and the
   gap opens between it and the timeline, which is the right place for it. */
body[data-layout=left].es,body[data-layout=right].es{grid-template-rows:auto auto minmax(0,1fr) minmax(0,1fr) auto auto}
body[data-layout=left].es{grid-template-areas:"bar bar bar" "view split ro" "view split tlw" "view split panel" "view split ar" "view split tools"}
body[data-layout=right].es{grid-template-areas:"bar bar bar" "ro split view" "tlw split view" "panel split view" "ar split view" "tools split view"}
/* The bound makes the *body* the scrollable thing, not the sheet. A five-row
   Settings sheet needs 357px — title 23, body 222, footer 44, two 16px gaps and
   36px of padding — and the bound gives it 323 at 1194x834, so scrolling the whole
   panel would scroll Done and Cancel off the bottom edge, which is the one thing a
   footer exists to prevent. `overflow:hidden` on the panel plus `min-height:0` and
   `overflow-y:auto` on the body pins the title and the footer and scrolls only the
   rows between them. The phone keeps `overflow-y:auto` on the panel itself, where
   the sheet is the whole bottom half and there is no bound to overflow. */
body[data-layout=left] #panel,body[data-layout=right] #panel{overflow:hidden}
body[data-layout=left] #panel>.eb,body[data-layout=right] #panel>.eb{min-height:0;overflow-y:auto;overscroll-behavior:contain}
/* And the body must start at its top when it overflows. `.eb.st` is a column with
   `justify-content:center`, which is right while the rows fit and wrong the moment
   they do not: centring with overflow spills *both* ends, so the first row sat 35px
   above the body's top edge with `scrollTop` already 0 — "Timeline zoom" was
   unreachable by any amount of scrolling, because there was nothing above it to
   scroll to. Anchoring the main axis is what makes the scroll honest. */
body[data-layout=left] #panel>.eb.st,body[data-layout=right] #panel>.eb.st{justify-content:flex-start}
body[data-layout=left] #panel>.eh,body[data-layout=right] #panel>.eh,
body[data-layout=left] #panel>.ef,body[data-layout=right] #panel>.ef{flex:none}
/* `width:auto` is load-bearing, and its absence was a real 10px bug: the
   `@media(min-width:900px)` rule sets `#panel{width:min(960px,100%)}`, and 100%
   is the *body*, not the column — so in a 704px column the sheet was 704 wide
   inside 10px margins and pushed `scrollWidth` to 1204 on a 1194 screen. Every
   other #panel rule sets `margin` and lets the grid size the box; this one has to
   say `auto` because a width was already set by a rule it cannot outrank. */
body[data-layout=left].es #panel,body[data-layout=right].es #panel{grid-area:panel;grid-row:3/5;width:auto;margin:0 10px 8px}
/* The sheet's own bottom margin, not a gap under it: the transport row starts
   where the sheet's row ends. */
body[data-layout=left] #panel,body[data-layout=right] #panel{align-self:end}
body[data-layout=left] #split,body[data-layout=right] #split{display:block;grid-area:split}
body[data-layout=full] .ro,body[data-layout=full] .tlw,body[data-layout=full] #split{display:none}
/* `full` has no column to host a sheet — but it has three ways *in*: the header's
   Settings and Export, and the rail's Layout. `display:none` here made all three
   open a sheet nobody could see, which is a control that does nothing. So in
   `full` the sheet is the reference's own fallback shape: a popover, floated over
   the preview, its own width rather than the column's. Its footer is still the
   footer, so Done and Cancel keep their places. */
body[data-layout=full] #panel{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
  width:min(420px,calc(100% - 32px));max-height:min(60%,520px);margin:0;padding:18px 20px 16px;
  border-radius:20px;box-shadow:0 18px 48px rgba(0,0,0,.55);z-index:9}
/* The gutter is a phone treatment: drop it inside a side layout only. */
body[data-layout]:not([data-layout=top]).gut .view{padding-left:12px;padding-right:12px}
body[data-layout]:not([data-layout=top]).gut .bar{height:56px;padding:0 6px;align-items:center}
body[data-layout]:not([data-layout=top]).gut .bar .ib{width:48px;height:48px}
body[data-layout]:not([data-layout=top]).gut #theme,body[data-layout]:not([data-layout=top]).gut #more{margin-top:0}
body[data-layout]:not([data-layout=top]).gut .br{flex-direction:row;gap:0}
</style>
</head>
<body>
<header class="bar">
  <span class="bl"><button class="ib" id="theme" title="Light / dark" aria-label="Toggle theme"><svg data-i="sun"></svg></button>
  <button class="ib" id="lay" aria-label="Layout" title="Layout"><svg data-i="layT"></svg></button></span>
  <span class="br"><button class="ib" id="more" aria-label="More" title="Settings and rare actions"><svg data-i="more"></svg></button><button class="ib" id="export" disabled title="Export" aria-label="Export video"><svg data-i="up"></svg></button></span>
</header>
<div class="view">
  <canvas id="cv" width="1280" height="720"></canvas>
  <button id="empty"><svg data-i="plus"></svg>Add video</button>
  <button id="fs" aria-label="Fullscreen preview" title="Fullscreen preview"><svg data-i="fs"></svg></button>
</div>
<div id="panel" hidden></div>
<div id="split" role="separator" aria-orientation="vertical" aria-label="Preview and timeline split"></div>
<div class="dock">
  <div class="ar">
    <button class="ib" id="bdel" aria-label="Delete" title="Delete"><svg data-i="trash"></svg></button><button class="ib" id="bsplit" aria-label="Split" title="Split"><svg data-i="cut"></svg></button>
    <span class="mid"><button class="play" id="play" aria-label="Play"></button></span>
    <button class="ib" id="undo" aria-label="Undo" title="Undo"><svg data-i="undo"></svg></button><button class="ib" id="redo" aria-label="Redo" title="Redo"><svg data-i="redo"></svg></button>
  </div>
  <div class="ro">
    <div id="rl"><div id="rd"></div></div>
    <span id="time"><b id="tc">00:00</b> / <span id="tt">00:00</span></span>
  </div>
  <div class="tlw">
    <div class="tl" id="tl"><div class="inn" id="inn"><div id="ttrack"></div><div id="track"></div><div id="atrack"></div></div></div>
    <button class="addf" id="addf" aria-label="Add clip" title="Add clip" hidden><svg data-i="plus"></svg></button><div id="snap" hidden></div><div id="tip" hidden></div><div class="ph"></div>
  </div>
  <nav class="tools" id="tools"></nav>
</div>
<input type="file" id="file" accept="video/*" multiple hidden>
<div id="ov" hidden><div><b>Exporting video…</b><p style="margin:8px 0 0;color:var(--on2)">Keep this tab open until it finishes.</p><div id="pb"><i></i></div><button class="chip" id="cx">Cancel</button></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),ctx=cv.getContext('2d'),tl=$('#tl');
const ICON={
plus:'<path d="M12 5v14M5 12h14"/>',trash:'<path d="M4 7h16"/><path d="M9.5 7V5.6A1.6 1.6 0 0 1 11.1 4h1.8A1.6 1.6 0 0 1 14.5 5.6V7"/><path d="M6.8 7l.7 11.2A2 2 0 0 0 9.5 20h5a2 2 0 0 0 2-1.8L17.2 7"/><path d="M10.4 10.6v6M13.6 10.6v6"/>',
cut:'<circle cx="6.4" cy="6.4" r="2.4"/><circle cx="6.4" cy="17.6" r="2.4"/><path d="M8.6 7.8 20 18.6M20 5.4 8.6 16.2"/>',
undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h9.5a6 6 0 0 1 0 12H11"/>',redo:'<path d="m15 14 5-5-5-5"/><path d="M20 9h-9.5a6 6 0 0 0 0 12H13"/>',
prev:'<path d="M16.25 5 7.75 12l8.5 7"/>',next:'<path d="m7.75 5 8.5 7-8.5 7"/>',up:'<path d="M12 16V5"/><path d="m7.5 9.5 4.5-4.5 4.5 4.5"/><path d="M5 19h14"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 3v1.7M12 19.3V21M4.2 4.2l1.2 1.2M18.6 18.6l1.2 1.2M3 12h1.7M19.3 12H21M4.2 19.8l1.2-1.2M18.6 5.4l1.2-1.2"/>',
snap:'<path d="M7 4.5H4.5v7.5a7.5 7.5 0 0 0 15 0V4.5H17v7.5a5 5 0 0 1-10 0z"/>',
zo:'<circle cx="11" cy="11" r="6.4"/><path d="m19.8 19.8-4.2-4.2M8.6 11h4.8"/>',zi:'<circle cx="11" cy="11" r="6.4"/><path d="m19.8 19.8-4.2-4.2M8.6 11h4.8M11 8.6v4.8"/>',
fit:'<path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4"/>',
add:'<rect x="2.6" y="6.6" width="14.8" height="13" rx="2.6"/><path d="M6.6 3.4h11.2A2.6 2.6 0 0 1 20.4 6v9.6"/><path d="M8 11.3v4l4-2z"/>',
text:'<path d="M6 19 12 5l6 14"/><path d="M8.7 14h6.6"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.6 6.4 4 4"/>',
speed:'<path d="M4.6 18a8 8 0 1 1 14.8 0"/><path d="M12 18v-6l3.4-3.4"/>',volume:'<path d="M4 9.6v4.8h3.4L12 18.4V5.6L7.4 9.6z"/><path d="M15.6 9.3a4 4 0 0 1 0 5.4M18.1 6.8a8 8 0 0 1 0 10.4"/>',
/* Filters and Adjust stand side by side in the dock, two buttons apart, and
   they were both drawn as "two rails with a travelling dot" — two marks that
   differ only in where the dots sit. That is not a distinction anyone can make
   at 22px, and it is the difference between picking the shelf of thirteen looks
   and the shelf of thirteen values. They are now different *shapes*: a filter is
   the one control in the app that narrows a set down to one, so it is a funnel;
   an adjustment is a value you move, so it is a mixer. Neither metaphor is
   borrowed from the other, and neither appears anywhere else in the map. */
filter:'<path d="M3.4 5.2h17.2l-6.7 7.9v6.2l-3.8 2.2v-8.4z"/>',
dup:'<rect x="8" y="8" width="12" height="12" rx="2.4"/><path d="M16 8V6.4A2.4 2.4 0 0 0 13.6 4H6.4A2.4 2.4 0 0 0 4 6.4v7.2A2.4 2.4 0 0 0 6.4 16H8"/>',
ts:'<path d="M5 5v14M9.5 12h9M15 8.6l3.4 3.4-3.4 3.4"/>',te:'<path d="M19 5v14M14.5 12h-9M9 8.6 5.6 12 9 15.4"/>',
/* The Adjust shelf. Thirteen knobs, thirteen glyphs, all on the same 24px grid as the
   rest of the map so the rail reads as one set. Each is a *shape* rather than a
   metaphor: half a disc is contrast, a crescent is shadows, a drop is

  if(o<.15||o>dur(c)-.15)return toast('Move the playhead inside the clip');
  snap();pause();if(end)c.out=c.in+o*c.sp;else{c.in+=o*c.sp;t=c.s}refresh();
}
/* The timeline is display:none while a panel is open, so scrollLeft reads 0 there — writing it
   would clobber the playhead via the scroll handler below. Only touch it when it is on screen. */
function nudge(dt){if(!clips.length)return;pause();t=clamp(t+dt,0,total);if(tl.offsetParent)tl.scrollLeft=t*pps;seekVid()}
/* Zoom bounds, once. pps is pixels-per-second: 2 shows ~170s of timeline on a
   phone (a 20s clip 40px wide) and 240 shows ~1.4s, so both ends are useless —
   which is why the range is not presented as a linear slider any more. */
const ZOOM_MIN=2,ZOOM_MAX=240;
function fitZoom(){const w=tlWidth();pps=clamp(w*.8/Math.max(total,1),ZOOM_MIN,ZOOM_MAX);renderTL();syncZoom()}
/* R5: what automatic mode cannot do is disagree. Somebody trimming to a 30s
   music bed wants `00:30` labelled at every zoom, not `00:02` because they
   pinched. View state, not document state — not in snap(), not undoable, the
   same as snapOn. */
const RULER_MODES=['auto',1,5,10,30,60];
/* `rulerLabel()` lived here and is gone: it named one interval with a `≥` in
   front of it, which was the right label for a button that cycled blind ("at
   least 5s, and more if it has to") and the wrong one for a chooser, where the
   chip is the interval itself and the set of six is the answer. The chooser's
   labels are `RULER_MODES_LBL`, next to the shelf that renders them. */
try{if(localStorage.getItem('lite:snap')==='0')snapOn=false}catch(_){}
try{const rm=localStorage.getItem('lite:ruler'),i=RULER_MODES.map(String).indexOf(rm);if(i>-1)rulerMode=RULER_MODES[i]}catch(_){}
$('#more').onclick=()=>{tool=tool=='settings'?null:'settings';panel()};
/* Falls back to the OS only while the user has never chosen; after that the stored value is the
   source of truth and the media query in CSS no longer applies. */
$('#theme').onclick=()=>{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;setTheme(dark?'light':'dark')};
/* ── R1/R2: the side-by-side layout toggle ────────────────────────────────
   The default is `top`, so nothing changes until someone taps the icon — the
   user asked for a toggle, and flipping the *default* to `auto` is a separate
   decision the plan keeps for later (§3.1). The icon shows the layout you are
   in and names the one you would get next, and it is hidden below 600px, which
   is also why a side layout is never stored: there would be no way to leave one
   on a phone. `cycleLayout` refuses below 600 too, so the hidden button and the
   `p` key can never strand a phone in a layout it cannot see the control for. */
const LAYOUTS=['top','left','right','full'];
/* `layMode`, not `layout`: `layout()` is already the timeline's own function. */
let layMode='top';
const layoutGlyph={top:'layT',left:'layL',right:'layR',full:'layF'};
/* What the four states are called on the sheet's tiles. Short, because a tile is
   96px wide; unambiguous, because "Preview" names which of the two regions is
   moving and `top` is the stacked layout this app has always had. */
const LLBL={top:'Preview top',left:'Preview left',right:'Preview right',full:'Preview only'};
function applyLayout(){
  if(layMode!='top'&&innerWidth<600)layMode='top';
  const b=document.body;
  if(layMode=='top')b.removeAttribute('data-layout');else b.setAttribute('data-layout',layMode);
  const next=LAYOUTS[(LAYOUTS.indexOf(layMode)+1)%LAYOUTS.length];
  const lb=$('#lay');
  if(lb){lb.innerHTML=ic(layoutGlyph[layMode]);lb.title='Layout: '+layMode+' - tap for '+next;lb.setAttribute('aria-label','Layout: '+layMode+', next: '+next)}
  /* The rail's entry wears the glyph of the state you are in, the same mark the
     sheet's lit tile carries, and is re-drawn here as well as in `strip()` so
     the header's cycle and a tile tap leave the rail saying the same thing. */
  const rb=document.querySelector('#tools button[data-t="layout"] svg');
  if(rb)rb.innerHTML=ICON[layoutGlyph[layMode]];
  /* The grid sizes the preview itself, but `fitView()` still owns the gutter
     class and the filmstrip re-layout, and it is the one place that knows the
     canvas has changed shape. R3's side branch is not here yet; the inline
     `flex` it writes is simply ignored by the grid. */
  fitView();
}
function cycleLayout(forceFull){
  if(innerWidth<600)return;
  layMode=forceFull?'full':LAYOUTS[(LAYOUTS.indexOf(layMode)+1)%LAYOUTS.length];
  applyLayout();
}
$('#lay').onclick=()=>cycleLayout(false);
addEventListener('resize',()=>{if(layMode!='top'&&innerWidth<600){layMode='top';applyLayout()}fitView();paintRange($('#r1'));clips.length&&renderTL()});
applyLayout();
addEventListener('keydown',e=>{
  /* Any focused field owns its keys — a range slider included, so an arrow key
     moves the thumb it is on and not the playhead. Restricting this to text
     inputs left arrow keys hijacked on every focused slider. */
  if(e.target.tagName=='INPUT')return;
  if(e.code=='Space'){e.preventDefault();playing?pause():play()}
  else if(e.key=='s')split();else if(e.key=='Delete'||e.key=='Backspace')del();
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='z'){e.preventDefault();e.shiftKey?redo():undo()}else if((e.ctrlKey||e.metaKey)&&e.key=='y'){e.preventDefault();redo()}else if(e.key=='ArrowLeft'){e.preventDefault();nudge(e.shiftKey?-1:-1/30)}else if(e.key=='ArrowRight'){e.preventDefault();nudge(e.shiftKey?1:1/30)}else if(e.key=='d')dup();else if(e.key=='[')trimTo(0);else if(e.key==']')trimTo(1)
  else if(e.key=='p'||e.key=='P')cycleLayout(e.shiftKey)
});/* The capture canvas mirror. `loop()` already draws the editor's canvas every
   frame, so while a recording is up it also copies that frame into this one at
   the chosen resolution — the recorder watches *this* canvas, which is what makes
   Resolution a real setting instead of a label over a single picture. */
let capCv=null,capCtx=null;
function runExport(){
  if(!clips.length||typeof MediaRecorder=='undefined')return toast('Export is not supported in this browser');
  pause();t=0;seekVid();cancelled=false;
  const [rw,rh]=resDims();capCv=document.createElement('canvas');capCv.width=rw;capCv.height=rh;capCtx=capCv.getContext('2d');
  const cs=capCv.captureStream(EXP.fps);
  dest&&dest.stream.getAudioTracks().forEach(a=>cs.addTrack(a));
  /* The chosen format first, then the fallbacks the browser actually supports —
     MP4 is not guaranteed to be encodable, and a sheet that offered it anyway
     would be a setting that silently did nothing. EXPFMT only lists MP4 when it
     is encodable, so this list and that check can never disagree. */
  const want=EXP.fmt=='mp4'?'video/mp4;codecs=avc1':'video/webm;codecs=vp9,opus';
  mime=[want,'video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  const chunks=[];
  rec=new MediaRecorder(cs,mime?{mimeType:mime,videoBitsPerSecond:8e6}:{});
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{pause();rec=null;capCv=null;capCtx=null;$('#ov').hidden=true;if(cancelled)return;
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:mime||'video/webm'}));a.download='clip-lite.'+(mime.includes('mp4')?'mp4':'webm');a.click();toast('Exported')};
  $('#ov').hidden=false;rec.start();setTimeout(play,150);
}
/* Export is the header's own action, the way the reference keeps it, and it opens
   the sheet rather than starting immediately: the settings are the point, and a
   button that exports on the first tap is a button you cannot configure. */
$('#export').onclick=()=>{if(!clips.length)return;tool='export';panel()};
$('#cx').onclick=()=>{cancelled=true;if(rec&&rec.state!='inactive')rec.stop()};
$('#play').innerHTML=PLAY;refresh();loop();
/* The first paint is deliberately empty and the restore is a second paint. That
   ordering is what makes the failure mode safe: an IndexedDB that will not open,
   a blocked upgrade or a private-mode browser all resolve to "no project", which
   is the app working — never a half-built timeline. `restoring` holds every
   save off until the stored document has been read, so the empty first paint
   cannot be written back over it. */
restoring=true;
openDB().then(()=>restore()).then(restored=>{
  restoring=false;
  if(restored){refresh();toast('Project restored')}
  else{if(docLocked)toast('Saved by a newer version — this one will not overwrite it');refresh()}
  return gcMedia();
}).catch(()=>{restoring=false;refresh()});
</script>
