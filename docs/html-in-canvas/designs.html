<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Gallery — HTML-in-Canvas</title>
<!-- Emoji favicons: 🍡 for light browser UI, 🍨 for dark (Chrome picks via prefers-color-scheme) -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍡</text></svg>" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍨</text></svg>" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<style>
:root{--bg:#0b0f1a;--surface:#141922;--surface-2:#1c2433;--surface-3:#232b3b;--border:#1e2533;--text:#f1f5f9;--text-2:#94a3b8;--text-3:#64748b;--accent:#2563eb;--radius-s:8px;--radius-m:12px;--radius-l:16px}
.page-shell{max-width:1440px;margin:0 auto}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0f1a;color:#e2e8f0;font-family:'Rubik',system-ui,-apple-system,sans-serif;min-height:100vh}

/* ── Top app bar — 3-zone grid: brand | centered search | actions ── */
.topbar{position:sticky;top:0;z-index:100;background:rgba(11,15,26,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:10px 24px;display:grid;grid-template-columns:1fr minmax(220px,560px) 1fr;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:19px;font-weight:800;letter-spacing:-.4px;color:var(--text);white-space:nowrap}
.count-num{color:var(--text-3);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0}
.top-actions{display:flex;align-items:center;gap:6px;justify-self:end}
.searchbox{display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--surface-3);border-radius:999px;padding:0 15px;height:36px;min-width:0;transition:border-color .15s,background .15s}
.searchbox:focus-within{border-color:var(--text-2);background:var(--surface-3)}
.searchbox svg{color:var(--text-2);flex-shrink:0}
.searchbox input{background:none;border:none;outline:none;color:var(--text);font-size:13px;font-family:'Rubik',sans-serif;width:100%;font-weight:500}
.searchbox input::placeholder{color:var(--text-2);opacity:1}
.search-slash{font-size:10.5px;font-weight:700;color:var(--text-3);border:1px solid var(--surface-3);border-radius:5px;padding:1px 6px;flex-shrink:0;font-family:'Rubik',sans-serif;background:var(--surface)}
.searchbox:focus-within .search-slash{display:none}
.gbtn{background:none;border:none;color:var(--text-2);width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;transition:all .15s;flex-shrink:0}
.gbtn:hover{background:var(--surface-2);color:var(--text)}
.btn-io{background:var(--surface-2);color:var(--text);border:1px solid transparent;border-radius:999px;height:36px;padding:0 15px;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px;font-family:'Rubik',sans-serif;white-space:nowrap;transition:all .15s}
.btn-io:hover{background:var(--surface-3)}
.btn-plus{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn-plus:hover{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
@media(max-width:960px){.search-slash{display:none}}

/* ── Studio / Community / All segmented toggle ────────────── */
.seg-toggle{display:flex;gap:6px}
.seg-toggle button{padding:0 12px;height:30px;border-radius:var(--radius-s);border:none;background:transparent;color:var(--text-2);font-size:12px;font-weight:500;cursor:pointer;font-family:'Rubik',sans-serif;letter-spacing:.2px;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.seg-toggle button:hover{background:var(--surface-2);color:var(--text)}
.seg-toggle button.on{background:#e2e8f0;color:#0b0f1a;font-weight:600}
.seg-toggle button.on .view-dot{background:#a78bfa}
.seg-toggle .view-dot{width:6px;height:6px;border-radius:50%;background:#7c3aed;flex-shrink:0}
.seg-toggle .segn{opacity:.55;font-size:10px;font-variant-numeric:tabular-nums}

/* Community empty state */
.com-empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:12px;padding:70px 24px;text-align:center}
.com-empty .big-emoji{font-size:44px}
.com-empty h3{font-size:17px;font-weight:700;color:#e2e8f0;letter-spacing:-.3px}
.com-empty p{font-size:12.5px;color:#7c8ba3;font-weight:500;max-width:420px;line-height:1.6}
.com-empty .btn-io{margin-top:4px;cursor:pointer}

/* relative time on community cards */
.rel-time{font-variant-numeric:tabular-nums}

/* ── Filter chips — single scrollable row ────────────────────── */
.chips-row{display:flex;gap:12px;align-items:center;padding:14px 24px 2px;flex-wrap:nowrap}
.chips-scroll{display:flex;gap:7px;align-items:center;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;flex:1;min-width:0;scroll-behavior:smooth}
.chips-scroll::-webkit-scrollbar{display:none}
.chip{background:var(--surface-2);border:1px solid transparent;border-radius:var(--radius-s);padding:0 13px;height:30px;font-size:12px;font-weight:500;color:var(--text);cursor:pointer;font-family:'Rubik',sans-serif;letter-spacing:.2px;transition:all .15s;text-transform:capitalize;white-space:nowrap;flex-shrink:0}
.chip:hover{background:var(--surface-3)}
.chip.on{background:#e2e8f0;color:#0b0f1a;font-weight:600}

/* ── Card grid — YouTube pattern: chrome-less cards ──────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px 16px;padding:16px 24px 40px}
.dcard{position:relative;border-radius:var(--radius-m);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;outline:none}
.dcard:hover .thumb-wrap{filter:brightness(1.06)}
.dcard:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.thumb-wrap{position:relative;aspect-ratio:16/9;background:var(--bg);border-radius:var(--radius-m);overflow:hidden;transition:filter .15s}
.thumb-wrap canvas{width:100%;height:100%;display:block}
.thumb-skel{position:absolute;inset:0;background:linear-gradient(110deg,#0d1420 30%,#141d2e 45%,#0d1420 60%);background-size:200% 100%;animation:skel 1.4s infinite}
@keyframes skel{to{background-position:-200% 0}}
.thumb-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:18px}
.thumb-ph .big{font-size:19px;font-weight:700;color:var(--text);line-height:1.25;letter-spacing:-.3px}
.thumb-ph .tagp{font-size:9px;font-weight:800;letter-spacing:1.5px;color:#c084fc;background:rgba(192,132,252,.12);border:1px solid rgba(192,132,252,.35);padding:3px 10px;border-radius:20px}
.thumb-hud{position:absolute;top:6px;right:6px;display:flex;gap:4px;opacity:0;transition:opacity .12s ease}
.dcard:hover .thumb-hud,.dcard:focus-within .thumb-hud{opacity:1}
.thumb-hud .hud-btn{width:28px;height:28px;border-radius:7px;border:none;background:rgba(8,11,16,.68);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s;padding:0}
.thumb-hud .hud-btn:hover{background:rgba(8,11,16,.92)}
.thumb-hud .hud-btn:disabled{opacity:.35;cursor:default}
.dur-pill{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;padding:2px 6px;border-radius:4px;letter-spacing:.3px}
.dcard:hover .dur-pill{opacity:0}
.dcard-body{padding:10px 2px 0;display:flex;flex-direction:column;gap:3px}
.dcard-title{font-size:14px;font-weight:600;color:var(--text);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard:hover .dcard-title{color:#fff}
.dcard-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);font-weight:400}
.dcard-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--surface-3);flex-shrink:0}
.dcard-meta .dtag{text-transform:capitalize}
.rel-time{font-variant-numeric:tabular-nums}
.empty{padding:60px 32px;text-align:center;color:var(--text-3);font-size:13px;font-weight:500}
footer{padding:0 24px 28px;font-size:10.5px;color:var(--text-3);font-weight:500}

/* floating per-card menu */
#cardMenu{position:fixed;z-index:500;background:#161d2b;border:1px solid #2d3748;border-radius:10px;padding:6px;min-width:190px;box-shadow:0 12px 32px rgba(0,0,0,.55);display:none}
#cardMenu.open{display:block}
#cardMenu .export-item{width:100%}

/* ── Modal (ported from test-renderer) ───────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(4,7,14,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:1000;display:none;align-items:center;justify-content:center;padding:24px}
.modal-overlay.open{display:flex}
.modal{background:#111827;border-radius:16px;border:1px solid #232b3b;max-width:960px;width:100%;overflow:hidden;box-shadow:0 25px 60px -12px rgba(0,0,0,.7);max-height:calc(100vh - 48px);display:flex;flex-direction:column}
.modal-header{padding:12px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e2533;flex-shrink:0;gap:10px;flex-wrap:wrap}
.mh-left{display:flex;align-items:center;gap:10px;min-width:0}
.modal-title{font-size:15px;font-weight:700;color:#f1f5f9;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
.mh-copy{display:flex;gap:5px}
.mh-copy .btn-code-io{padding:7px 9px}
.mh-copy .btn-code-io:disabled{opacity:.4;cursor:default}
.modal-close{background:none;border:none;color:#7c8798;font-size:20px;cursor:pointer;padding:4px 10px;border-radius:6px;transition:all .15s;line-height:1}
.modal-close:hover{background:#232b3b;color:#f1f5f9}
.modal-body{overflow:auto;min-height:0}
.modal-canvas-wrap{position:relative;background:#080b10;display:flex;align-items:center;justify-content:center}
.modal-canvas-wrap canvas{width:auto;max-width:100%;max-height:52vh;display:block}
/* Aspect dropdown + background swatches (frame geometry controls) — shared
   markup/CSS/behavior from hic-frame.js mountFrameControls() */
.modal-controls{padding:12px 20px;display:flex;gap:12px;align-items:center;border-top:1px solid #1e2533;background:#131a26;flex-wrap:wrap}
.btn{padding:8px 14px;border-radius:8px;border:none;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:'Rubik',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:7px;line-height:1}
.btn svg{display:block;flex-shrink:0}
.btn-play{background:#2563eb;color:#fff;box-shadow:0 1px 3px rgba(37,99,235,.3);padding:9px 13px}
.btn-play:hover{background:#1d4ed8}
.btn-play.playing{background:#334155;box-shadow:none}
.btn-play.playing:hover{background:#3f4a5f}
.btn-apply{background:#4f46e5;color:#fff;box-shadow:0 1px 3px rgba(79,70,229,.35)}
.btn-apply:hover{background:#4338ca}
.slider-wrap{flex:1;display:flex;align-items:center;gap:10px;min-width:180px}
.slider-wrap input[type="range"]{flex:1;accent-color:#3b82f6;height:4px;min-width:80px}
.time-label{font-size:12px;color:#94a3b8;font-variant-numeric:tabular-nums;min-width:38px;text-align:right;font-weight:500}
.modal-info{display:flex;gap:10px;align-items:center;margin-left:auto}
.res-meta{display:inline-flex;align-items:center;gap:7px;background:#161d2b;border:1px solid #232b3b;border-radius:7px;padding:5px 10px}
.res-meta svg{color:#64748b;flex-shrink:0}
.res-meta span{font-size:11px;color:#94a3b8;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.res-select{background:#1e2533;color:#e2e8f0;border:1px solid #2d3748;border-radius:7px;padding:5px 8px;font-size:11px;font-weight:600;cursor:pointer;outline:none}
.res-select:focus{border-color:#3b82f6}
.res-select option{background:#1e2533;color:#e2e8f0}
.export-cluster{display:flex;align-items:stretch;gap:8px}
.btn-frame-main{background:#1e2533;color:#cbd5e1;border:1px solid #2d3748;border-radius:8px 0 0 8px}
.btn-frame-main:hover{background:#2d3748;color:#f1f5f9;border-color:#3b82f6}
.btn-frame-main:disabled{opacity:.65;cursor:default}
.frame-caret{background:#1e2533;border:none;border-left:1px solid #2d3748;color:#cbd5e1;padding:0 8px;border-radius:0 8px 8px 0;cursor:pointer;display:flex;align-items:center}
.frame-caret:hover{background:#2d3748;color:#f1f5f9;border-color:#3b82f6}
.frame-caret:disabled{opacity:.65;cursor:default}
.frame-caret svg{transition:transform .15s}
.frame-caret.open svg{transform:rotate(180deg)}
.export-split{position:relative;display:flex;align-items:stretch}
.btn-export-main{background:#059669;color:#fff;border-radius:8px 0 0 8px;box-shadow:0 1px 3px rgba(5,150,105,.35)}
.btn-export-main:hover{background:#047857}
.btn-export-main:disabled{opacity:.65;cursor:default}
.export-caret{background:#047857;border:none;border-left:1px solid rgba(255,255,255,.25);color:#fff;padding:0 8px;border-radius:0 8px 8px 0;cursor:pointer;display:flex;align-items:center}
.export-caret:hover{background:#036852}
.export-caret:disabled{opacity:.65;cursor:default}
.export-caret svg{transition:transform .15s}
.export-caret.open svg{transform:rotate(180deg)}
.export-split.recording .btn-export-main{background:#dc2626;animation:pulse 1s infinite}
.export-split.recording .export-caret{background:#b91c1c}
.export-menu{position:absolute;right:0;bottom:calc(100% + 10px);background:#161d2b;border:1px solid #2d3748;border-radius:10px;min-width:210px;max-width:min(260px,calc(100vw - 64px));padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.55);display:none;z-index:1050}
.export-menu.open{display:block}
.export-menu-label{font-size:9.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;padding:6px 10px 4px}
.export-item{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;color:#e2e8f0;font-size:12px;font-weight:600;padding:8px 10px;border-radius:7px;cursor:pointer;text-align:left;transition:background .12s;font-family:'Rubik',sans-serif}
.export-item:hover{background:#1f2937}
.export-item em{margin-left:auto;font-style:normal;font-size:10px;font-weight:500;color:#64748b}
.export-item .fmt-check{visibility:hidden;color:#34d399;flex-shrink:0}
.export-item.selected .fmt-check{visibility:visible}
.export-item.selected{color:#f1f5f9}
.export-item svg{color:#94a3b8;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.seg{display:flex;background:#161d2b;border:1px solid #2d3748;border-radius:8px;padding:2px;gap:2px}
.tab-btn{padding:5px 14px;border-radius:6px;border:none;font-size:11px;font-weight:600;cursor:pointer;background:transparent;color:#7c8798;transition:all .15s;letter-spacing:.2px;font-family:'Rubik',sans-serif;line-height:1.4}
.tab-btn:hover{color:#cbd5e1}
.tab-btn.active{color:#f1f5f9;background:#334155}
.code-wrap{display:none;overflow:auto}
.code-wrap.active{display:block}
.code-wrap .CodeMirror{height:max(420px,52vh);border-radius:0 0 10px 10px}
.code-tabs{padding:10px 16px 0;display:flex;gap:4px;align-items:center;border-bottom:1px solid #1e2533;flex-wrap:wrap}
.code-tab{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border:none;border-bottom:2px solid transparent;background:none;font-size:11px;font-weight:600;cursor:pointer;color:#7c8798;transition:all .15s;letter-spacing:.2px;font-family:'Rubik',sans-serif;margin-bottom:-1px}
.code-tab .lang-dot{width:6px;height:6px;border-radius:50%;background:#475569}
.code-tab:hover{color:#cbd5e1}
.code-tab.active{color:#f1f5f9;border-bottom-color:#64748b}
.code-tab.active .lang-dot{background:#94a3b8}
.code-tab.active[data-lang="html"]{border-bottom-color:#34d399}
.code-tab.active[data-lang="html"] .lang-dot{background:#34d399}
.code-tab.active[data-lang="css"]{border-bottom-color:#60a5fa}
.code-tab.active[data-lang="css"] .lang-dot{background:#60a5fa}
.code-tab.active[data-lang="js"]{border-bottom-color:#fbbf24}
.code-tab.active[data-lang="js"] .lang-dot{background:#fbbf24}
.code-tabs .code-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.btn-code-io{background:#1e2533;color:#cbd5e1;border:1px solid #2d3748;padding:8px 9px;font-size:11px}
.btn-code-io:hover{background:#2d3748;color:#f1f5f9;border-color:#3b82f6}
.btn-code-io:disabled{opacity:.65;cursor:default}
.btn-reset{background:#1e2533;color:#cbd5e1;border:1px solid #2d3748;padding:8px 9px;font-size:11px}
.btn-reset:hover:not(:disabled){background:#2d1a1c;color:#fca5a5;border-color:#dc2626}
.btn-reset.confirm{background:#7f1d1d;color:#fee2e2;border-color:#dc2626}
.btn-reset:disabled{opacity:.65;cursor:default}
.code-export-split{position:relative;display:flex;align-items:stretch}
.btn-export-code{background:#1e2533;color:#cbd5e1;border:1px solid #2d3748;border-radius:8px 0 0 8px;padding:8px 9px;font-size:11px}
.btn-export-code:hover:not(:disabled){background:#2d3748;color:#f1f5f9;border-color:#3b82f6}
.btn-export-code:disabled{opacity:.65;cursor:default}
.code-export-caret{background:#1e2533;border:1px solid #2d3748;border-left:none;border-radius:0 8px 8px 0;color:#cbd5e1;padding:0 7px;cursor:pointer;display:flex;align-items:center}
.code-export-caret:hover:not(:disabled){background:#2d3748;color:#f1f5f9;border-color:#3b82f6}
.code-export-caret svg{transition:transform .15s}
.code-export-caret.open svg{transform:rotate(180deg)}
.code-export-menu{position:absolute;right:0;top:calc(100% + 8px);width:280px;background:#161d2b;border:1px solid #2d3748;border-radius:10px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.55);display:none;z-index:1060}
.code-export-menu.open{display:block}
.unsaved-badge{display:none;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#fbbf24;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);padding:4px 10px;border-radius:20px}
.unsaved-badge.on{display:inline-flex}
.unsaved-badge .dot{width:6px;height:6px;border-radius:50%;background:#fbbf24}
.code-hint{padding:6px 16px 8px;font-size:10.5px;color:#64748b;font-weight:500;border-bottom:1px solid #1e2533}
.code-hint strong{color:#94a3b8;font-weight:600}
.ai-wrap{padding:14px 20px 16px;height:max(420px,52vh);display:flex;flex-direction:column;overflow:hidden}
.ai-sub{display:flex;gap:6px;padding-bottom:10px;border-bottom:1px solid #1e2533;margin-bottom:10px;flex-shrink:0}
.ai-sub-btn{padding:6px 16px;border-radius:7px;border:1px solid transparent;background:none;font-size:11px;font-weight:600;cursor:pointer;color:#7c8798;transition:all .15s;font-family:'Rubik',sans-serif;white-space:nowrap}
.ai-sub-btn:hover{color:#cbd5e1}
.ai-sub-btn.active{color:#f1f5f9;background:#334155}
.ai-view{display:none;flex:1;min-height:0;flex-direction:column;gap:10px;overflow-y:auto}
.ai-view.active{display:flex}
.ai-step-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;flex-shrink:0}
.ai-hint{font-size:10.5px;color:#64748b;font-weight:500;flex-shrink:0}
.ai-hint strong{color:#94a3b8;font-weight:600}
.ai-textarea{width:100%;box-sizing:border-box;background:#0d1420;border:1px solid #2d3748;border-radius:8px;padding:9px 11px;font-size:11.5px;color:#e2e8f0;outline:none;resize:vertical;font-family:'Rubik',sans-serif;line-height:1.5}
.ai-textarea:focus{border-color:#7c3aed}
.ai-textarea.mono{font-family:ui-monospace,'Cascadia Code',Consolas,monospace;font-size:11px;color:#cbd5e1}
.ai-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;flex-shrink:0}
.btn-ai-copy{background:#7c3aed;color:#fff}
.btn-ai-copy:hover{background:#6d28d9}
.btn-ai-apply{background:#059669;color:#fff}
.btn-ai-apply:hover{background:#047857}
.btn-ai-clear{background:#1e2533;color:#cbd5e1;border:1px solid #2d3748}

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>

<script src="hic-frame.js"></script>
<script src="hic-modal.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
 * SVG foreignObject Renderer — verbatim port from test-renderer
 * ═══════════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════════
 * Prompt contract + reply parser — same as test-renderer
 * ═══════════════════════════════════════════════════════════════ */
function aiBuildPrompt(want, dur) {
    return [
        'You are generating an HTML-in-Canvas animation for a video editor.',
        '',
        'WHAT I WANT:',
        want,
        '',
        'HARD CONTRACT (violations break the video render):',
        '1. Deterministic time: ALL animation must be driven by a single global function onFrame(time) where time is milliseconds since the clip start (number). Same time in = same frame out, forever. The editor seeks to any time and re-renders.',
        '2. No requestAnimationFrame, no setTimeout/setInterval, no CSS @keyframes or animation: properties, no transitions. You compute every element state inside onFrame from time only.',
        '3. The design space is exactly 800 x 450 pixels (16:9). Use absolute sizes in px; the renderer scales the whole stage to any output resolution. Use width:100%;height:100% on your root container.',
        '4. Vanilla HTML/CSS/JS only — no bundlers, no imports, no fetch/XHR/network calls of your own. Allowed CDN exceptions (only when the design needs them): KaTeX for math and marked for markdown — load them with their <script src="https://cdn.jsdelivr.net/npm/..."> tags at the top of the html block (close each tag properly).',
        '5. Images must be CORS-safe https URLs (images.unsplash.com is fine) and animated via style properties (transform/opacity/filter/clip-path) inside onFrame.',
        '6. Guard element lookups (if(el){...}) so a missing id never throws.',
        '7. The FIRST line of the html block must be <title>Short Name</title> — 2-4 Title Case words naming the animation (e.g. <title>Travel Slideshow</title>). It becomes the clip\'s display name and every export filename. No other head tags.',
        '',
        'CLIP DURATION: ' + dur + ' ms. Choreograph the animation to complete within that time.',
        '',
        'OUTPUT FORMAT — respond with EXACTLY three fenced code blocks and nothing else:',
        '```html',
        '<title>Short Name</title><!-- then the full markup for the 800x450 stage -->',
        '```',
        '```css',
        '/* all styles; root container fills 100% x 100% */',
        '```',
        '```js',
        'function onFrame(time) { /* deterministic animation */ }',
        '```'
    ].join('\n');
}

function aiParseReply(text) {
    const res = { html: '', css: '', js: '', title: '' };
    text = (text || '').replace(/\r\n?/g, '\n').trim();
    if (!text) return res;
    const _tm = text.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
    if (_tm && _tm[1].trim()) res.title = _tm[1].replace(/\s+/g, ' ').trim().slice(0, 80);
    const fenceRe = /```([a-zA-Z0-9]*)[ \t]*\n([\s\S]*?)```/g;
    const blocks = [];
    let m;
    while ((m = fenceRe.exec(text)) !== null) blocks.push({ lang: (m[1] || '').toLowerCase(), code: m[2].trim() });
    const looksCss = s => /(^|\n)\s*[.#@a-zA-Z\[][^{};]*\{[^}]*:/.test(s) && !/</.test(s);
    const looksJs = s => /\b(function|onFrame|=>|var |let |const |document\.)/.test(s) && !/^\s*</.test(s);
    const looksHtml = s => /^\s*<\/?[a-zA-Z!]/.test(s);
    if (blocks.length) {
        blocks.forEach(b => {
            if (b.lang === 'css' || (!b.lang && looksCss(b.code))) res.css += (res.css ? '\n\n' : '') + b.code;
            else if (b.lang === 'js' || b.lang === 'javascript' || (!b.lang && looksJs(b.code) && !looksHtml(b.code))) res.js += (res.js ? '\n\n' : '') + b.code;
            else res.html += (res.html ? '\n' : '') + b.code;
        });
    } else {
        let s = text;
        s = s.replace(/<style[^>]*>([\s\S]*?)<\/style>/gi, (_, css) => { res.css += (res.css ? '\n\n' : '') + css.trim(); return ''; });
        s = s.replace(/<script(?![^>]*(?:\bsrc=|type="application\/json"))[^>]*>([\s\S]*?)<\/script>/gi, (_, js) => { res.js += (res.js ? '\n\n' : '') + js.trim(); return ''; });
        s = s.replace(/<!DOCTYPE[^>]*>/i, '').replace(/<\/?html[^>]*>/gi, '').replace(/<head[^>]*>([\s\S]*?)<\/head>/gi, (_, head) => {
            const keep = [...head.matchAll(/<(script\b[^>]*\bsrc=[^>]*>[\s\S]*?<\/script>|link\b[^>]*\brel=[^>]*stylesheet[^>]*>)/gi)].map(x => x[0]).join('\n');
            return keep ? '\n' + keep + '\n' : '';
        }).replace(/<\/?body[^>]*>/gi, '').replace(/<meta[^>]*>/gi, '').replace(/<title[^>]*>[\s\S]*?<\/title>/gi, '');
        res.html = s.trim();
    }
    if (res.html && /<style|<script/i.test(res.html)) {
        res.html = res.html.replace(/<style[^>]*>([\s\S]*?)<\/style>/gi, (_, css) => { res.css += (res.css ? '\n\n' : '') + css.trim(); return ''; });
        res.html = res.html.replace(/<script(?![^>]*(?:\bsrc=|type="application\/json"))[^>]*>([\s\S]*?)<\/script>/gi, (_, js) => { res.js += (res.js ? '\n\n' : '') + js.trim(); return ''; });
        res.html = res.html.trim();
    }
    return res;
}

/* ═══════════════════════════════════════════════════════════════
 * Prettifiers — same as test-renderer
 * ═══════════════════════════════════════════════════════════════ */
function prettifyHtml(html) {
    if (!html) return '';
    var s = html.replace(/></g, '>\n<');
    var lines = s.split('\n');
    var out = [], indent = 0;
    var selfClose = /^<(br|hr|img|input|link|meta|source|area|base|col|embed|param|track|wbr)\b/i;
    var closeTag = /^<\//;
    var openTag = /^<[a-zA-Z]/;
    lines.forEach(function(line) {
        line = line.trim();
        if (!line) return;
        if (closeTag.test(line)) indent = Math.max(0, indent - 1);
        out.push('  '.repeat(indent) + line);
        if (openTag.test(line) && !selfClose.test(line) && !closeTag.test(line) && !/\//.test(line) && !/\/>/.test(line)) {
            indent++;
        }
    });
    return out.join('\n');
}
function prettifyCss(css) {
    if (!css) return '';
    var s = css.replace(/\{/g, ' {\n  ').replace(/\}/g, '\n}').replace(/;([^}])/g, ';\n  $1');
    var lines = s.split('\n');
    var out = [];
    lines.forEach(function(line) {
        line = line.trimRight();
        if (line === '}') out.push('}');
        else if (line) out.push(line);
    });
    return out.join('\n');
}
function prettifyJs(js) {
    if (!js) return '';
    var s = '', out = [];
    var i = 0, n = js.length, mode = null;
    var prevSig = '';
    while (i < n) {
        var c = js[i], c2 = js.substr(i, 2);
        if (mode === 'line') { if (c === '\n') { mode = null; out.push('\n'); } else out.push(c); i++; continue; }
        if (mode === 'block') { if (c2 === '*/') { mode = null; out.push('*/'); i += 2; } else { if (c === '\n') out.push('\n'); i++; } continue; }
        if (mode === "'" || mode === '"' || mode === '`') {
            out.push(c);
            if (c === '\\') { out.push(js[i + 1] || ''); i += 2; continue; }
            if (c === mode) mode = null;
            i++; continue;
        }
        if (mode === '/') {
            out.push(c);
            if (c === '\\') { out.push(js[i + 1] || ''); i += 2; continue; }
            if (c === '[') s = s + '[';
            else if (c === ']') s = s.slice(0, -1);
            else if (c === '/' && !s.length) mode = null;
            i++; continue;
        }
        if (c2 === '//') { mode = 'line'; out.push(c2); i += 2; continue; }
        if (c2 === '/*') { mode = 'block'; out.push(c2); i += 2; continue; }
        if (c === "'" || c === '"' || c === '`') { mode = c; out.push(c); i++; continue; }
        if (c === '/') {
            if (!/[\w$)\]"'`]/.test(prevSig)) { mode = '/'; out.push(c); i++; continue; }
            out.push(c); i++; prevSig = '/'; continue;
        }
        out.push(c);
        if (!/\s/.test(c)) prevSig = c;
        if (c === ';') { out.push('\n'); prevSig = ''; }
        else if (c === '{') { out.push('\n'); prevSig = ''; }
        else if (c === '}') {
            if (out[out.length - 2] !== '\n') out.splice(out.length - 1, 0, '\n');
            out.push('\n'); prevSig = '';
        }
        i++;
    }
    var lines = out.join('').split('\n');
    var res = [], ind = 0;
    lines.forEach(function(line) {
        line = line.trim();
        if (!line) return;
        if (line[0] === '}') ind = Math.max(0, ind - 1);
        res.push('  '.repeat(ind) + line);
        if (/\{\s*$/.test(line)) ind++;
    });
    return res.join('\n').replace(/\n\n+/g, '\n');
}

/* ═══════════════════════════════════════════════════════════════
 * GALLERY DATA
 * ═══════════════════════════════════════════════════════════════ */
const W = 800, H = 450; /* design space — designs choreograph against this and it never changes */

/* Gallery data lives on the `designs-data` branch (bot-only), so main's
   history stays human-only and pushes never diverge. Fetch it live from the
   branch; fall back to the stale main copy when offline / in dev. */
const GALLERY_DATA_URL = 'https://raw.githubusercontent.com/simplearyan/studio-pro/designs-data/docs/html-in-canvas/designs-gallery.json';
const GALLERY_DATA_SOURCES = [
    GALLERY_DATA_URL + '?t=' + Date.now(),
    'designs-gallery.json',
];

let DESIGNS = [];
const byId = {};

(function loadGallery() {
    const tryNext = (i) => {
        if (i >= GALLERY_DATA_SOURCES.length) {
            document.getElementById('designGrid').innerHTML =
                '<div class="empty" style="grid-column:1/-1">Could not load designs-gallery.json — all sources failed (offline?)</div>';
            return;
        }
        fetch(GALLERY_DATA_SOURCES[i], { cache: 'no-store' })
            .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(data => {
                DESIGNS = (data.designs || []).filter(d => d && d.id);
                DESIGNS.forEach(d => { byId[d.id] = d; d.hasCode = !!(d.html || d.css || d.js); });
                const fu = document.getElementById('footNote');
                if (data.updatedAt) fu.textContent = 'Gallery updated ' + new Date(data.updatedAt).toLocaleString() + ' · ' + DESIGNS.length + ' designs';
                buildChips();
                renderGrid();
                handleHash();
            })
            .catch(() => tryNext(i + 1));
    };
    tryNext(0);
})();

/* ── Filters / search ─────────────────────────────────────────── */
let activeTag = '';
let query = '';
let activeView = 'studio';

/* Source classification: submissions carry d_sub_* ids (from the sync script);
 * everything else is curated studio content */
function isCommunity(d) { return String(d.id || '').indexOf('d_sub_') === 0; }

function relTime(ts) {
    if (!ts) return '';
    /* Google Sheets CSV exports timestamps as D/M/YYYY H:MM:SS — not ISO-parseable.
     * Normalize to YYYY-MM-DD HH:MM:SS (24h clock in the Sheet), then parse as local. */
    let s = String(ts).trim();
    const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
    if (m) s = m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0') + ' ' + m[4].padStart(2, '0') + ':' + m[5] + ':' + (m[6] || '00');
    const t = Date.parse(s);
    if (isNaN(t)) return '';
    const mins = Math.round((Date.now() - t) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    const days = Math.round(hrs / 24);
    if (days < 30) return days + 'd ago';
    return Math.round(days / 30) + 'mo ago';
}

function buildChips() {
    const counts = {};
    DESIGNS.forEach(d => (d.tags || []).forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
    const row = document.getElementById('chipsRow');
    const tags = Object.keys(counts).sort();
    row.innerHTML = '<button class="chip on" data-tag="" aria-pressed="true">All</button>' +
        tags.map(t => '<button class="chip" data-tag="' + t + '" aria-pressed="false">' + t + '</button>').join('');
    row.addEventListener('click', function(e) {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        activeTag = chip.getAttribute('data-tag');
        row.querySelectorAll('.chip').forEach(c => {
            const on = c === chip;
            c.classList.toggle('on', on);
            c.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        renderGrid();
    });
}
document.getElementById('searchInput').addEventListener('input', function() {
    query = this.value.trim().toLowerCase();
    renderGrid();
});
/* "/" focuses search; Esc clears + blurs */
document.addEventListener('keydown', function(e) {
    if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && !document.activeElement.isContentEditable) {
        e.preventDefault();
        document.getElementById('searchInput').focus();
    }
});
document.getElementById('searchInput').addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        if (this.value) { this.value = ''; query = ''; renderGrid(); }
        this.blur();
    }
});
/* Studio / Community / All segmented toggle */
document.getElementById('segToggle').addEventListener('click', function(e) {
    const btn = e.target.closest('button[data-view]');
    if (!btn) return;
    activeView = btn.getAttribute('data-view');
    this.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
    renderGrid();
});
function matches(d) {
    if (activeView === 'studio' && isCommunity(d)) return false;
    if (activeView === 'community' && !isCommunity(d)) return false;
    if (activeTag && !(d.tags || []).includes(activeTag)) return false;
    if (!query) return true;
    const hay = (d.title + ' ' + (d.creator || '') + ' ' + (d.tags || []).join(' ') + ' ' + (d.prompt || '')).toLowerCase();
    return query.split(/\s+/).every(w => hay.includes(w));
}

/* ── Card grid + lazy thumbnails ─────────────────────────────── */
const thumbQueue = [];
let thumbRunning = false;
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function phHue(title) { let h = 0; for (let i = 0; i < title.length; i++) h = (h * 31 + title.charCodeAt(i)) % 360; return h; }

function renderGrid() {
    const gridEl = document.getElementById('designGrid');
    gridEl.innerHTML = '';
    /* Toggle counts are view-independent */
    document.getElementById('nStudio').textContent = DESIGNS.filter(d => !isCommunity(d)).length;
    document.getElementById('nCommunity').textContent = DESIGNS.filter(isCommunity).length;
    document.getElementById('nAll').textContent = DESIGNS.length;
    const list = DESIGNS.filter(matches);

                (isCommunity(d) && relTime(d.createdAt) ? '<span class="dot"></span><span class="rel-time" title="' + esc(d.createdAt || '') + '">' + relTime(d.createdAt) + '</span>' : '') +
              '</div>' +
            '</div>';
        card.addEventListener('click', function(e) {

            if (act) {
                e.stopPropagation();
                const a = act.getAttribute('data-act');
                if (a === 'preview') openDesign(d.id);
                else if (a === 'copy-prompt') copyPrompt(d.id);
                else if (a === 'copy-code') copyFenced(d.id);
                else if (a === 'more') openCardMenu(d.id, act);
                return;
            }
            openDesign(d.id);
        });
        card.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                openDesign(d.id);
            }
        });
        gridEl.appendChild(card);
        if (d.hasCode) {
            /* Lazy-render thumbnails: IntersectionObserver for below-fold cards plus an
             * eager pass for the first EAGER_THUMBS code cards (above-fold grids shouldn't
             * wait for a scroll event that may never come — e.g. grids taller than the
             * viewport with no scrollbar). Guards against double-queueing. */
            card._thumbQueued = false;
            if (eagerThumbs > 0) { eagerThumbs--; card._thumbQueued = true; thumbQueue.push(d.id); }

                entries.forEach(en => {
                    if (en.isIntersecting && !card._thumbQueued) {
                        io.disconnect();
                        card._thumbQueued = true;
                        thumbQueue.push(d.id);
                        pumpThumbs();
                    }
                });
            }, { rootMargin: '300px' });
            io.observe(card);
        }
    });
    pumpThumbs();
}

function pumpThumbs() {
    if (thumbRunning) return;
    thumbRunning = true;
    (async () => {
        while (thumbQueue.length) {
            const id = thumbQueue.shift();
            const d = byId[id];
            const card = document.querySelector('.dcard[data-id="' + id + '"]');
            if (!d || !card) continue;
            const canvas = card.querySelector('canvas');
            const skel = card.querySelector('.thumb-skel');
            try {
                const r = makeHicRenderer(W, H);
                await r.setClip(d.html || '', d.css || '', d.js || '');
                const ok = await r.renderFrame(Math.max(0, (d.duration || 5000) - 16));
                if (ok && canvas) r.drawTo(canvas.getContext('2d'), 0, 0, W, H);
                r.sandbox.remove();
            } catch (e) { console.error('[Thumb]', id, e); }
            if (skel) skel.remove();
        }
        thumbRunning = false;
    })();
}

/* ── Clipboard + toast + downloads ───────────────────────────── */
function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove('on'), 2200);
}
function copyText(text, okMsg) {
    const done = () => toast(okMsg);
    const fail = () => toast('Copy failed');
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => legacyCopy(text) ? done() : fail());
    } else {
        legacyCopy(text) ? done() : fail();
    }
}
/* Async Clipboard API needs document focus; a temp textarea + execCommand still
 * works from backgrounded/electron windows (same fallback hic-modal.js uses). */
function legacyCopy(text) {
    try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        const ok = document.execCommand('copy');
        ta.remove();
        return ok;
    } catch (e) { return false; }
}
function copyPrompt(id) {

function downloadJson(d) {
    const payload = { version: 1, kind: 'hic-code', name: d.title, duration: d.duration || 5000, html: d.html || '', css: d.css || '', js: d.js || '' };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = String(d.title || 'design').replace(/[^a-z0-9_-]+/gi, '_') + '_code.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function downloadBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

    const code = submitCandidateCode();
    const parsed = clipTitleFrom(code.html);
    const body = modalApi.root.querySelector('[data-ai="submit"]');
    if (!body) return;
    body.querySelector('#subTitle').value = parsed || (d._draft ? '' : (d.title || ''));
    body.querySelector('#subCreator').value = d._draft ? '' : (d.creator === 'studio' ? '' : (d.creator || ''));
    body.querySelector('#subTags').value = (d.tags || []).filter(t => t !== 'draft' && t !== 'prompt').join(', ');
    body.querySelector('#subPrompt').value = (d.prompt && d.prompt !== '(rendered design — code included)') ? d.prompt : (modalApi.root.querySelector('.aiwant').value || '');
    body.querySelector('#subDuration').value = String(designDur(d));
    body.querySelector('#subHtml').value = code.html || '';
    body.querySelector('#subCss').value = code.css || '';
    body.querySelector('#subJs').value = code.js || '';
    const kb = n => (n / 1024).toFixed(1) + ' KB';
    body.querySelector('#submitSummary').innerHTML =
        'Submitting: <b>' + esc(parsed || d.title || 'Untitled') + '</b> — ' +
        'HTML ' + kb((code.html || '').length) + ' · CSS ' + kb((code.css || '').length) + ' · JS ' + kb((code.js || '').length);
    markFields(body, {});
    modalApi.showAiView('submit');
}

/* ── Draft autosave ─────────────────────────────────────────────── */
function saveDraft() {
    if (!currentDesignId) return;
    try {
        localStorage.setItem(DRAFT_KEY, JSON.stringify({
            prompt: modalApi.root.querySelector('.aiwant').value || '',
            html: modalApi.getEditors().html, css: modalApi.getEditors().css, js: modalApi.getEditors().js,
            savedAt: Date.now()
        }));
    } catch (e) { /* storage unavailable */ }
}
function loadDraft() {
    try { return JSON.parse(localStorage.getItem(DRAFT_KEY)); } catch (e) { return null; }
}

/* ── Deep links: designs.html#design=<id> · #new=1 ─────────────── */
function handleHash() {
    if (/#new=1/.test(location.hash)) {
        history.replaceState(null, '', location.pathname);
        openNewDesign();
        return;
    }
    const m = (location.hash || '').match(/#design=([A-Za-z0-9_-]+)/);
    if (m && byId[m[1]]) openDesign(m[1]);
}
window.addEventListener('hashchange', handleHash);

/* ── New design (+ button): empty draft workspace ──────────────── */
const NEW_DESIGN_ID = '__draft__';
const newDesignBtn = document.getElementById('newDesignBtn');
newDesignBtn.addEventListener('click', openNewDesign);
function openNewDesign() {
    const saved = loadDraft();
    let handoff = null;
    try {
        handoff = JSON.parse(localStorage.getItem('pe_handoff') || 'null');
        if (handoff) localStorage.removeItem('pe_handoff');
    } catch (e) { handoff = null; }
    byId[NEW_DESIGN_ID] = {
        id: NEW_DESIGN_ID,
        title: 'Untitled Design',
        creator: 'draft',
        tags: ['draft'],
        prompt: (handoff && handoff.brief) || (saved && saved.prompt) || '',
        duration: (handoff && handoff.dur) || 5000,
        html: (saved && saved.html) || '',
        css: (saved && saved.css) || '',
        js: (saved && saved.js) || '',
        hasCode: !!(saved && (saved.html || saved.css || saved.js)),
        _draft: true
    };
    openDesign(NEW_DESIGN_ID);
}

/* Modal must be created last — its option callbacks reference consts
   declared above (SUBMIT_VIEW_HTML, openSubmitView, …) */
_bootstrapModal();

</script>
