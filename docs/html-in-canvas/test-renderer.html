<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML-in-Canvas Renderer Test</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f172a; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; }
    
    .header { padding: 24px 32px 16px; }
    .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .header p { font-size: 13px; color: #64748b; }
    
    .controls { padding: 0 32px 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn { padding: 8px 18px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; }
    .btn-play { background: #3b82f6; color: #fff; }
    .btn-play:hover { background: #2563eb; }
    .btn-stop { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
    .btn-stop:hover { background: #334155; }
    .slider-wrap { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 10px; }
    .slider-wrap input[type="range"] { flex: 1; accent-color: #3b82f6; }
    .time-label { font-size: 13px; color: #64748b; font-variant-numeric: tabular-nums; min-width: 40px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; padding: 0 32px 32px; }
    
    .card { background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; }
    .card-header { padding: 12px 16px 0; display: flex; justify-content: space-between; align-items: center; }
    .card-name { font-size: 13px; font-weight: 600; color: #60a5fa; }
    .card-status { font-size: 11px; padding: 2px 8px; border-radius: 4px; }
    .card-status.ok { background: #064e3b; color: #34d399; }
    .card-status.err { background: #7f1d1d; color: #f87171; }
    .card canvas { width: 100%; aspect-ratio: 16/9; display: block; background: #000; }
    
    @media (max-width: 768px) {
        .header, .controls, .grid { padding-left: 16px; padding-right: 16px; }
        .grid { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>

<div class="header">
    <h1>HTML-in-Canvas Renderer Test</h1>
    <p>SVG foreignObject rendering — zero dependencies, full CSS support</p>
</div>

<div class="controls">
    <button class="btn btn-play" id="playBtn">▶ Play</button>
    <button class="btn btn-stop" id="stopBtn">⏹ Stop</button>
    <div class="slider-wrap">
        <input type="range" id="timeSlider" min="0" max="5000" value="0">
        <span class="time-label" id="timeLabel">0.0s</span>
    </div>
</div>

<div class="grid" id="presetGrid"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
 * SVG foreignObject Renderer — follows canvas_animator_studio reference
 * Key: use cloneNode + XMLSerializer, override clone style, <style> as sibling
 * ═══════════════════════════════════════════════════════════════════════════ */

class Renderer {
    constructor(w, h) {
        this.w = w;
        this.h = h;
        this.canvas = document.createElement('canvas');
        this.canvas.width = w;
        this.canvas.height = h;
        this.ctx = this.canvas.getContext('2d');
        
        // Sandbox: hidden offscreen but NO inline positioning (reference approach)
        this.sandbox = document.createElement('div');
        this.sandbox.id = 'sandbox';
        this.sandbox.style.cssText = 'position:absolute;top:-9999px;left:-9999px;width:800px;height:450px;overflow:hidden;pointer-events:none;';
        document.body.appendChild(this.sandbox);
        
        this.css = '';
        this._onFrame = null;
        this._ready = false;
    }
    
    async setClip(html, css, js) {
        this.css = css || '';
        
        // Preload external images as base64 data URIs (prevents SVG tainting)
        const processed = await this._preloadImages(html);
        this.sandbox.innerHTML = processed;
        
        // Compile onFrame
        this._onFrame = null;
        if (js) {
            try {
                this._onFrame = new Function('time', js + '\n;return typeof onFrame==="function"?onFrame:null;')();
            } catch(e) { console.error('JS error:', e); }
        }
        this._ready = true;
    }
    
    async _preloadImages(htmlString) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlString, 'text/html');
        const images = doc.querySelectorAll('img');
        const promises = Array.from(images).map(async (img) => {
            const src = img.getAttribute('src');
            if (src && (src.startsWith('http://') || src.startsWith('https://'))) {
                try {
                    const resp = await fetch(src, { mode: 'cors' });
                    if (!resp.ok) throw new Error('Network error');
                    const blob = await resp.blob();
                    const dataUrl = await new Promise((res, rej) => {
                        const reader = new FileReader();
                        reader.onloadend = () => res(reader.result);
                        reader.onerror = rej;
                        reader.readAsDataURL(blob);
                    });
                    img.setAttribute('src', dataUrl);
                } catch(e) {
                    console.warn('Image preload failed:', src, e);
                }
            }
        });
        await Promise.allSettled(promises);
        return doc.body.innerHTML;
    }
    
    renderFrame(timeMs) {
        if (!this._ready) return false;
        
        // 1. Update DOM
        if (this._onFrame) {
            try { this._onFrame(timeMs); } catch(e) {}
        }
        
        // 2. Clone + override style (KEY: removes any positioning)
        const clone = this.sandbox.cloneNode(true);
        clone.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
        clone.setAttribute('style', 'width:100%;height:100%;margin:0;padding:0;overflow:hidden;');
        
        // 3. Serialize to XHTML
        const domString = new XMLSerializer().serializeToString(clone);
        
        // 4. Build SVG: <style> as SIBLING of content div (reference approach)
        const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + this.w + '" height="' + this.h + '">' +
            '<foreignObject width="100%" height="100%">' +
            '<style xmlns="http://www.w3.org/1999/xhtml">' + this.css + '</style>' +
            '<div xmlns="http://www.w3.org/1999/xhtml" style="width:' + this.w + 'px;height:' + this.h + 'px;overflow:hidden;">' +
            domString +
            '</div></foreignObject></svg>';
        
        // 5. Draw to canvas
        return new Promise(resolve => {
            const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
            const img = new Image();
            img.onload = () => {
                this.ctx.clearRect(0, 0, this.w, this.h);
                this.ctx.drawImage(img, 0, 0);
                resolve(true);
            };
            img.onerror = () => {
                this.ctx.fillStyle = '#1e293b';
                this.ctx.fillRect(0, 0, this.w, this.h);
                this.ctx.fillStyle = '#f87171';
                this.ctx.font = '16px sans-serif';
                this.ctx.fillText('Render Error', 20, 30);
                resolve(false);
            };
            img.src = url;
        });
    }
    
    drawTo(targetCtx, x, y, w, h) {
        targetCtx.drawImage(this.canvas, 0, 0, this.w, this.h, x, y, w, h);
    }
    
    destroy() {
        if (this.sandbox && this.sandbox.parentNode) this.sandbox.parentNode.removeChild(this.sandbox);
    }
}

/* ═══════════════════════════════════════════════════════════════════════════
 * UI
 * ═══════════════════════════════════════════════════════════════════════════ */

const W = 800, H = 450;
const renderers = {};
let playing = false;
let startTime = 0;

const grid = document.getElementById('presetGrid');
const slider = document.getElementById('timeSlider');
const timeLabel = document.getElementById('timeLabel');
const playBtn = document.getElementById('playBtn');
const stopBtn = document.getElementById('stopBtn');

// Build cards
for (const [key, preset] of Object.entries(PRESETS)) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<div class="card-header"><span class="card-name">' + preset.name + '</span><span class="card-status" id="st-' + key + '">Loading...</span></div><canvas id="cv-' + key + '" width="' + W + '" height="' + H + '"></canvas>';
    grid.appendChild(card);
}

// Init all renderers
async function init() {
    for (const [key, preset] of Object.entries(PRESETS)) {
        const canvas = document.getElementById('cv-' + key);
        const status = document.getElementById('st-' + key);
        try {
            const r = new Renderer(W, H);
            await r.setClip(preset.html, preset.css, preset.js);
            const ok = await r.renderFrame(0);
            if (ok) r.drawTo(canvas.getContext('2d'), 0, 0, W, H);
            renderers[key] = r;
            status.textContent = ok ? 'OK' : 'ERR';
            status.className = 'card-status ' + (ok ? 'ok' : 'err');
        } catch(e) {
            status.textContent = 'ERR';
            status.className = 'card-status err';
        }
    }
}

// Render all at time
async function renderAll(timeMs) {
    const entries = Object.entries(renderers);
    for (const [key, r] of entries) {
        const ok = await r.renderFrame(timeMs);
        const canvas = document.getElementById('cv-' + key);
        if (ok) r.drawTo(canvas.getContext('2d'), 0, 0, W, H);
    }
}

// Play
async function play() {
    playing = true;
    startTime = performance.now() - parseInt(slider.value);
    while (playing) {
        const t = (performance.now() - startTime) % 5000;
        slider.value = t;
        timeLabel.textContent = (t / 1000).toFixed(1) + 's';
        await renderAll(t);
        await new Promise(r => setTimeout(r, 16));
    }
}

function stop() { playing = false; }

async function seek(t) {
    timeLabel.textContent = (t / 1000).toFixed(1) + 's';
    await renderAll(parseInt(t));
}

playBtn.addEventListener('click', play);
stopBtn.addEventListener('click', stop);
slider.addEventListener('input', function() { seek(this.value); });

// Boot
init();
</script>
