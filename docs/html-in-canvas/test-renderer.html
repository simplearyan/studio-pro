*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0f1a;color:#e2e8f0;font-family:'Rubik',system-ui,-apple-system,sans-serif;min-height:100vh}

.card{background:#141922;border-radius:10px;overflow:hidden;border:1px solid #1e2533;cursor:pointer;transition:border-color .2s,box-shadow .2s}

.card-name{font-size:12px;font-weight:600;color:#94a3b8;font-family:'Rubik',sans-serif}
.card-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.5px;text-transform:uppercase}
.badge-motion{background:#1e3a5f;color:#60a5fa}
.badge-premium{background:#3b1f4e;color:#c084fc}
.badge-text{background:#1a3329;color:#4ade80}
.badge-data{background:#3b2f1a;color:#fbbf24}
.badge-ui{background:#1f2937;color:#9ca3af}
.badge-code{background:#1a2e1a;color:#86efac}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:1000;display:none;align-items:center;justify-content:center;padding:24px}

.modal-close{background:none;border:none;color:#6b7280;font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:all .15s}
.modal-close:hover{background:#1e2533;color:#e2e8f0}
.modal-canvas-wrap{position:relative;background:#080b10;display:flex;align-items:center;justify-content:center}

.modal-controls{padding:14px 20px;display:flex;gap:10px;align-items:center;border-top:1px solid #1e2533}

.btn-play{background:#3b82f6;color:#fff}
.btn-play:hover{background:#2563eb}
.btn-play.playing{background:#ef4444}
.btn-play.playing:hover{background:#dc2626}
.btn-secondary{background:#1e2533;color:#9ca3af;border:1px solid #2d3748}
.btn-secondary:hover{background:#2d3748;color:#e2e8f0}
.slider-wrap{flex:1;display:flex;align-items:center;gap:10px}
.slider-wrap input[type="range"]{flex:1;accent-color:#3b82f6;height:4px}
.time-label{font-size:12px;color:#6b7280;font-variant-numeric:tabular-nums;min-width:36px}
.modal-info{display:flex;gap:12px;align-items:center;margin-left:auto}

.btn-export{background:#10b981;color:#fff}
.btn-export:hover{background:#059669}
.btn-export.recording{background:#ef4444;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}

/* Tabs */
.tab-btn{padding:5px 12px;border-radius:6px;border:none;font-size:11px;font-weight:600;cursor:pointer;background:transparent;color:#6b7280;transition:all .15s}

<script>
/* ═══════════════════════════════════════════════════════════════
 * SVG foreignObject Renderer
 * ═══════════════════════════════════════════════════════════════ */
class Renderer {
    constructor(w, h) {
        this.w = w; this.h = h;
        this.canvas = document.createElement('canvas');
        this.canvas.width = w; this.canvas.height = h;
        this.ctx = this.canvas.getContext('2d');
        this.sandbox = document.createElement('div');
        this.sandbox.style.cssText = 'position:absolute;top:-9999px;left:-9999px;width:800px;height:450px;overflow:hidden;pointer-events:none;';
        document.body.appendChild(this.sandbox);
        this.css = ''; this._onFrame = null; this._ready = false;
    }

    async setClip(html, css, js) {
        this.css = css || '';
        const processed = await this._preloadImages(html);
        this.sandbox.innerHTML = processed;
        this._onFrame = null;
        if (js) {
            try {
                /* Wrap js so onFrame returns correctly */
                var fn = new Function('time', js + '\n;return typeof onFrame==="function"?onFrame:null;');
                this._onFrame = fn();
            } catch(e) { console.error('[Renderer] JS parse error:', e); }
        }
        this._ready = true;
    }

    async _preloadImages(htmlString) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlString, 'text/html');
        const images = doc.querySelectorAll('img');
        const promises = Array.from(images).map(async (img) => {
            const src = img.getAttribute('src');
            if (src && (src.startsWith('http://') || src.startsWith('https://'))) {
                try {
                    const resp = await fetch(src, { mode: 'cors' });
                    if (!resp.ok) throw new Error('fail');
                    const blob = await resp.blob();
                    const dataUrl = await new Promise((res, rej) => {
                        const reader = new FileReader();
                        reader.onloadend = () => res(reader.result);
                        reader.onerror = rej;
                        reader.readAsDataURL(blob);
                    });
                    img.setAttribute('src', dataUrl);
                } catch(e) { /* keep original src as fallback */ }
            }
        });
        await Promise.allSettled(promises);
        return doc.body.innerHTML;
    }

    renderFrame(timeMs) {
        if (!this._ready) return false;
        if (this._onFrame) {
            const origQSA = Document.prototype.querySelectorAll;
            const origGEBI = Document.prototype.getElementById;
            const sandbox = this.sandbox;
            Document.prototype.querySelectorAll = function(sel) { return sandbox.querySelectorAll(sel); };
            Document.prototype.getElementById = function(id) { return sandbox.querySelector('#' + id) || origGEBI.call(document, id); };
            try { this._onFrame(timeMs); } catch(e) { console.error('[Renderer] onFrame error:', e); }
            Document.prototype.querySelectorAll = origQSA;
            Document.prototype.getElementById = origGEBI;
        }
        const clone = this.sandbox.cloneNode(true);
        clone.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
        clone.setAttribute('style', 'width:100%;height:100%;margin:0;padding:0;overflow:hidden;');
        const domString = new XMLSerializer().serializeToString(clone);
        const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + this.w + '" height="' + this.h + '">' +
            '<foreignObject width="100%" height="100%">' +
            '<style xmlns="http://www.w3.org/1999/xhtml">' + this.css + '</style>' +
            '<div xmlns="http://www.w3.org/1999/xhtml" style="width:' + this.w + 'px;height:' + this.h + 'px;overflow:hidden;">' +
            domString + '</div></foreignObject></svg>';
        return new Promise(resolve => {
            const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
            const img = new Image();
            img.onload = () => { this.ctx.clearRect(0, 0, this.w, this.h); this.ctx.drawImage(img, 0, 0); resolve(true); };
            img.onerror = () => { this.ctx.fillStyle = '#1e293b'; this.ctx.fillRect(0, 0, this.w, this.h); this.ctx.fillStyle = '#f87171'; this.ctx.font = '14px sans-serif'; this.ctx.fillText('Render Error', 16, 24); resolve(false); };
            img.src = url;
        });
    }

    drawTo(targetCtx, x, y, w, h) { targetCtx.drawImage(this.canvas, 0, 0, this.w, this.h, x, y, w, h); }
}

/* ═══════════════════════════════════════════════════════════════
 * CARD GRID
 * ═══════════════════════════════════════════════════════════════ */
const W = 800, H = 450;
const grid = document.getElementById('presetGrid');
const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalCanvas = document.getElementById('modalCanvas');
const modalPlayBtn = document.getElementById('modalPlayBtn');
const modalSlider = document.getElementById('modalSlider');
const modalTime = document.getElementById('modalTime');
const modalDuration = document.getElementById('modalDuration');
const modalFps = document.getElementById('modalFps');
const modalClose = document.getElementById('modalClose');
const modalCtx = modalCanvas.getContext('2d');
let modalRenderer = null;
let modalPlaying = false;
let modalStart = 0;
let modalKey = null;

for (const [key, p] of Object.entries(PRESETS)) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.key = key;
    card.innerHTML =
        '<canvas width="' + W + '" height="' + H + '"></canvas>' +
        '<div class="card-label">' +
        '<span class="card-name">' + p.name + '</span>' +
        '</div>';
    card.addEventListener('click', () => openModal(key));
    grid.appendChild(card);
}

/* Render last frame (end state) per card for better thumbnails */
(async () => {
    for (const [key, p] of Object.entries(PRESETS)) {
        const canvas = grid.querySelector('[data-key="' + key + '"] canvas');
        const r = new Renderer(W, H);
        await r.setClip(p.html, p.css, p.js);
        /* Render near the end so all animations are in their final state */
        const endMs = (p.dur || 5) * 1000 - 16;
        const ok = await r.renderFrame(endMs);
        if (ok) r.drawTo(canvas.getContext('2d'), 0, 0, W, H);
        r.sandbox.remove();
    }
})();

/* ═══════════════════════════════════════════════════════════════
 * MODAL
 * ═══════════════════════════════════════════════════════════════ */
function openModal(key) {
    const p = PRESETS[key];
    if (!p) return;
    modalKey = key;
    currentPresetKey = key;
    tabPreview.click();
    modalTitle.textContent = p.name;
    modalDuration.textContent = p.dur + 's';
    modalFps.textContent = W + 'x' + H + ' • SVG foreignObject';
    modalSlider.max = p.dur * 1000;
    modalSlider.value = 0;
    modalTime.textContent = '0.0s';
    modalPlaying = false;
    modalPlayBtn.innerHTML = '&#9654; Play';
    modalPlayBtn.classList.remove('playing');
    modalOverlay.classList.add('open');
    if (modalRenderer) { modalRenderer.sandbox.remove(); modalRenderer = null; }
    modalRenderer = new Renderer(W, H);
    modalRenderer.setClip(p.html, p.css, p.js).then(() => {
        /* Auto-play the animation once clip is loaded */
        modalPlaying = true;
        modalStart = performance.now();
        modalPlayBtn.innerHTML = '&#9646;&#9646; Pause';
        modalPlayBtn.classList.add('playing');
        tickModal();
    });
}

function closeModal() {
    modalPlaying = false;
    modalOverlay.classList.remove('open');
    modalKey = null;
}

modalClose.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', function(e) { if (e.target === modalOverlay) closeModal(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

modalPlayBtn.addEventListener('click', function() {        if (modalPlaying) {
        modalPlaying = false;
        modalPlayBtn.innerHTML = '&#9654; Play';
        modalPlayBtn.classList.remove('playing');
    } else {
        modalPlaying = true;
        modalStart = performance.now() - parseInt(modalSlider.value);
        modalPlayBtn.innerHTML = '&#9646;&#9646; Pause';
        modalPlayBtn.classList.add('playing');
        tickModal();
    }
});

modalSlider.addEventListener('input', function() {
    if (modalPlaying) return;
    const t = parseInt(this.value);
    modalTime.textContent = (t / 1000).toFixed(1) + 's';
    if (modalRenderer && modalRenderer._ready) {
        modalRenderer.renderFrame(t).then(ok => {
            if (ok) modalRenderer.drawTo(modalCtx, 0, 0, W, H);
        });
    }
});

async function tickModal() {
    const dur = (PRESETS[modalKey] || {}).dur || 5;
    while (modalPlaying && modalKey) {
        const t = (performance.now() - modalStart) % (dur * 1000);
        modalSlider.value = Math.floor(t);
        modalTime.textContent = (t / 1000).toFixed(1) + 's';
        try {
            if (modalRenderer && modalRenderer._ready) {
                const ok = await modalRenderer.renderFrame(t);
                if (ok) modalRenderer.drawTo(modalCtx, 0, 0, W, H);
            }
        } catch(e) { console.error('[Modal] render error:', e); }
        await new Promise(r => requestAnimationFrame(r));
    }
}

 * ═══════════════════════════════════════════════════════════════ */
function prettifyHtml(html) {
    if (!html) return '';
    var s = html.replace(/></g, '>\n<');
    var lines = s.split('\n');
    var out = [], indent = 0;
    var selfClose = /^<(br|hr|img|input|link|meta|source|area|base|col|embed|param|track|wbr)\b/i;
    var closeTag = /^<\//;
    var openTag = /^<[a-zA-Z]/;
    lines.forEach(function(line) {
        line = line.trim();
        if (!line) return;
        if (closeTag.test(line)) indent = Math.max(0, indent - 1);
        out.push('  '.repeat(indent) + line);
        if (openTag.test(line) && !selfClose.test(line) && !closeTag.test(line) && !/\//.test(line) && !/\/>/.test(line)) {
            indent++;
        }
    });
    return out.join('\n');
}

function prettifyCss(css) {
    if (!css) return '';
    var s = css.replace(/\{/g, ' {\n  ').replace(/\}/g, '\n}').replace(/;([^}])/g, ';\n  $1');
    var lines = s.split('\n');
    var out = [];
    lines.forEach(function(line) {
        line = line.trimRight();
        if (line === '}') out.push('}');
        else if (line) out.push(line);
    });
    return out.join('\n');
}

function prettifyJs(js) {
    if (!js) return '';
    var s = js
        .replace(/;/g, ';\n')
        .replace(/\{/g, ' {\n  ')
        .replace(/\}/g, '\n}\n')
        .replace(/,\s*var /g, ',\nvar ')
        .replace(/\n\n+/g, '\n');
    var lines = s.split('\n');
    var out = [], indent = 0;
    lines.forEach(function(line) {
        line = line.trim();
        if (!line) return;
        if (line[0] === '}') indent = Math.max(0, indent - 1);
        out.push('  '.repeat(indent) + line);
        if (/\{\s*$/.test(line)) indent++;
    });
    return out.join('\n');
}

/* Initialize CodeMirror editors */
const cmHtml = CodeMirror.fromTextArea(document.getElementById('codeHtml'), {
    mode: 'htmlmixed', theme: 'dracula', lineNumbers: true, tabSize: 2, lineWrapping: true
});
const cmCss = CodeMirror.fromTextArea(document.getElementById('codeCss'), {
    mode: 'css', theme: 'dracula', lineNumbers: true, tabSize: 2, lineWrapping: true
});
const cmJs = CodeMirror.fromTextArea(document.getElementById('codeJs'), {
    mode: 'javascript', theme: 'dracula', lineNumbers: true, tabSize: 2, lineWrapping: true
});

function switchCodeLang(lang) {
    document.querySelectorAll('.code-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.code-wrap').forEach(e => e.classList.remove('active'));
    document.querySelector('[data-lang="' + lang + '"]').classList.add('active');
    var wrap = lang === 'html' ? 'cmHtmlWrap' : lang === 'css' ? 'cmCssWrap' : 'cmJsWrap';
    document.getElementById(wrap).classList.add('active');
    /* Refresh CM after display change */
    var cm = lang === 'html' ? cmHtml : lang === 'css' ? cmCss : cmJs;
    setTimeout(function() { cm.refresh(); }, 10);
}

document.querySelectorAll('.code-tab').forEach(function(btn) {
    btn.addEventListener('click', function() { switchCodeLang(btn.dataset.lang); });
});

tabPreview.addEventListener('click', function() {
    tabPreview.classList.add('active');
    tabCode.classList.remove('active');
    previewPanel.style.display = '';
    codePanel.style.display = 'none';
});

tabCode.addEventListener('click', function() {
    tabCode.classList.add('active');
    tabPreview.classList.remove('active');
    codePanel.style.display = '';
    previewPanel.style.display = 'none';
    if (currentPresetKey && PRESETS[currentPresetKey]) {
        var p = PRESETS[currentPresetKey];
        cmHtml.setValue(prettifyHtml(p.html || ''));
        cmCss.setValue(prettifyCss(p.css || ''));
        cmJs.setValue(prettifyJs(p.js || ''));
        setTimeout(function() { cmHtml.refresh(); cmCss.refresh(); cmJs.refresh(); }, 50);
    }
});

applyCode.addEventListener('click', async function() {
    if (!currentPresetKey) return;
    modalPlaying = false;
    modalPlayBtn.innerHTML = '&#9654; Play';
    modalPlayBtn.classList.remove('playing');
    if (modalRenderer) { modalRenderer.sandbox.remove(); }
    modalRenderer = new Renderer(W, H);
    await modalRenderer.setClip(cmHtml.getValue(), cmCss.getValue(), cmJs.getValue());
    const ok = await modalRenderer.renderFrame(0);
    if (ok) modalRenderer.drawTo(modalCtx, 0, 0, W, H);
    modalSlider.value = 0;
    modalTime.textContent = '0.0s';
    tabPreview.click();
});

/* ═══════════════════════════════════════════════════════════════
 * RESOLUTION SELECTOR — controls export pixel count
 * ═══════════════════════════════════════════════════════════════ */
const resSelect = document.getElementById('resSelect');
const RESOLUTIONS = {
    '480': { w: 854, h: 480 },
    '720': { w: 1280, h: 720 },
    '1080': { w: 1920, h: 1080 },
    '1440': { w: 2560, h: 1440 }
};

/* ═══════════════════════════════════════════════════════════════WEBM EXPORT — MediaRecorder API
 * ═══════════════════════════════════════════════════════════════ */
const exportBtn = document.getElementById('exportBtn');
let exporting = false;

exportBtn.addEventListener('click', async function() {
    if (exporting) return;
    if (!currentPresetKey || !PRESETS[currentPresetKey]) return;
    const p = PRESETS[currentPresetKey];
    const dur = p.dur || 5;
    const fps = 30;

    /* Get export resolution */
    const res = RESOLUTIONS[resSelect.value] || RESOLUTIONS['1080'];
    const expW = res.w;
    const expH = res.h;
    const scaleX = expW / W;
    const scaleY = expH / H;

    exporting = true;
    exportBtn.textContent = 'Recording...';
    exportBtn.classList.add('recording');
    modalPlaying = false;
    modalPlayBtn.innerHTML = '\u25b6 Play';
    modalPlayBtn.classList.remove('playing');

    /* Size the visible canvas to export resolution */
    modalCanvas.width = expW;
    modalCanvas.height = expH;

    /* Build renderer at export resolution with scale transform */
    if (modalRenderer) { modalRenderer.sandbox.remove(); }
    modalRenderer = new Renderer(expW, expH);
    await modalRenderer.setClip(p.html, p.css, p.js);

    /* Wrap sandbox content with scale transform so fixed-pixel CSS scales up */
    const inner = modalRenderer.sandbox.firstElementChild;
    if (inner) {
        inner.style.transformOrigin = '0 0';
        inner.style.transform = 'scale(' + scaleX + ',' + scaleY + ')';
        inner.style.width = W + 'px';
        inner.style.height = H + 'px';
        inner.style.overflow = 'hidden';
    }
    modalRenderer.sandbox.style.width = expW + 'px';
    modalRenderer.sandbox.style.height = expH + 'px';
    modalRenderer.sandbox.style.overflow = 'hidden';

    /* captureStream from visible canvas */
    const stream = modalCanvas.captureStream(fps);
    let mimeType = 'video/webm;codecs=vp9';
    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';
    const recorder = new MediaRecorder(stream, { mimeType: mimeType });
    const chunks = [];
    recorder.ondataavailable = function(e) { if (e.data && e.data.size > 0) chunks.push(e.data); };

    const done = new Promise(function(resolve) {
        recorder.onstop = function() {
            const blob = new Blob(chunks, { type: 'video/webm' });
            if (blob.size > 100) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = currentPresetKey + '_' + expW + 'x' + expH + '.webm';
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
            } else { alert('Export failed — try again'); }
            exporting = false;
            exportBtn.textContent = 'Export WebM';
            exportBtn.classList.remove('recording');
            /* Restore preview canvas to 800x450 */
            modalCanvas.width = W;
            modalCanvas.height = H;
            resolve();
        };
    });

    recorder.start();

    /* Render each frame at export resolution to visible canvas */
    for (let frame = 0; frame < dur * fps; frame++) {
        const t = (frame / fps) * 1000;
        modalSlider.value = Math.floor(t);
        modalTime.textContent = (t / 1000).toFixed(1) + 's';
        try {
            const ok = await modalRenderer.renderFrame(t);
            if (ok) modalRenderer.drawTo(modalCtx, 0, 0, expW, expH);
        } catch(e) { console.error('[Export] frame error:', e); }
        await new Promise(function(r) { requestAnimationFrame(r); });
    }

    recorder.stop();
    await done;

    /* Rebuild preview renderer at 800x450 */
    if (modalRenderer) { modalRenderer.sandbox.remove(); }
    modalRenderer = new Renderer(W, H);
    await modalRenderer.setClip(p.html, p.css, p.js);
    const ok = await modalRenderer.renderFrame(0);
    if (ok) modalRenderer.drawTo(modalCtx, 0, 0, W, H);
});

</script>
