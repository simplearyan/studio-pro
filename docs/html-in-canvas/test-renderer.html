<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML-in-Canvas Renderer — SVG foreignObject Animation Engine</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
<meta name="description" content="Render HTML/CSS/JS animations to canvas using SVG foreignObject. Zero dependencies, full CSS support, 16 animated presets with live preview and WebM export.">
<meta name="keywords" content="html to canvas, svg foreignObject, animation renderer, css animations, webm export, motion graphics">
<meta property="og:title" content="HTML-in-Canvas Renderer">
<meta property="og:description" content="SVG foreignObject engine — render HTML/CSS/JS to canvas with full CSS support and zero dependencies.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0f1a;color:#e2e8f0;font-family:'Rubik',system-ui,-apple-system,sans-serif;min-height:100vh}

.header{padding:32px 32px 12px;border-bottom:1px solid #1a1f2e;margin-bottom:4px}
.header h1{font-size:24px;font-weight:800;letter-spacing:-.5px;color:#f1f5f9;font-family:'Rubik',sans-serif}
.header p{font-size:13px;color:#a5b4c8;margin-top:4px;font-weight:500;letter-spacing:.1px;font-family:'Rubik',sans-serif}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:16px 32px 32px}

.card{background:#141922;border-radius:10px;overflow:hidden;border:1px solid #1e2533;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:#3b82f6;box-shadow:0 0 0 1px #3b82f630}
.card canvas{width:100%;aspect-ratio:16/9;display:block;background:#080b10}
.card-label{padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.card-name{font-size:12px;font-weight:600;color:#94a3b8;font-family:'Rubik',sans-serif}
.card-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.5px;text-transform:uppercase}
.badge-motion{background:#1e3a5f;color:#60a5fa}
.badge-premium{background:#3b1f4e;color:#c084fc}
.badge-text{background:#1a3329;color:#4ade80}
.badge-data{background:#3b2f1a;color:#fbbf24}
.badge-ui{background:#1f2937;color:#9ca3af}
.badge-code{background:#1a2e1a;color:#86efac}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(4,7,14,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:1000;display:none;align-items:center;justify-content:center;padding:24px}
.modal-overlay.open{display:flex}
.modal{background:#111827;border-radius:16px;border:1px solid #232b3b;max-width:960px;width:100%;overflow:hidden;box-shadow:0 25px 60px -12px rgba(0,0,0,.7);max-height:calc(100vh - 48px);display:flex;flex-direction:column}
.modal-header{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e2533;flex-shrink:0}
.modal-title{font-size:15px;font-weight:700;color:#f1f5f9;font-family:'Rubik',sans-serif;letter-spacing:-.2px}
.modal-close{background:none;border:none;color:#7c8798;font-size:20px;cursor:pointer;padding:4px 10px;border-radius:6px;transition:all .15s;line-height:1}
.modal-close:hover{background:#232b3b;color:#f1f5f9}
.modal-body{overflow:auto;min-height:0}
.modal-canvas-wrap{position:relative;background:#080b10;display:flex;align-items:center;justify-content:center}
.modal-canvas-wrap canvas{width:100%;max-height:52vh;display:block}
.modal-controls{padding:12px 20px;display:flex;gap:12px;align-items:center;border-top:1px solid #1e2533;background:#131a26;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:8px;border:none;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:'Rubik',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:7px;line-height:1}
.btn svg{display:block;flex-shrink:0}
.btn-play{background:#2563eb;color:#fff;box-shadow:0 1px 3px rgba(37,99,235,.35)}
.btn-play:hover{background:#1d4ed8}
.btn-play.playing{background:#dc2626;box-shadow:0 1px 3px rgba(220,38,38,.35)}
.btn-play.playing:hover{background:#b91c1c}
.btn-apply{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;box-shadow:0 1px 4px rgba(124,58,237,.4);font-weight:700}
.btn-apply:hover{background:linear-gradient(135deg,#6d28d9,#4338ca);box-shadow:0 2px 8px rgba(124,58,237,.5)}
.slider-wrap{flex:1;display:flex;align-items:center;gap:10px;min-width:180px}
.slider-wrap input[type="range"]{flex:1;accent-color:#3b82f6;height:4px;min-width:80px}
.time-label{font-size:12px;color:#cbd5e1;font-variant-numeric:tabular-nums;min-width:38px;text-align:right;font-weight:500}
.modal-info{display:flex;gap:10px;align-items:center;margin-left:auto}
.res-meta{display:flex;align-items:center;gap:6px}
.res-meta svg{color:#64748b}
.res-meta span{font-size:11px;color:#94a3b8;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.res-select{background:#1e2533;color:#e2e8f0;border:1px solid #2d3748;border-radius:7px;padding:5px 8px;font-size:11px;font-weight:600;cursor:pointer;outline:none}
.res-select:focus{border-color:#3b82f6}
.res-select option{background:#1e2533;color:#e2e8f0}
.btn-export{background:#059669;color:#fff;box-shadow:0 1px 3px rgba(5,150,105,.35)}
.btn-export:hover{background:#047857}
.btn-export.recording{background:#dc2626;animation:pulse 1s infinite}
.btn-frame{background:#1e2533;color:#cbd5e1;border:1px solid #2d3748}
.btn-frame:hover{background:#2d3748;color:#f1f5f9;border-color:#3b82f6}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}

/* Tabs */
.tab-btn{padding:6px 14px;border-radius:7px;border:none;font-size:11px;font-weight:700;cursor:pointer;background:transparent;color:#7c8798;transition:all .15s;letter-spacing:.2px}
.tab-btn:hover{color:#cbd5e1;background:#1e2533}
.tab-btn.active{color:#fff;background:#2563eb}

/* CodeMirror wrapper */
.code-wrap{display:none;overflow:auto}
.code-wrap.active{display:block}
.code-wrap .CodeMirror{height:max(420px,52vh);border-radius:0 0 10px 10px}

.code-tabs{padding:10px 16px 0;display:flex;gap:4px;align-items:center;border-bottom:1px solid #1e2533}
.code-tab{padding:7px 16px;border-radius:7px 7px 0 0;border:none;font-size:11px;font-weight:700;cursor:pointer;background:transparent;color:#7c8798;transition:all .15s;letter-spacing:.2px}
.code-tab:hover{color:#cbd5e1}
.code-tab.active{color:#e2e8f0;background:#1e293b}
.code-tab.active[data-lang="html"]{color:#86efac}
.code-tab.active[data-lang="css"]{color:#93c5fd}
.code-tab.active[data-lang="js"]{color:#fde047}
.unsaved-badge{display:none;align-items:center;gap:5px;margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#fbbf24;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);padding:4px 10px;border-radius:20px}
.unsaved-badge.on{display:inline-flex}
.unsaved-badge .dot{width:6px;height:6px;border-radius:50%;background:#fbbf24}

@media(max-width:768px){
    .header,.grid{padding-left:16px;padding-right:16px}
    .grid{grid-template-columns:1fr 1fr}
    .modal{margin:8px}
    .modal-controls{gap:8px;padding:10px 12px}
    .modal-info{margin-left:0;width:100%;justify-content:space-between}
    .code-wrap .CodeMirror{height:60vh}
}
@media(max-width:480px){
    .grid{grid-template-columns:1fr}
    .modal-controls{flex-direction:column;align-items:stretch}
    .slider-wrap{min-width:0}
    .modal-info{flex-wrap:wrap}
}
</style>
</head>
<body>

<div class="header">
    <h1>HTML-in-Canvas Renderer</h1>
    <p>SVG foreignObject — zero dependencies, full CSS support, 16 animated presets (incl. LaTeX/MDX/Custom-Font/Tailwind) with live preview & WebM export.</p>
</div>

<div class="grid" id="presetGrid"></div>

<!-- Preview Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <div class="modal-header">
            <span class="modal-title" id="modalTitle">Preset</span>
            <div style="display:flex;gap:4px;align-items:center">
                <button class="tab-btn active" id="tabPreview">Preview</button>
                <button class="tab-btn" id="tabCode">Code</button>
            </div>
            <button class="modal-close" id="modalClose">&times;</button>
        </div>
        <div class="modal-body">
        <div id="previewPanel">
            <div class="modal-canvas-wrap">
                <canvas id="modalCanvas" width="800" height="450"></canvas>
            </div>
            <div class="modal-controls">
                <button class="btn btn-play" id="modalPlayBtn">
                    <svg id="playIcon" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72c0 .81.87 1.3 1.55.88l10.8-6.86a1.03 1.03 0 0 0 0-1.76L9.55 4.26A1.03 1.03 0 0 0 8 5.14z"/></svg>
                    <svg id="pauseIcon" width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z"/></svg>
                    <span id="playLabel">Play</span>
                </button>
                <div class="slider-wrap">
                    <input type="range" id="modalSlider" min="0" max="5000" value="0">
                    <span class="time-label" id="modalTime">0.0s</span>
                </div>
                <div class="modal-info">
                    <div class="res-meta">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                        <span id="modalDuration"></span>
                    </div>
                    <select id="resSelect" class="res-select">
                        <option value="480">480p</option>
                        <option value="720">720p</option>
                        <option value="1080" selected>1080p</option>
                        <option value="1440">1440p</option>
                    </select>
                    <button class="btn btn-frame" id="frameBtn" title="Save current frame at the selected resolution & format">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                        <span>Save Frame</span>
                    </button>
                    <select id="fmtSelect" class="res-select" title="Frame image format">
                        <option value="png" selected>PNG</option>
                        <option value="jpeg">JPG</option>
                        <option value="webp">WebP</option>
                    </select>
                    <button class="btn btn-export" id="exportBtn">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        <span>Export WebM</span>
                    </button>
                </div>
            </div>
        </div>
        <div id="codePanel" style="display:none">
            <div class="code-tabs">
                <button class="code-tab active" data-lang="html">HTML</button>
                <button class="code-tab" data-lang="css">CSS</button>
                <button class="code-tab" data-lang="js">JS</button>
                <span class="unsaved-badge" id="unsavedBadge"><span class="dot"></span>Unsaved</span>
                <button class="btn btn-apply" id="applyCode" style="margin-left:8px">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    Apply &amp; Preview
                </button>
            </div>
            <div class="code-wrap active" id="cmHtmlWrap"><textarea id="codeHtml"></textarea></div>
            <div class="code-wrap" id="cmCssWrap"><textarea id="codeCss"></textarea></div>
            <div class="code-wrap" id="cmJsWrap"><textarea id="codeJs"></textarea></div>
        </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════════
 * SVG foreignObject Renderer
 * ═══════════════════════════════════════════════════════════════ */
class Renderer {
    constructor(w, h) {
        this.w = w; this.h = h;
        this.canvas = document.createElement('canvas');
        this.canvas.width = w; this.canvas.height = h;
        this.ctx = this.canvas.getContext('2d');
        this.sandbox = document.createElement('div');
        this.sandbox.style.cssText = 'position:absolute;top:-9999px;left:-9999px;width:800px;height:450px;overflow:hidden;pointer-events:none;';
        document.body.appendChild(this.sandbox);
        this.css = ''; this._onFrame = null; this._ready = false;
    }

    async setClip(html, css, js) {
        this.css = css || '';
        this.sandbox.innerHTML = '<div style="width:800px;height:450px;"></div>';
        /* 1. Load external scripts (KaTeX, marked, Tailwind CDN) in page context */
        html = await this._loadExternalScripts(html);
        /* 2. Inline external images as data URIs */
        html = await this._preloadImages(html);
        /* 3. Mount the html so the Tailwind Play CDN's MutationObserver sees the classes
              and generates its utilities <style> — then capture that CSS for the SVG.
              GATED: only when the clip actually uses Tailwind utilities. Once the CDN
              runtime is loaded it emits a preflight reset stylesheet for EVERY DOM
              change; capturing that unconditionally would append h1{font-size:inherit}
              etc. after the preset's own CSS and collapse its typography. */
        this.sandbox.innerHTML = html;
        var _usesTw = /class="[^"]*\b(bg-|text-|flex|grid-|p[xytblr]?-|m[xytblr]?-|rounded|shadow|font-|border|min-h-|max-w-|w-|h-|gap-|mt-|mb-|tracking-|from-|to-)/.test(html) || html.indexOf('tailwindcss') !== -1;
        if (_usesTw) {
            /* v4 browser build compiles async on MutationObserver (no window global).
               Poll for its managed <style> (identifiable by --tw- markers), then
               capture it for the SVG. Gated on _usesTw so the preflight reset it
               emits for every DOM change never pollutes non-Tailwind presets. */
            var twStyle = null;
            for (var _twWait = 0; _twWait < 20 && !twStyle; _twWait++) {
                await new Promise(r => setTimeout(r, 50));
                twStyle = [...document.querySelectorAll('head style')]
                    .filter(s => (s.textContent || '').indexOf('--tw-') !== -1)
                    .pop();
            }
            if (twStyle) this.css = (css || '') + '\n' + twStyle.textContent;
        }
        /* 4. Embed remote stylesheets (Google Fonts, KaTeX CSS) + their fonts as data URIs.
              SVG rasterization can't load external resources, so this is what makes them work. */
        const processed = await this._embedAssets(html, this.css);
        html = processed.html;
        this.css = processed.css;
        this.sandbox.innerHTML = html;
        /* 5. Wait for fonts to be ready so first raster isn't fallback-font */
        try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch(e) {}
        this._onFrame = null;
        if (js) {
            try {
                /* Wrap js so onFrame returns correctly */
                var fn = new Function('time', js + '\n;return typeof onFrame==="function"?onFrame:null;');
                this._onFrame = fn();
            } catch(e) { console.error('[Renderer] JS parse error:', e); }
        }
        this._ready = true;
    }

    /* External <script src> / <link rel=stylesheet> inside preset HTML — hoist into <head>.
       Scripts load SEQUENTIALLY (dynamically inserted scripts don't honor defer order,
       and auto-render must never beat katex.min.js to the global scope). */
    async _loadExternalScripts(html) {
        const parser = new DOMParser();
        const doc = parser.parseFromString('<div>' + html + '</div>', 'text/html');
        /* Stylesheets: left untouched — _embedAssets (next step in setClip) strips them from the
           html and inlines their content + fonts as data URIs. Rewriting or hoisting them here
           would lose the URL before the embed step can fetch it. */
        /* Scripts: sequential chain, each waits for the previous */
        const srcs = [...doc.querySelectorAll('script[src]')].map(s => { const v = s.getAttribute('src'); s.remove(); return v; }).filter(Boolean);
        for (const src of srcs) {
            if (src.indexOf('tailwind') !== -1) continue; /* CDN runtime handled separately */
            if (document.querySelector('script[src="' + src + '"]')) continue;
            await new Promise(res => {
                const s = document.createElement('script');
                s.src = src;
                if (src.indexOf('jsdelivr') !== -1 || src.indexOf('crossorigin') !== -1) s.crossOrigin = 'anonymous';
                s.onload = res; s.onerror = res;
                document.head.appendChild(s);
            });
        }
        html = doc.querySelector('div').innerHTML;
        /* Tailwind runtime loaded once globally from the locally installed
           @tailwindcss/browser (same 4.3.3 version as the app's PostCSS toolchain) —
           no CDN, works offline, and no "should not be used in production" warning.
           v4 sets no window global; it appends a managed <style> to <head> and
           compiles on MutationObserver — capture happens in setClip. */
        if (html.indexOf('tailwindcss') !== -1 || /class="[^"]*\b(bg-|text-|flex|grid-|p[xytblr]?-|m[xytblr]?-|rounded|shadow|font-|border)/.test(html)) {
            if (!document.getElementById('tw-browser-runtime')) {
                await new Promise(res => {
                    const s = document.createElement('script');
                    s.id = 'tw-browser-runtime';
                    /* Site base derived from this page's own URL: '/studio-pro/' on
                       GitHub Pages, '/' locally (page lives at <base>docs/...). An
                       absolute '/vendor/...' would 404 under the Pages base. */
                    var _slashDocs = location.pathname.indexOf('/docs/');
                    var _siteBase = _slashDocs > 0 ? location.pathname.slice(0, _slashDocs + 1) : '/';
                    s.src = _siteBase + 'vendor/tailwind-browser/index.global.js';
                    s.onload = res; s.onerror = res;
                    document.head.appendChild(s);
                    setTimeout(res, 3000); /* don't hang offline */
                });
            }
        }
        return html;
    }

    /* Fetch remote stylesheets (Google Fonts, KaTeX CDN, any https <link rel=stylesheet>)
       + their font files, inline everything as @font-face / url data URIs. The SVG
       rasterizer can't load external resources, so this is what makes web fonts work. */
    async _embedAssets(html, css) {
        const urls = [];
        const linkRe = /<link[^>]*href=["'](https:\/\/fonts\.googleapis\.com[^"']*)["'][^>]*>/gi;
        html = html.replace(linkRe, (_, url) => { urls.push(url.replace(/&amp;/g, '&')); return ''; });
        /* Any other remote stylesheet (KaTeX CSS, Tailwind builds, etc.) */
        const cdnLinkRe = /<link[^>]*rel=["']stylesheet["'][^>]*href=["'](https?:\/\/[^"']+)["'][^>]*>/gi;
        const cdnLinkRe2 = /<link[^>]*href=["'](https?:\/\/[^"']+)["'][^>]*rel=["']stylesheet["'][^>]*>/gi;
        html = html.replace(cdnLinkRe, (_, url) => { urls.push(url.replace(/&amp;/g, '&')); return ''; });
        html = html.replace(cdnLinkRe2, (_, url) => { urls.push(url.replace(/&amp;/g, '&')); return ''; });
        const importRe = /@import\s+(?:url\()?["']?(https:\/\/fonts\.googleapis\.com[^"')\s]*)["']?\)?\s*;/gi;
        css = css.replace(importRe, (_, url) => { urls.push(url.replace(/&amp;/g, '&')); return ''; });
        let fontCss = '';
        for (const url of urls) {
            if (_fontCssCache[url]) { fontCss += _fontCssCache[url] + '\n'; continue; }
            try {
                const res = await fetch(url);
                if (!res.ok) continue;
                let sheet = await res.text();
                /* Collect every url(...) — absolute or relative (resolved against the sheet's base URL,
                   e.g. KaTeX ships `url(fonts/KaTeX_AMS-Regular.woff2)`) */
                const refs = [];
                const urlRe = /url\(\s*['"]?([^'")]+?)['"]?\s*\)/g;
                let mm;
                while ((mm = urlRe.exec(sheet)) !== null) {
                    const raw = mm[1];
                    if (/^data:/i.test(raw)) continue;
                    let abs = raw;
                    if (!/^https?:\/\//i.test(raw)) {
                        try { abs = new URL(raw, url).href; } catch(e) { continue; }
                    }
                    refs.push({ raw, abs });
                }
                /* Fetch unique absolute URLs once, then replace each ORIGINAL relative/absolute
                   occurrence in the sheet — split() on the absolute URL would miss relative paths */
                const uniqAbs = Array.from(new Set(refs.map(r => r.abs)));
                const dataMap = {};
                await Promise.all(uniqAbs.map(async abs => {
                    try {
                        const r = await fetch(abs);
                        const blob = await r.blob();
                        dataMap[abs] = await new Promise(resolve => {
                            const reader = new FileReader();
                            reader.onloadend = () => resolve(reader.result);
                            reader.readAsDataURL(blob);
                        });
                    } catch(e) {}
                }));
                refs.forEach(ref => { const d = dataMap[ref.abs]; if (d) sheet = sheet.split(ref.raw).join(d); });
                _fontCssCache[url] = sheet;
                fontCss += sheet + '\n';
            } catch(e) { console.warn('[Renderer] Font fetch failed:', url); }
        }
        return { html, css: fontCss + '\n' + css };
    }

    async _preloadImages(htmlString) {
        const parser = new DOMParser();
        /* Wrap in a div: a bare parse hoists leading <link> into <head>, and body.innerHTML
           would silently drop it before _embedAssets ever sees the URL */
        const doc = parser.parseFromString('<div>' + htmlString + '</div>', 'text/html');
        const images = doc.querySelectorAll('img');
        const promises = Array.from(images).map(async (img) => {
            const src = img.getAttribute('src');
            if (src && (src.startsWith('http://') || src.startsWith('https://'))) {
                try {
                    const resp = await fetch(src, { mode: 'cors' });
                    if (!resp.ok) throw new Error('fail');
                    const blob = await resp.blob();
                    const dataUrl = await new Promise((res, rej) => {
                        const reader = new FileReader();
                        reader.onloadend = () => res(reader.result);
                        reader.onerror = rej;
                        reader.readAsDataURL(blob);
                    });
                    img.setAttribute('src', dataUrl);
                } catch(e) { /* keep original src as fallback */ }
            }
        });
        await Promise.allSettled(promises);
        return doc.querySelector('div').innerHTML;
    }

    renderFrame(timeMs) {
        if (!this._ready) return false;
        if (this._onFrame) {
            const origQSA = Document.prototype.querySelectorAll;
            const origGEBI = Document.prototype.getElementById;
            const sandbox = this.sandbox;
            Document.prototype.querySelectorAll = function(sel) { return sandbox.querySelectorAll(sel); };
            Document.prototype.getElementById = function(id) { return sandbox.querySelector('#' + id) || origGEBI.call(document, id); };
            try { this._onFrame(timeMs); } catch(e) { console.error('[Renderer] onFrame error:', e); }
            Document.prototype.querySelectorAll = origQSA;
            Document.prototype.getElementById = origGEBI;
        }
        const clone = this.sandbox.cloneNode(true);
        clone.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
        clone.setAttribute('style', 'width:100%;height:100%;margin:0;padding:0;overflow:hidden;');
        const domString = new XMLSerializer().serializeToString(clone);
        const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + this.w + '" height="' + this.h + '">' +
            '<foreignObject width="100%" height="100%">' +
            '<style xmlns="http://www.w3.org/1999/xhtml"><![CDATA[' + this.css + ']]></style>' +
            '<div xmlns="http://www.w3.org/1999/xhtml" style="width:' + this.w + 'px;height:' + this.h + 'px;overflow:hidden;">' +
            domString + '</div></foreignObject></svg>';
        return new Promise(resolve => {
            const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
            const img = new Image();
            img.onload = () => { this.ctx.clearRect(0, 0, this.w, this.h); this.ctx.drawImage(img, 0, 0); resolve(true); };
            img.onerror = () => { this.ctx.fillStyle = '#1e293b'; this.ctx.fillRect(0, 0, this.w, this.h); this.ctx.fillStyle = '#f87171'; this.ctx.font = '14px sans-serif'; this.ctx.fillText('Render Error', 16, 24); resolve(false); };
            img.src = url;
        });
    }

    drawTo(targetCtx, x, y, w, h) { targetCtx.drawImage(this.canvas, 0, 0, this.w, this.h, x, y, w, h); }

/* ═══════════════════════════════════════════════════════════════
 * CARD GRID
 * ═══════════════════════════════════════════════════════════════ */
const W = 800, H = 450;
const grid = document.getElementById('presetGrid');
const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalCanvas = document.getElementById('modalCanvas');
const modalPlayBtn = document.getElementById('modalPlayBtn');
const modalSlider = document.getElementById('modalSlider');
const modalTime = document.getElementById('modalTime');
const modalDuration = document.getElementById('modalDuration');
const modalClose = document.getElementById('modalClose');
const modalCtx = modalCanvas.getContext('2d');
let modalRenderer = null;
let modalPlaying = false;
let modalStart = 0;
let modalKey = null;

for (const [key, p] of Object.entries(PRESETS)) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.key = key;
    card.innerHTML =
        '<canvas width="' + W + '" height="' + H + '"></canvas>' +
        '<div class="card-label">' +
        '<span class="card-name">' + p.name + '</span>' +
        '</div>';
    card.addEventListener('click', () => openModal(key));
    grid.appendChild(card);
}

/* Render last frame (end state) per card for better thumbnails */
(async () => {
    for (const [key, p] of Object.entries(PRESETS)) {
        const canvas = grid.querySelector('[data-key="' + key + '"] canvas');
        const r = new Renderer(W, H);
        await r.setClip(p.html, p.css, p.js);
        /* Render near the end so all animations are in their final state */
        const endMs = (p.dur || 5) * 1000 - 16;
        const ok = await r.renderFrame(endMs);
        if (ok) r.drawTo(canvas.getContext('2d'), 0, 0, W, H);
        r.sandbox.remove();
    }
})();

/* ═══════════════════════════════════════════════════════════════
 * MODAL
 * ═══════════════════════════════════════════════════════════════ */
function openModal(key) {
    const p = PRESETS[key];
    if (!p) return;
    modalKey = key;
    currentPresetKey = key;
    tabPreview.click();
    modalTitle.textContent = p.name;
    modalDuration.textContent = p.dur + 's • ' + W + '×' + H;
    modalSlider.max = p.dur * 1000;
    modalSlider.value = 0;
    modalTime.textContent = '0.0s';
    modalPlaying = false;
    setPlayState(false);
    unsavedBadge.classList.remove('on');
    modalOverlay.classList.add('open');
    if (modalRenderer) { modalRenderer.sandbox.remove(); modalRenderer = null; }
    modalRenderer = new Renderer(W, H);
    modalRenderer.setClip(p.html, p.css, p.js).then(() => {
        /* Auto-play the animation once clip is loaded */
        modalPlaying = true;
        modalStart = performance.now();
        setPlayState(true);
        tickModal();
    });
}

function closeModal() {
    modalPlaying = false;
    modalOverlay.classList.remove('open');
    modalKey = null;
}

modalClose.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', function(e) { if (e.target === modalOverlay) closeModal(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

modalPlayBtn.addEventListener('click', function() {
        if (modalPlaying) {
        modalPlaying = false;
        setPlayState(false);
    } else {
        modalPlaying = true;
        modalStart = performance.now() - parseInt(modalSlider.value);
        setPlayState(true);
        tickModal();
    }
});

modalSlider.addEventListener('input', function() {
    if (modalPlaying) return;
    const t = parseInt(this.value);
    modalTime.textContent = (t / 1000).toFixed(1) + 's';
    if (modalRenderer && modalRenderer._ready) {
        modalRenderer.renderFrame(t).then(ok => {
            if (ok) modalRenderer.drawTo(modalCtx, 0, 0, W, H);
        });
    }
});

async function tickModal() {
    const dur = (PRESETS[modalKey] || {}).dur || 5;
    while (modalPlaying && modalKey) {
        const t = (performance.now() - modalStart) % (dur * 1000);
        modalSlider.value = Math.floor(t);
        modalTime.textContent = (t / 1000).toFixed(1) + 's';
        try {
            if (modalRenderer && modalRenderer._ready) {
                const ok = await modalRenderer.renderFrame(t);
                if (ok) modalRenderer.drawTo(modalCtx, 0, 0, W, H);
            }
        } catch(e) { console.error('[Modal] render error:', e); }
        await new Promise(r => requestAnimationFrame(r));
    }
}

/* ═══════════════════════════════════════════════════════════════
 * Code Prettifiers — format minified code for readability
 * ═══════════════════════════════════════════════════════════════ */
function prettifyHtml(html) {
    if (!html) return '';
    var s = html.replace(/></g, '>\n<');
    var lines = s.split('\n');
    var out = [], indent = 0;
    var selfClose = /^<(br|hr|img|input|link|meta|source|area|base|col|embed|param|track|wbr)\b/i;
    var closeTag = /^<\//;
    var openTag = /^<[a-zA-Z]/;
    lines.forEach(function(line) {
        line = line.trim();
        if (!line) return;
        if (closeTag.test(line)) indent = Math.max(0, indent - 1);
        out.push('  '.repeat(indent) + line);
        if (openTag.test(line) && !selfClose.test(line) && !closeTag.test(line) && !/\//.test(line) && !/\/>/.test(line)) {
            indent++;
        }
    });
    return out.join('\n');
}

function prettifyCss(css) {
    if (!css) return '';
    var s = css.replace(/\{/g, ' {\n  ').replace(/\}/g, '\n}').replace(/;([^}])/g, ';\n  $1');
    var lines = s.split('\n');
    var out = [];
    lines.forEach(function(line) {
        line = line.trimRight();
        if (line === '}') out.push('}');
        else if (line) out.push(line);
    });
    return out.join('\n');
}

function prettifyJs(js) {
    if (!js) return '';
    var s = js
        .replace(/;/g, ';\n')
        .replace(/\{/g, ' {\n  ')
        .replace(/\}/g, '\n}\n')
        .replace(/,\s*var /g, ',\nvar ')
        .replace(/\n\n+/g, '\n');
    var lines = s.split('\n');
    var out = [], indent = 0;
    lines.forEach(function(line) {
        line = line.trim();
        if (!line) return;
        if (line[0] === '}') indent = Math.max(0, indent - 1);
        out.push('  '.repeat(indent) + line);
        if (/\{\s*$/.test(line)) indent++;
    });
    return out.join('\n');
}

/* Play/pause button state — swap SVG icons + label instead of innerHTML text soup */
function setPlayState(playing) {
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const label = document.getElementById('playLabel');
    if (playing) {
        playIcon.style.display = 'none';
        pauseIcon.style.display = '';
        label.textContent = 'Pause';
        modalPlayBtn.classList.add('playing');
    } else {
        playIcon.style.display = '';
        pauseIcon.style.display = 'none';
        label.textContent = 'Play';
        modalPlayBtn.classList.remove('playing');
    }
}

/* Unsaved-changes badge: CodeMirror 'change' events vs the last applied snapshot */
const unsavedBadge = document.getElementById('unsavedBadge');
let _lastAppliedCode = { html: '', css: '', js: '' };
function updateUnsavedBadge() {
    if (!currentPresetKey) { unsavedBadge.classList.remove('on'); return; }
    const dirty = cmHtml.getValue() !== _lastAppliedCode.html
        || cmCss.getValue() !== _lastAppliedCode.css
        || cmJs.getValue() !== _lastAppliedCode.js;
    unsavedBadge.classList.toggle('on', dirty);
}

/* Initialize CodeMirror editors */
const cmHtml = CodeMirror.fromTextArea(document.getElementById('codeHtml'), {
    mode: 'htmlmixed', theme: 'dracula', lineNumbers: true, tabSize: 2, lineWrapping: true
});
const cmCss = CodeMirror.fromTextArea(document.getElementById('codeCss'), {
    mode: 'css', theme: 'dracula', lineNumbers: true, tabSize: 2, lineWrapping: true
});
const cmJs = CodeMirror.fromTextArea(document.getElementById('codeJs'), {
    mode: 'javascript', theme: 'dracula', lineNumbers: true, tabSize: 2, lineWrapping: true
});

/* Track edits for the Unsaved badge */
[cmHtml, cmCss, cmJs].forEach(function(cm) { cm.on('change', updateUnsavedBadge); });

function switchCodeLang(lang) {
    document.querySelectorAll('.code-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.code-wrap').forEach(e => e.classList.remove('active'));
    document.querySelector('[data-lang="' + lang + '"]').classList.add('active');
    var wrap = lang === 'html' ? 'cmHtmlWrap' : lang === 'css' ? 'cmCssWrap' : 'cmJsWrap';
    document.getElementById(wrap).classList.add('active');
    /* Refresh CM after display change */
    var cm = lang === 'html' ? cmHtml : lang === 'css' ? cmCss : cmJs;
    setTimeout(function() { cm.refresh(); }, 10);
}

document.querySelectorAll('.code-tab').forEach(function(btn) {
    btn.addEventListener('click', function() { switchCodeLang(btn.dataset.lang); });
});

tabPreview.addEventListener('click', function() {
    tabPreview.classList.add('active');
    tabCode.classList.remove('active');
    previewPanel.style.display = '';
    codePanel.style.display = 'none';
});

tabCode.addEventListener('click', function() {
    tabCode.classList.add('active');
    tabPreview.classList.remove('active');
    codePanel.style.display = '';
    previewPanel.style.display = 'none';
    if (currentPresetKey && PRESETS[currentPresetKey]) {
        var p = PRESETS[currentPresetKey];
        cmHtml.setValue(prettifyHtml(p.html || ''));
        cmCss.setValue(prettifyCss(p.css || ''));
        cmJs.setValue(prettifyJs(p.js || ''));
        _lastAppliedCode = { html: cmHtml.getValue(), css: cmCss.getValue(), js: cmJs.getValue() };
        updateUnsavedBadge();
        setTimeout(function() { cmHtml.refresh(); cmCss.refresh(); cmJs.refresh(); }, 50);
    }
});

applyCode.addEventListener('click', async function() {
    if (!currentPresetKey) return;
    modalPlaying = false;
    setPlayState(false);
    if (modalRenderer) { modalRenderer.sandbox.remove(); }
    modalRenderer = new Renderer(W, H);
    await modalRenderer.setClip(cmHtml.getValue(), cmCss.getValue(), cmJs.getValue());
    _lastAppliedCode = { html: cmHtml.getValue(), css: cmCss.getValue(), js: cmJs.getValue() };
    updateUnsavedBadge();
    const ok = await modalRenderer.renderFrame(0);
    if (ok) modalRenderer.drawTo(modalCtx, 0, 0, W, H);
    modalSlider.value = 0;
    modalTime.textContent = '0.0s';
    modalPlaying = true;
    modalStart = performance.now();
    setPlayState(true);
    tabPreview.click();
    tickModal();
});

/* ═══════════════════════════════════════════════════════════════
 * RESOLUTION SELECTOR — controls export pixel count
 * ═══════════════════════════════════════════════════════════════ */
const resSelect = document.getElementById('resSelect');
const RESOLUTIONS = {
    '480': { w: 854, h: 480 },
    '720': { w: 1280, h: 720 },
    '1080': { w: 1920, h: 1080 },
    '1440': { w: 2560, h: 1440 }
};

/* ══════════════════════════════════════════════════════════════
 * FRAME EXPORT — save the current playhead frame as PNG / JPG / WebP
 * at the selected resolution. Uses the same dedicated scale-wrapper
 * geometry as the WebM export, in a detached renderer, so the live
 * modal state (playhead, playing flag, visible canvas) is untouched.
 * ═══════════════════════════════════════════════════════════════ */
const frameBtn = document.getElementById('frameBtn');
const fmtSelect = document.getElementById('fmtSelect');
const FMT_META = { png: { ext: 'png', mime: 'image/png' }, jpeg: { ext: 'jpg', mime: 'image/jpeg' }, webp: { ext: 'webp', mime: 'image/webp' } };

frameBtn.addEventListener('click', async function() {
    if (!currentPresetKey || !PRESETS[currentPresetKey] || exporting) return;
    const p = PRESETS[currentPresetKey];
    const res = RESOLUTIONS[resSelect.value] || RESOLUTIONS['1080'];
    const fmt = FMT_META[fmtSelect.value] || FMT_META.png;
    const t = parseInt(modalSlider.value); /* current playhead position, ms */

    frameBtn.disabled = true;
    frameBtn.querySelector('span').textContent = 'Rendering\u2026';
    let fr = null;
    try {
        /* Detached renderer at export resolution (sandbox is offscreen) */
        fr = new Renderer(res.w, res.h);
        await fr.setClip(p.html, p.css, p.js);

        /* Same wrapper fix as the WebM export: scale OUR 800x450 wrapper,
           never the preset's own first element (min-h-full / display:none
           preset roots would break the geometry otherwise). */
        const scaleX = res.w / W, scaleY = res.h / H;
        const wrap = document.createElement('div');
        wrap.style.cssText = 'width:' + W + 'px;height:' + H + 'px;overflow:hidden;transform-origin:0 0;transform:scale(' + scaleX + ',' + scaleY + ');';
        while (fr.sandbox.firstChild) { wrap.appendChild(fr.sandbox.firstChild); }
        fr.sandbox.appendChild(wrap);
        fr.sandbox.style.width = res.w + 'px';
        fr.sandbox.style.height = res.h + 'px';
        fr.sandbox.style.overflow = 'hidden';

        const okFlag = await fr.renderFrame(t);
        if (!okFlag) throw new Error('raster failed');

        const url = fr.canvas.toDataURL(fmt.mime, 0.95);
        const a = document.createElement('a');
        a.href = url;
        a.download = currentPresetKey + '_frame_' + t + 'ms_' + res.w + 'x' + res.h + '.' + fmt.ext;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    } catch (e) {
        console.error('[FrameExport]', e);
        alert('Frame export failed \u2014 try again');
    } finally {
        if (fr && fr.sandbox) fr.sandbox.remove();
        frameBtn.disabled = false;
        frameBtn.querySelector('span').textContent = 'Save Frame';
    }
});

/* ═══════════════════════════════════════════════════════════════WEBM EXPORT — MediaRecorder API
 * ═══════════════════════════════════════════════════════════════ */
const exportBtn = document.getElementById('exportBtn');
let exporting = false;

exportBtn.addEventListener('click', async function() {
    if (exporting) return;
    if (!currentPresetKey || !PRESETS[currentPresetKey]) return;
    const p = PRESETS[currentPresetKey];
    const dur = p.dur || 5;
    const fps = 30;

    /* Get export resolution */
    const res = RESOLUTIONS[resSelect.value] || RESOLUTIONS['1080'];
    const expW = res.w;
    const expH = res.h;
    const scaleX = expW / W;
    const scaleY = expH / H;

    exporting = true;
    exportBtn.querySelector('span').textContent = 'Recording...';
    exportBtn.classList.add('recording');
    modalPlaying = false;
    setPlayState(false);

    /* Size the visible canvas to export resolution */
    modalCanvas.width = expW;
    modalCanvas.height = expH;

    /* Build renderer at export resolution with scale transform */
    if (modalRenderer) { modalRenderer.sandbox.remove(); }
    modalRenderer = new Renderer(expW, expH);
    await modalRenderer.setClip(p.html, p.css, p.js);

    /* Dedicated 800x450 scale wrapper: move ALL sandbox children into it and scale up.
       Styling the preset's own first element breaks when that element is display:none
       (MDX's hidden markdown source -> unscaled output) or uses min-h-full (Tailwind —
       min-height:100% then resolves against the 1920x1080 sandbox, not 450px). */
    const wrap = document.createElement('div');
    wrap.style.cssText = 'width:' + W + 'px;height:' + H + 'px;overflow:hidden;transform-origin:0 0;transform:scale(' + scaleX + ',' + scaleY + ');';
    while (modalRenderer.sandbox.firstChild) { wrap.appendChild(modalRenderer.sandbox.firstChild); }
    modalRenderer.sandbox.appendChild(wrap);
    modalRenderer.sandbox.style.width = expW + 'px';
    modalRenderer.sandbox.style.height = expH + 'px';
    modalRenderer.sandbox.style.overflow = 'hidden';

    /* captureStream from visible canvas */
    const stream = modalCanvas.captureStream(fps);
    let mimeType = 'video/webm;codecs=vp9';
    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';
    const recorder = new MediaRecorder(stream, { mimeType: mimeType });
    const chunks = [];
    recorder.ondataavailable = function(e) { if (e.data && e.data.size > 0) chunks.push(e.data); };

    const done = new Promise(function(resolve) {
        recorder.onstop = function() {
            const blob = new Blob(chunks, { type: 'video/webm' });
            if (blob.size > 100) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = currentPresetKey + '_' + expW + 'x' + expH + '.webm';
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
            } else { alert('Export failed — try again'); }
            exporting = false;
            exportBtn.querySelector('span').textContent = 'Export WebM';
            exportBtn.classList.remove('recording');
            /* Restore preview canvas to 800x450 */
            modalCanvas.width = W;
            modalCanvas.height = H;
            resolve();
        };
    });

    recorder.start();

    /* Render each frame at export resolution to visible canvas */
    for (let frame = 0; frame < dur * fps; frame++) {
        const t = (frame / fps) * 1000;
        modalSlider.value = Math.floor(t);
        modalTime.textContent = (t / 1000).toFixed(1) + 's';
        try {
            const ok = await modalRenderer.renderFrame(t);
            if (ok) modalRenderer.drawTo(modalCtx, 0, 0, expW, expH);
        } catch(e) { console.error('[Export] frame error:', e); }
        await new Promise(function(r) { requestAnimationFrame(r); });
    }

    recorder.stop();
    await done;

    /* Rebuild preview renderer at 800x450 */
    if (modalRenderer) { modalRenderer.sandbox.remove(); }
    modalRenderer = new Renderer(W, H);
    await modalRenderer.setClip(p.html, p.css, p.js);
    const ok = await modalRenderer.renderFrame(0);
    if (ok) modalRenderer.drawTo(modalCtx, 0, 0, W, H);
});

</script>
</body>
