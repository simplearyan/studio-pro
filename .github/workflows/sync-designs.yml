name: Sync designs gallery

# Google Form → Sheet → this Action → designs-gallery.json on the
# `designs-data` branch (NOT main).
#
# Why a data branch: this workflow commits every ~6 h, which used to force
# every human push to main to rebase over bot commits ("fetch first"
# rejections). The JSON now lives only on designs-data; main never receives
# bot commits and pushes are always fast-forward. The gallery page fetches
# the JSON live from raw.githubusercontent.com/…/designs-data/… (with the
# stale main copy as offline fallback), so no Pages redeploy is needed for
# gallery updates.

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-designs
  cancel-in-progress: false

env:
  DATA_BRANCH: designs-data
  DATA_PATH: docs/html-in-canvas/designs-gallery.json

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (default branch — for the sync script)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Get current gallery from the data branch (seed from checkout on first run)
        run: |
          if git fetch origin "$DATA_BRANCH"; then
            git show "FETCH_HEAD:$DATA_PATH" > "$DATA_PATH"
            echo "Loaded existing gallery from $DATA_BRANCH"
          else
            echo "No $DATA_BRANCH yet — seeding from the default branch snapshot"
          fi

      - name: Sync gallery from Google Sheet
        run: python tools/sync_designs.py

      - name: Commit updated gallery to the data branch (if changed)
        run: |
          if git diff --quiet "$DATA_PATH" && [ -n "$(git rev-parse -q --verify origin/$DATA_BRANCH 2>/dev/null || true)" ] && git show "origin/$DATA_BRANCH:$DATA_PATH" | git diff --quiet "$DATA_PATH" -; then
            echo "No gallery changes — nothing to commit."
            exit 0
          fi
          # Build a commit that contains ONLY the gallery file, on top of the
          # current data-branch head, using a temporary index. The default
          # branch checkout is never modified.
          BLOB=$(git hash-object -w "$DATA_PATH")
          export GIT_INDEX_FILE="$RUNNER_TEMP/data-index"
          git read-tree --empty
          git update-index --add --cacheinfo "100644,$BLOB,$DATA_PATH"
          TREE=$(git write-tree)
          unset GIT_INDEX_FILE
          PARENT=$(git rev-parse -q --verify "origin/$DATA_BRANCH" 2>/dev/null || true)
          if [ -n "$PARENT" ]; then
            COMMIT=$(git commit-tree "$TREE" -p "$PARENT" -m "sync designs gallery from submissions [skip ci]")
          else
            COMMIT=$(git commit-tree "$TREE" -m "sync designs gallery from submissions [skip ci]")
          fi
          git push origin "$COMMIT:refs/heads/$DATA_BRANCH"
          echo "Gallery updated on $DATA_BRANCH — the page fetches it live, no redeploy needed."
