name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # The ROOT build always comes from the default branch, even when this
      # run was triggered by a tag push — otherwise a tag-triggered checkout
      # would build the tag itself as the live root site.
      - name: Checkout (root = default branch)
        uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (current)
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'

      # ── Versioned snapshots ────────────────────────────────────────────
      # Every `v*` tag (e.g. v0.6, v1.0) is built with a per-tag base path and
      # baked into the SAME Pages artifact as a subfolder, so it is served at
      # https://<user>.github.io/<repo>/<tag>/ alongside the current root
      # build. Runs on every branch deploy AND on tag pushes (tags: trigger),
      # so pushing a new v* tag publishes it automatically.
      #
      # Caveat: GitHub runs the workflow file from the PUSHED REF's tree. A
      # tag pointing at an old commit (e.g. v0.6, whose tree has the old
      # branch-only workflow) therefore cannot auto-trigger this pipeline —
      # for those, just re-run "Deploy to GitHub Pages" via workflow_dispatch
      # or push main; the snapshot gets baked in either way. Tags created at
      # commits that already contain this workflow auto-deploy on push.
      - name: Fetch version tags
        run: git fetch --tags --force origin

      - name: Build version snapshots (v* tags)
        run: |
          set -e
          tags="$(git tag -l 'v[0-9]*' | sort -V)"
          if [ -z "$tags" ]; then
            echo "No v* tags found — skipping versioned snapshots."
            exit 0
          fi
          for tag in $tags; do
            echo "Building snapshot for tag $tag → /studio-pro/$tag/"
            rm -rf "_snap_$tag"
            mkdir -p "_snap_$tag"
            git archive "$tag" | tar -x -C "_snap_$tag"
            ( cd "_snap_$tag" && npm ci && npx vite build --base="/studio-pro/$tag/" --outDir dist )
            mkdir -p "dist/$tag"
            cp -r "_snap_$tag/dist/." "dist/$tag/"
            rm -rf "_snap_$tag"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
